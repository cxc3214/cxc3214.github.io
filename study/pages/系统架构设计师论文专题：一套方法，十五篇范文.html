{n:2, short:"段2 摘要·主旨", role:"概括问题、做法与效果", q:"摘要", target:"220", title:"摘要（二）：问题、做法与效果",
 text:"本文结合该项目，论述信创背景下的系统国产化迁移架构设计。平台已有((20 余个))服务和((600 余张))数据表，在不中断全市政务服务的前提下完成迁移，面临{{组件兼容、数据库差异和切换风险}}三方面挑战。我们按层梳理技术栈，对可保留的开源组件进行{{适配验证}}，对数据库等组件进行{{替换}}；数据库迁移采用{{扫描改写、全量加增量同步和逐表校验}}；切换阶段采用{{双轨并行、流量回放和分批切换}}，并准备了回滚方案。最终平台全部迁移至信创环境，最后一次写入切换的停机时间控制在((15 分钟))以内，未发生数据丢失，核心接口性能达到原环境的((95% 以上))。",
 outline:["<b>点题</b>：论述信创背景下的国产化迁移架构设计","<b>规模</b>：20 余个服务、600 余张表；不能中断服务","<b>三项挑战</b>：组件兼容、数据库差异、切换风险","<b>做法</b>：按层适配或替换；扫描改写、同步、校验；双轨、回放、分批、回滚","<b>效果</b>：停机 15 分钟内；无丢失；性能 95% 以上"],
 memo:"选得准、迁得全、切得稳", tip:"三项挑战对应题目第三问点名的三个方面。", explain:["“不能中断全市政务服务”是迁移的核心约束，后面所有方案都围绕它。"]},
{n:3, short:"段3 背景痛点", role:"建设背景与迁移约束", q:"第一问", target:"330", title:"一、项目背景",
 text:"平台一期建设于 2024 年，运行在 x86 服务器上，操作系统、数据库和部分中间件采用国外产品或其社区版本。2025 年，按照本省政务信息系统信创改造的统一部署，平台需要在年内迁移到政务云的{{信创资源池}}，该资源池采用{{国产 ARM 架构服务器和国产操作系统}}，并要求数据库使用国产产品。迁移面临几方面约束：平台是全市政务服务的统一入口，{{不能长时间停机}}，切换必须安排在低峰时段并控制在分钟级；平台已有((20 余个))服务和((600 余张))数据表，部分服务依赖了只提供 x86 版本的第三方组件，{{兼容性情况不明}}；数据库从 MySQL 迁移到国产数据库，{{语法和行为存在差异}}，一旦出错影响的是办件数据；同时四期还在并行建设流程平台和智能办事助手，{{迁移不能拖慢新功能的进度}}。因此，迁移不能简单地“装一遍、拷一遍”，需要从选型、数据和切换三个层面进行系统设计。",
 outline:["<b>原环境</b>：x86 服务器、国外操作系统与数据库","<b>要求</b>：年内迁至信创资源池：国产 ARM、国产 OS、国产数据库","<b>约束一</b>：统一入口，切换须分钟级（伏笔：切换）","<b>约束二</b>：部分组件仅有 x86 版本（伏笔：选型适配）","<b>约束三</b>：数据库语法行为差异（伏笔：数据库迁移）","<b>约束四</b>：不能拖慢四期新功能"],
 memo:"原环境 → 信创要求 → 不停机、兼容不明、数据库差异、并行建设", tip:"迁移题的背景要写清约束，约束决定后面的方案选择。", explain:["四个约束中三个对应三个论点，第四个解释了为何采用分批和自动化手段。"]},
{n:4, short:"段4 本人工作", role:"本人工作", q:"第一问", target:"230", title:"二、本人主要工作",
 text:"四期团队共((15 人))，迁移工作由我牵头，抽调((4 名))后端和运维人员组成迁移小组，平台原有技术栈包括 {{Spring Cloud}}、{{Nacos}}、{{Redis}}、{{Kafka}}、{{MySQL}}、{{Doris}} 和 {{Kubernetes}}。我主要负责：按层梳理平台的{{技术栈清单}}，确定每个组件是保留适配还是替换；组织{{国产数据库选型}}测试；设计{{数据迁移和校验}}方案；制定{{切换方案和回滚预案}}，并组织多轮演练；协调政务云运维方和数据库厂商解决适配中的问题。",
 outline:["<b>组织</b>：牵头迁移小组 4 人","<b>原技术栈</b>：Spring Cloud、Nacos、Redis、Kafka、MySQL、Doris、K8s","<b>工作</b>：技术栈清单与去留；数据库选型；迁移与校验；切换与回滚；协调厂商"],
 memo:"清单、选型、迁移、切换、协调", tip:"“协调厂商”是信创项目的真实工作内容。", explain:["五项工作分别对应选型适配、数据库迁移、平稳切换三个论点。"]},
{n:5, short:"段5 背景与风险", role:"第二问：信创背景、迁移层次与风险", q:"第二问", target:"420", figure:true, title:"三、信创背景及国产化迁移的层次与风险",
 text:"信息技术应用创新（信创）是指在关键信息基础设施和党政信息系统中，逐步采用{{自主可控}}的信息技术产品，降低对国外技术的依赖，保障供应链和信息安全。系统国产化迁移通常涉及五个层次：{{基础硬件}}，如国产 CPU 和服务器；{{基础软件}}，如国产操作系统、数据库和中间件；{{支撑环境}}，如 JDK、容器平台和密码设施；{{应用系统}}，即业务代码及其依赖的第三方组件；以及{{数据}}本身。迁移的主要风险有：{{兼容性风险}}，CPU 指令集变化后，依赖本地库的组件可能无法运行；{{数据风险}}，数据库语法、类型和排序规则的差异，可能导致迁移后数据不一致或业务逻辑出错；{{性能风险}}，新环境的性能特征不同，原有优化可能失效；{{切换风险}}，切换过程中的停机和回退问题。针对本平台，迁移的重点集中在三处：技术栈的选型与适配、数据库迁移，以及切换的平稳性。下面结合项目，分别论述这三方面的架构设计与实施过程，以及最终效果。",
 outline:["<b>信创</b>：自主可控，降低依赖，保障供应链与安全","<b>五个层次</b>：基础硬件、基础软件、支撑环境、应用系统、数据","<b>四类风险</b>：兼容、数据、性能、切换","<b>引出</b>：选型适配、数据库迁移、平稳切换"],
 memo:"五层：硬、软、环、应、数；四险：兼容、数据、性能、切换", tip:"层次与风险各列清楚，再收束到本项目的三个重点。", explain:["四类风险中，兼容与性能对应论点一，数据对应论点二，切换对应论点三。"]},
{n:6, short:"段6 论点一·选", role:"论点一：技术栈选型与适配", q:"第三问", target:"470", arg:true, title:"（一）技术栈选型与适配",
 text:"迁移的第一步是确定每个组件“留还是换”。一种做法是把所有组件一次性替换为国产商业产品，另一种是{{按层评估}}：能在信创环境运行的开源组件{{保留适配}}，确实不符合要求或无法运行的才替换。一次性替换改动面大、风险集中，因此我选择了按层评估。我们梳理出((40 余项))组件，逐项在信创资源池上验证：Spring Cloud、Kafka、Redis、Doris 等开源组件在国产 ARM 服务器和操作系统上运行正常，予以保留；JDK 更换为支持 ARM 架构的国产发行版；数据库按要求替换为国产数据库。数据库选型时，我们对两款国产数据库进行了对比测试，重点考察 {{MySQL 兼容程度}}、核心 SQL 的性能、厂商在本地的技术支持能力，以及政务云是否已提供成熟服务，最终选择了提供 MySQL 兼容模式、政务云已有托管服务的一款产品。适配中最棘手的问题来自应用依赖：材料中心使用的一个文档转换组件内含 {{x86 本地库}}，在 ARM 服务器上无法加载，厂商也没有 ARM 版本。我们比较了模拟运行和替换两种办法后，将其替换为纯 Java 实现的开源组件，并对转换效果进行了全量比对。此外，部分服务在新环境下出现 CPU 使用率偏高，经分析是 JVM 参数沿用了 x86 环境的配置，调整后恢复正常。最终((20 余个))服务全部完成适配，兼容性测试用例全部通过。",
 outline:["<b>释</b>：确定每个组件留还是换","<b>比</b>：一次性替换 vs 按层评估","<b>选</b>：避免风险集中，按层评估、能留则留","<b>做</b>：40 余项组件逐项验证；开源组件保留；国产 JDK；数据库按兼容、性能、支持、托管四项对比","<b>坑</b>：文档转换组件含 x86 本地库 → 换纯 Java 实现并全量比对；JVM 参数沿用 x86 → 调整","<b>证</b>：20 余个服务完成适配，兼容测试全部通过"],
 memo:"全换 vs 按层 → 能留则留 → 数据库四项对比 → x86 本地库与 JVM 参数", tip:"数据库选型的四个维度要写全：兼容、性能、支持、托管。", explain:["“能留则留”降低了迁移风险，也减少了对四期新功能的影响。","x86 本地库是信创迁移中最常见的兼容问题，写出来体现真实经验。"]},
{n:7, short:"段7 论点二·迁", role:"论点二：数据库迁移", q:"第三问", target:"480", arg:true, title:"（二）数据库迁移：改写、同步与校验",
 text:"组件确定之后，风险最大的是{{数据库迁移}}。平台共有((600 余张))表，代码中的 SQL 分散在各个服务里。改写方式有两种：开发人员人工逐个检查，或借助{{工具扫描}}找出不兼容语句后集中处理。人工检查容易遗漏，因此我选择工具扫描：用 SQL 扫描工具分析代码和映射文件，共识别出((400 余处))可能不兼容的语句，其中大部分在兼容模式下可以直接运行，其余如插入或更新合并写法、部分日期函数和分组拼接函数等，由开发人员统一改写，并补充了针对这些语句的回归测试。数据迁移采用{{全量加增量}}的方式：先做一次全量迁移，再利用平台已有的 CDC 能力持续同步增量变更，使新库与旧库保持准实时一致。校验分两级：每张表比对{{行数}}，关键表再按主键分段计算{{字段哈希}}进行比对。校验中发现了问题：部分表在新库中出现唯一索引冲突，原因是两种数据库对字符串比较是否区分大小写和尾部空格的处理不同；另有个别统计查询的结果顺序与原环境不一致。我们统一了排序规则和字符串比较方式，对依赖默认顺序的查询补充了明确的排序条件。此外，有((十余条))核心 SQL 在新库中执行计划发生变化，性能下降，我们与厂商一起调整了索引和统计信息。经过三轮全量校验，新旧库数据完全一致。",
 outline:["<b>释</b>：风险最大的是数据库迁移","<b>比</b>：人工逐个检查 vs 工具扫描集中处理","<b>选</b>：人工易遗漏，选工具扫描","<b>做</b>：识别 400 余处，兼容模式覆盖大部分，其余改写并回归；全量 + CDC 增量；行数与字段哈希两级校验","<b>坑</b>：大小写与尾部空格导致唯一索引冲突；结果顺序不同；执行计划变化 → 统一排序规则、补排序、调索引","<b>证</b>：三轮全量校验完全一致"],
 memo:"人工 vs 扫描 → 400 余处 → 全量 + 增量 → 行数 + 哈希 → 大小写、顺序、执行计划三个坑", tip:"数据校验一定要写“两级校验”，这是数据迁移论述的重点。", explain:["增量同步复用了实时数据篇中的 CDC 能力，体现平台能力的复用。","三个坑都是 MySQL 迁移到国产数据库时的典型问题。"]},
{n:8, short:"段8 论点三·切", role:"论点三：平稳切换与验证", q:"第三问", target:"470", arg:true, title:"（三）平稳切换与验证",
 text:"数据准备就绪后，最后一步是把业务从旧环境切换到新环境。切换方式有两种：选择一个时间窗口{{一次性整体切换}}，或{{双轨并行、分批切换}}。一次性切换步骤简单，但一旦出现问题影响全市，回退也很困难，因此我选择了后者。首先，新旧两套环境并行运行，增量同步保证数据一致；在正式切换前，我们将生产环境的{{只读流量复制}}到新环境进行回放，比对两边的响应结果，发现差异逐一分析。其次，按服务{{分批切换}}：先切换统计分析、事项查询等只读服务，观察一周无异常后，再切换办件、材料等写入服务。写入服务的切换安排在凌晨低峰时段，步骤为停止写入、确认增量同步完成、校验数据、切换连接、恢复写入。同时，我们准备了{{反向同步}}，切换后新库的变更同步回旧库，一旦出现严重问题，可以在半小时内回退。回放比对中发现，有一项统计接口的结果在小数位上与原环境不一致，原因是两种数据库对除法结果的精度处理不同，我们在 SQL 中明确了精度。切换前我们进行了((3 轮))完整演练。正式切换当晚，写入服务的停机时间为((12 分钟))，切换后连续监测两周，核心接口性能达到原环境的((95% 以上))，未发生数据丢失。一个月后确认运行稳定，旧环境下线。",
 outline:["<b>释</b>：业务从旧环境切到新环境","<b>比</b>：一次性整体切换 vs 双轨并行、分批切换","<b>选</b>：避免影响全市、便于回退，选后者","<b>做</b>：只读流量复制回放比对；先只读后写入分批；凌晨五步切换；反向同步可半小时回退","<b>坑</b>：除法精度差异致统计结果不一致 → 明确精度","<b>证</b>：3 轮演练；停机 12 分钟；性能 95% 以上；无丢失；一个月后旧环境下线"],
 memo:"整体 vs 分批 → 双轨、回放、先读后写、反向同步 → 精度差异 → 12 分钟", tip:"切换步骤和回滚方案要具体，这是迁移题最体现架构师经验的部分。", explain:["“先只读、后写入”的分批顺序降低了风险。","反向同步保证了可回退，回答了“万一失败怎么办”。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"290", title:"四、总结",
 text:"平台在年内完成了全部迁移，切换期间全市政务服务未受明显影响，平台顺利通过了信创适配验收，得到了建设单位的认可。通过本项目我体会到，国产化迁移的关键在于{{控制风险}}：能保留的组件不轻易替换，数据必须逐级校验，切换必须可回退，而这些都需要在迁移开始前设计好。项目也存在不足：部分第三方组件仍依赖厂商适配，{{后续升级受制于人}}；新环境的性能调优{{经验积累不足}}，个别场景仍低于原环境；迁移工具和校验脚本{{沉淀不够}}，难以直接用于其他系统。后续计划建立组件的信创适配清单，与厂商建立定期适配机制；持续积累新环境下的调优经验；并将迁移和校验工具整理为可复用的工具包，供其他政务系统参考。",
 outline:["<b>效果与评价</b>：年内完成；服务未受明显影响；通过适配验收","<b>体会</b>：控制风险：能留则留、逐级校验、可回退","<b>不足</b>：依赖厂商适配；调优经验不足；工具沉淀不够","<b>改进</b>：适配清单与厂商机制；积累调优经验；工具包复用"],
 memo:"效果、体会、三不足对三改进", tip:"体会的三句话分别概括三个论点。", explain:["“能留则留、逐级校验、可回退”分别对应论点一、二、三。"]}
];

function buildArchB(rows){

  rows.forEach((r,i)=>{const n=r.boxes.length,bw=(aw-(n-1)*12)/n;
    out.push(`<text x="20" y="${y+33}" font-weight="700" fill="var(--grid)" font-size="13">${r.label}</text>`);
    r.boxes.forEach((b,j)=>{const x=x0+j*(bw+12),hot=b[2];
      out.push(`<rect x="${x}" y="${y}" width="${bw}" height="${rh}" rx="4" fill="${hot?"var(--redsoft)":"var(--paper)"}" stroke="${hot?"var(--red)":"var(--grid)"}" stroke-width="1.3"/>`);
      out.push(`<text x="${x+bw/2}" y="${y+24}" text-anchor="middle" font-weight="700" font-size="13" fill="${hot?"var(--red)":"var(--ink)"}">${b[0]}</text>`);
      out.push(`<text x="${x+bw/2}" y="${y+44}" text-anchor="middle" font-size="11.5" fill="var(--ink2)">${b[1]}</text>`);});
    if(i<rows.length-1)out.push(`<line x1="${x0+aw/2}" y1="${y+rh+2}" x2="${x0+aw/2}" y2="${y+rh+gap-3}" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#ar)"/>`);
    y+=rh+gap;});
  return `<svg viewBox="0 0 ${Wd} ${y-gap+12}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="架构示意图" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs>${out.join("")}</svg>`;
}

{n:1, short:"段1 摘要·项目", role:"交代项目与本人职责", q:"摘要", target:"160", title:"摘要（一）：项目与职责", text:"{{2024 年 4 月}}，我参与了某市{{政务服务一网通办与基层治理协同平台}}的建设，担任{{系统架构师}}。平台整合了((十余个))部门的业务系统，拆分为((20 余个))服务，承载((1800 余项))事项的申报、受理与办结，要求 7×24 小时运行。项目建设周期((8 个月))，团队共((22 人))。我负责平台的总体架构设计，并牵头可靠性方案设计和可靠性指标的统计评估。", outline:["<b>时间与项目</b>：2024 年 4 月，一网通办平台", "<b>角色</b>：系统架构师", "<b>规模</b>：十余个部门、20 余个服务、1800 余项事项；8 个月、22 人", "<b>职责</b>：总体架构；牵头可靠性方案与指标评估"], memo:"平台、架构师、22 人 8 个月、牵头可靠性", tip:"职责里要点出“可靠性方案”和“指标评估”，与题目呼应。", explain:["事实与项目事实卡一致：2024 年 4 月、8 个月、22 人。"]},
{n:2, short:"段2 摘要·主旨", role:"概括问题、措施与效果", q:"摘要", target:"230", title:"摘要（二）：问题、措施与效果", text:"本文结合该项目，论述软件可靠性设计技术及其应用。平台依赖十余个部门系统和省级电子证照接口，链路长、外部依赖多，办件一旦丢失或重复受理，将直接影响群众办事。我们在设计阶段开展{{失效模式与效应分析（FMEA）}}，前置识别高风险失效；针对外部接口失效采用{{恢复块}}式软件容错，并以{{幂等设计}}防止重复受理；在运行阶段以{{业务级健康检查与自动恢复}}缩短故障时间。平台上线后可用性约((99.95%))，平均修复时间由约((40 分钟))降至约((5 分钟))，未发生办件丢失。", outline:["<b>点题</b>：论述可靠性设计技术及其应用", "<b>难点</b>：链路长、外部依赖多；丢件、重复受理影响办事", "<b>三项措施</b>：FMEA；恢复块 + 幂等；业务级检查与自动恢复", "<b>效果</b>：可用性约 99.95%；MTTR 40 → 5 分钟；无丢件"], memo:"先析、能容、会愈；99.95%、40 → 5", tip:"摘要里的数字必须与结尾完全一致。", explain:["摘要点出三类技术，阅卷时能快速对应第三问。"]},
{n:3, short:"段3 背景", role:"建设背景与可靠性要求", q:"第一问", target:"330", title:"一、项目背景", text:"在平台建设之前，各部门系统独立建设，群众办一件事往往需要在多个系统之间重复提交材料。平台把申报、受理、审批和办结串成一条完整链路，链路要经过网关、事项、办件中心、消息队列、部门系统适配和电子证照核验等多个环节，任何一个环节失效，都可能导致办件提交失败、丢失或重复受理。原有部门系统多为单实例部署，故障主要依靠人工发现，曾出现过证照接口不可用时整个申报流程中断的情况。政务服务有明确的办理时限，办件丢失或重复受理会引发群众投诉和行政风险。因此，建设单位把{{“办件不丢、不重、流程不断”}}列为平台的首要质量目标，这对平台的可靠性设计提出了很高的要求。", outline:["<b>链路</b>：网关、事项、办件中心、消息队列、部门适配、证照核验", "<b>风险</b>：任一环节失效 → 失败、丢失、重复", "<b>现状</b>：单实例、人工发现；证照接口曾导致流程中断", "<b>目标</b>：办件不丢、不重、流程不断"], memo:"链路长 → 任一环节都能出事 → 不丢、不重、不断", tip:"背景段只写项目本身和质量目标，便于套用到高可用、评估等题目。", explain:["“不丢、不重、不断”三个目标，分别在论点二（幂等、容错）和论点三（恢复）中落实。"]},
{n:4, short:"段4 本人工作", role:"本人工作", q:"第一问", target:"250", title:"二、系统组成与本人工作", text:"平台采用 {{Spring Cloud}} 微服务架构，使用 Gateway 网关、Nacos 注册与配置中心、{{Kafka}} 消息队列、{{MySQL}} 主从复制和 Redis 缓存，部署在 {{Kubernetes}} 集群上，并以 SkyWalking 做链路追踪。我负责总体架构设计，划分服务边界，确定服务之间的同步与异步交互方式；牵头组织 FMEA 分析，制定{{可靠性设计规范}}，规定外部接口必须具备容错与降级方案、所有写接口必须幂等、所有服务必须提供业务级健康检查；设计监控告警与自动恢复机制；在试运行和运行期间按月统计 {{MTBF、MTTR 和可用性}}，评估可靠性目标的达成情况。", outline:["<b>技术栈</b>：Spring Cloud、Gateway、Nacos、Kafka、MySQL 主从、Redis、Kubernetes、SkyWalking", "<b>架构</b>：服务边界与交互方式", "<b>可靠性</b>：牵头 FMEA；三条设计规范", "<b>运行</b>：监控与自愈；按月统计指标"], memo:"栈、边界、FMEA、三条规范、按月统计", tip:"三条规范分别对应三个论点的做法，提前埋线。", explain:["“按月统计 MTBF、MTTR”为结尾的指标评估提供来源，数据才可信。"]},
{n:5, short:"段5 四类技术", role:"第二问：可靠性设计技术及其含义", q:"第二问", target:"460", figure:true, title:"三、软件可靠性设计的主要技术", text:"软件可靠性是指软件在规定条件下和规定时间内完成规定功能的能力。提升可靠性的设计技术主要有四类。一是{{冗余设计}}，包括硬件冗余和软件冗余，通过多实例部署、数据库主从复制等手段消除单点故障。二是{{软件容错}}，常用{{恢复块}}和{{N 版本程序设计}}：恢复块为模块配置主版本和若干备选版本，主版本的输出经{{接受测试}}判定不合格时，切换到备选版本执行；N 版本程序由不同团队独立开发多个版本并行运行，通过{{表决}}确定输出，成本较高，多用于安全攸关系统。三是{{故障检测与恢复}}，通过心跳、健康检查和监控告警及时发现故障，再通过重试、切换、重启和事务补偿等手段恢复。四是{{失效模式与效应分析（FMEA）}}，在设计阶段识别各组成部分可能的失效模式，评估其影响和严重程度，提前制定应对措施。可靠性与可用性既有联系又有区别：可靠性强调{{不发生故障}}，常用平均无故障时间 MTBF 衡量；可用性强调{{故障后尽快恢复}}，常用平均修复时间 MTTR 衡量，可用性 = MTBF /（MTBF + MTTR）。本项目按“设计阶段识别失效、运行中容忍失效、故障后快速恢复”的思路组合使用这四类技术，下面分三个方面论述。", outline:["<b>定义</b>：规定条件、规定时间、规定功能", "<b>冗余</b>：多实例、主从，消除单点", "<b>容错</b>：恢复块（主 + 备 + 接受测试）；N 版本（独立开发 + 表决）", "<b>检测与恢复</b>：心跳、健康检查、告警；重试、切换、重启、补偿", "<b>FMEA</b>：设计阶段识别失效、评估影响", "<b>可靠 vs 可用</b>：MTBF vs MTTR；A = MTBF/(MTBF+MTTR)", "<b>引出</b>：事前识别、事中容忍、事后恢复"], memo:"冗、容、检、析；可靠看 MTBF，可用看 MTTR", tip:"四类技术每类一两句含义即可；可靠性与可用性的区别是押题课范文的加分点。", explain:["押题课批改意见肯定了这一写法：四类手段分类清楚，联系、区别和公式都交代到位。", "末句“事前、事中、事后”把四类技术归并为三个论点，冗余并入容错一起写。"]},
{n:6, short:"段6 论点一·析", role:"论点一：设计阶段 FMEA", q:"第三问", target:"470", arg:true, title:"（一）设计阶段开展 FMEA，前置识别高风险失效", text:"可靠性问题发现得越晚，修复代价越高。2024 年 6 月概要设计评审时，我提出对办件提交主链路开展 FMEA。当时有两种做法：按惯例等系统测试阶段暴露问题再修复，或在设计阶段先做系统性分析。考虑到链路涉及十余个外部系统，测试环境难以模拟全部失效，我选择了后者。我们组织业务、开发和运维人员，把链路分解为网关、事项、办件中心、消息队列、部门适配和证照核验((6 个))环节，逐一列出失效模式，按{{严重度、发生度和可探测度}}打分，计算{{风险优先数（RPN）}}并排序。共识别出((23 个))失效模式，风险最高的前 5 项是：消息重复投递导致重复受理、证照接口超时导致申报中断、服务进程存活但不响应、部门系统回执丢失、数据库主从切换时写入丢失。对这 5 项我们逐一明确了设计措施和责任人，并写入可靠性设计规范。分析中也遇到了问题：不同人员对发生度的打分差异较大，个别环节相差一倍以上。我们改为参考部门系统的历史故障记录打分，没有历史数据的由三方共同评议，分歧明显缩小。设计评审结束时，前 5 项高风险失效均已有对应措施。", outline:["<b>释</b>：越晚发现代价越高", "<b>比</b>：测试阶段暴露再修 vs 设计阶段系统分析", "<b>选</b>：外部系统多、测试难以模拟，选 FMEA", "<b>做</b>：6 个环节；严重度、发生度、可探测度打分；RPN 排序", "<b>证</b>：23 个失效模式，前 5 项定措施和责任人", "<b>坑</b>：打分分歧大 → 参考历史故障 + 三方评议"], memo:"越晚越贵 → 测后修 vs 先分析 → 6 环节打分排 RPN → 23 个取前 5 → 分歧靠历史数据", tip:"FMEA 要写出“打分—排序—定措施”的过程，不能只写“开展了 FMEA”。", explain:["前 5 项失效模式中的两项，正是论点二、三要解决的问题，三个论点由此串成一条线。", "“打分分歧”是开展 FMEA 时的真实问题，写出来比单纯列步骤更可信。"]},
{n:7, short:"段7 论点二·容", role:"论点二：软件容错与冗余", q:"第三问", target:"480", arg:true, title:"（二）以恢复块和幂等设计容忍外部失效", text:"FMEA 识别的风险中，证照接口超时和消息重复投递最直接影响办件。7 月联调期间，省级电子证照核验接口多次响应超时，最长持续约((20 分钟))，期间所有需要核验证照的申报都无法提交。容错方案有两种：N 版本程序设计或恢复块。N 版本需要多个团队独立开发，而外部接口只有一个，无法做到真正独立，成本与周期也不允许，因此我选择了恢复块。{{主版本}}调用省级接口实时核验；接口超时或返回异常时，切换到{{备选版本}}，使用本地证照库中最近同步的数据核验；两个版本的结果都要通过{{接受测试}}，校验证照有效期以及持证人与申报人是否一致，不通过则不予放行。经备选版本核验通过的办件标记为“待复核”，接口恢复后自动补核。针对消息重复投递，我们采用{{幂等设计}}：提交时生成全局唯一的办件流水号，消费端以流水号建立唯一约束，重复消息直接丢弃。冗余方面，办件中心和证照服务各部署((3 个))实例，分布在不同节点。实施中发现本地证照库存在约 1 天的同步延迟，当天新发的证照无法核验，我们增加了按需增量拉取。此后证照接口仍出现过数次超时，但申报未再中断，重复受理为零。", outline:["<b>景</b>：7 月证照接口超时约 20 分钟，申报中断", "<b>比</b>：N 版本 vs 恢复块", "<b>选</b>：外部接口只有一个、成本不允许，选恢复块", "<b>做</b>：主版本实时核验；备选本地证照库；接受测试；待复核与补核；流水号幂等；3 实例冗余", "<b>坑</b>：本地库同步延迟约 1 天 → 按需增量拉取", "<b>证</b>：申报不再中断；重复受理为零"], memo:"证照超时 → N 版本 vs 恢复块 → 主、备、接受测试 → 流水号去重 → 本地库滞后就增量拉", tip:"恢复块一定要写出“接受测试”，这是它区别于简单降级的关键。", explain:["选型理由写的是“为什么不用 N 版本”，押题课批改意见特别强调要写出对比过的候选方案。", "接受测试保证备选版本的结果仍然可信，体现可靠性而不仅是可用性。"]},
{n:8, short:"段8 论点三·愈", role:"论点三：故障检测与恢复", q:"第三问", target:"470", arg:true, title:"（三）业务级健康检查与自动恢复", text:"容错解决的是外部依赖失效，服务自身的故障还需要及时检测和恢复。8 月试运行期间，办件中心的一个实例因内存泄漏进入{{假死}}状态：进程仍在，Kubernetes 的存活检查也显示正常，但请求全部超时，直到群众投诉后运维人员才人工重启，故障持续约((40 分钟))。问题在于检查只看进程是否存在，不看能否提供服务。改进有两种思路：加强人工巡检，或建立自动检测与恢复机制。人工巡检无法做到 7×24 小时，因此我选择了后者。一是把健康检查改为{{业务级检查}}：就绪检查执行一次轻量的数据库查询和消息发送，失败即把实例从负载均衡中摘除；存活检查连续失败达到阈值才重启实例。二是基于 SkyWalking 和监控平台，对错误率、响应时间和 JVM 内存设置告警，异常时自动通知值班人员。三是对已受理但未收到部门回执的办件，由{{定时补偿任务}}扫描并重新推送。上线初期，就绪检查的超时时间设得过短，申报高峰时多个实例因数据库响应稍慢被同时摘除，反而放大了压力。我们放宽了超时时间，并规定同一服务同时被摘除的实例不超过一半。此后同类故障均在((5 分钟))内自动恢复。", outline:["<b>景</b>：8 月实例假死，存活检查正常，持续约 40 分钟", "<b>比</b>：人工巡检 vs 自动检测与恢复", "<b>选</b>：人工无法 7×24，选自动", "<b>做</b>：业务级就绪检查摘除；存活检查阈值重启；错误率、时延、内存告警；回执补偿任务", "<b>坑</b>：超时过短，高峰同时摘除放大压力 → 放宽，最多摘一半", "<b>证</b>：同类故障 5 分钟内自动恢复"], memo:"假死 40 分钟 → 人工 vs 自动 → 就绪摘、存活重启、告警、补偿 → 摘太多就限一半", tip:"把“存活”和“就绪”两种检查分清楚，体现对检测机制的理解。", explain:["“检查过严反而放大压力”是自动恢复机制的典型副作用，写出来说明真正落地过。", "论点三的结果直接对应结尾 MTTR 由 40 分钟降到 5 分钟。"]},
{n:9, short:"段9 总结", role:"效果、体会、不足与改进", q:"结尾", target:"300", title:"四、总结", text:"平台于 2024 年 8 月底上线试运行，11 月通过验收。据 9 至 11 月的运行统计，平台级故障（含自动恢复的单服务故障）平均间隔约((170 小时))，平均修复时间由试运行初期的约 40 分钟降至约((5 分钟))，按公式计算可用性约((99.95%))，未发生办件丢失和重复受理，得到了建设单位的认可。通过本项目我体会到，可靠性设计必须{{前置到架构设计阶段}}：FMEA 帮助我们明确该防什么，容错与冗余使系统能够容忍失效，检测与自动恢复缩短了故障时间，三者缺一不可。项目也存在不足：FMEA 主要覆盖办件主链路，{{查询类功能分析不够}}；部分部门系统{{未提供回执接口}}，仍需人工核对。后续计划将 FMEA 扩展到全部核心链路，并推动部门系统完成接口改造。", outline:["<b>效果</b>：MTBF 约 170 小时；MTTR 40 → 5 分钟；可用性约 99.95%；无丢件、重复", "<b>体会</b>：可靠性设计前置；析、容、愈缺一不可", "<b>不足</b>：FMEA 覆盖不全；部分部门无回执接口", "<b>改进</b>：FMEA 扩展到全部核心链路；推动接口改造"], memo:"170 小时、5 分钟、99.95%；前置；两不足两改进", tip:"数字代入公式要算得出：170 ÷（170 + 0.083）≈ 99.95%。", explain:["押题课批改范文因前后数据对不上被指出，修正后才“终于对上了”。这里的数字与摘要、高可用篇一致。", "不足写的是边缘问题，不动摇项目结论，分寸合适。"]}
];

{n:1, short:"段1 摘要·项目", role:"交代项目与本人职责", q:"摘要", target:"160", title:"摘要（一）：项目与职责", text:"{{2024 年 4 月}}，我参与了某市{{政务服务一网通办与基层治理协同平台}}的建设，担任{{系统架构师}}，并牵头需求分析与需求管理工作。平台整合了((十余个))部门的业务系统，涉及((1800 余项))政务服务事项。项目建设周期((8 个月))，团队共((22 人))。我负责制定需求获取方案、组织需求规格评审、建立需求变更管理机制，并在此基础上完成平台的总体架构设计。", outline:["<b>时间与项目</b>：2024 年 4 月，一网通办平台", "<b>角色</b>：系统架构师，牵头需求分析与管理", "<b>规模</b>：十余个部门、1800 余项事项；8 个月、22 人", "<b>职责</b>：获取方案、规格评审、变更机制、总体架构"], memo:"平台、架构师兼需求牵头、22 人 8 个月", tip:"架构师牵头需求工作很常见，写清“在此基础上完成架构设计”。", explain:["与项目事实卡一致。"]},
{n:2, short:"段2 摘要·主旨", role:"概括问题、措施与效果", q:"摘要", target:"230", title:"摘要（二）：问题、措施与效果", text:"本文结合该项目，论述需求工程的应用。平台面向群众、企业、窗口人员和十余个部门，需求来源多、口径不一，又处在政策密集调整期。针对{{需求获取难以全面}}、{{需求理解存在偏差}}、{{需求变更频繁}}三方面问题，我们分别采用多方法组合获取与用例建模、原型确认与可测试的验收标准、基于需求基线和跟踪矩阵的变更控制加以解决。平台按期于 8 月底上线试运行，系统测试中因需求理解错误导致的缺陷占比由以往项目的约((30%))降至约((10%))，8 月的政策调整在((3 天))内完成影响分析与实施。", outline:["<b>点题</b>：论述需求工程的应用", "<b>难点</b>：来源多、口径不一、政策密集调整", "<b>三项措施</b>：组合获取与建模；原型与验收标准；基线、跟踪矩阵、变更控制", "<b>效果</b>：需求类缺陷 30% → 10%；变更 3 天完成"], memo:"全、实、稳；30% → 10%；3 天", tip:"三个问题和三项措施一一对应。", explain:["“需求类缺陷占比”是衡量需求工程效果的合适指标。"]},
{n:3, short:"段3 背景", role:"建设背景与需求难点", q:"第一问", target:"330", title:"一、项目背景", text:"在平台建设之前，各部门系统独立建设，群众和企业办一件事往往要往返多个部门、重复提交材料。平台要实现“一网通办”，需求方涉及十余个部门、上千项事项，而各部门对同一材料、同一术语的定义并不一致；平台的使用者既有群众和企业，也有窗口人员和部门审批人员，关注点各不相同。建设周期只有 8 个月，又恰逢多项惠企政策密集调整。以往同类项目的需求阶段主要依靠部门提交书面需求，开发完成后演示时才发现理解偏差，返工量大。因此，能否把需求{{收集全、理解对、变更稳}}，直接决定了平台能否按期、按质交付。", outline:["<b>现状</b>：多部门跑、重复提交", "<b>难点</b>：十余部门、上千事项；定义不一；用户类型多", "<b>约束</b>：8 个月；政策密集调整", "<b>以往</b>：书面需求，演示才发现偏差", "<b>目标</b>：收集全、理解对、变更稳"], memo:"部门多、口径乱、工期紧、政策变 → 全、对、稳", tip:"背景段末句点出三个目标，与三个论点对应。", explain:["背景段可与其他平台论文共用前半部分，只改最后两句。"]},
{n:4, short:"段4 本人工作", role:"本人工作", q:"第一问", target:"250", title:"二、本人主要工作", text:"平台采用 {{Spring Cloud}} 微服务架构，使用 Kafka、MySQL、Redis 等组件，部署在 Kubernetes 集群上。在需求阶段，我主要做了以下工作：制定需求获取计划，确定各类干系人的获取方法；组织{{联合需求计划（JRP）}}会议，协调多部门确认联办事项；使用 {{UML 用例图和活动图}}对需求建模，牵头建立统一的数据字典；组织需求规格说明书评审，推动形成{{需求基线}}；建立{{需求跟踪矩阵}}和变更控制流程，并作为变更控制委员会（{{CCB}}）成员参与变更评审。在架构设计上，我把申报条件、材料清单等易变需求设计为可配置规则，为后续变更预留空间。", outline:["<b>技术栈</b>：Spring Cloud、Kafka、MySQL、Redis、Kubernetes", "<b>获取</b>：获取计划；JRP 会议", "<b>分析</b>：用例图、活动图；数据字典", "<b>验证</b>：组织评审，形成基线", "<b>管理</b>：跟踪矩阵、变更流程、CCB", "<b>架构</b>：易变需求配置化"], memo:"计划、JRP、建模、字典、评审、基线、矩阵、CCB、配置化", tip:"把需求工程术语自然地放进本人工作里，阅卷关键词一次到位。", explain:["“易变需求配置化”为论点三埋线。"]},
{n:5, short:"段5 主要活动", role:"第二问：需求工程的主要活动", q:"第二问", target:"430", figure:true, title:"三、需求工程的主要活动", text:"需求工程是应用工程化方法获取、分析、定义、验证和管理软件需求的过程，可分为{{需求开发}}和{{需求管理}}两部分。需求开发包括四项活动：{{需求获取}}，通过用户面谈、联合需求计划、问卷调查、现场观察、原型和头脑风暴等方法收集业务需求、用户需求和系统需求；{{需求分析}}，采用结构化方法（数据流图、E-R 图、状态转换图）或面向对象方法（用例模型、分析类）对需求建模，发现冲突和遗漏；{{需求定义}}，形成需求规格说明书，可采用严格定义法或原型法；{{需求验证}}，通过需求评审和需求测试确认需求正确、完整、可测试，经评审通过的规格说明成为需求基线。需求管理以{{需求基线}}为对象，包括变更控制、版本控制、{{需求跟踪}}和需求状态跟踪，其中需求跟踪分为正向跟踪和反向跟踪，常用跟踪矩阵实现。本项目中，最突出的问题出现在需求获取、需求验证和需求变更三个环节，下面分三个方面论述。", outline:["<b>定义</b>：工程化方法获取、分析、定义、验证、管理需求", "<b>获取</b>：面谈、JRP、问卷、观察、原型、头脑风暴", "<b>分析</b>：结构化（DFD、E-R、状态图）或面向对象（用例、分析类）", "<b>定义</b>：SRS；严格定义法或原型法", "<b>验证</b>：评审、测试；形成基线", "<b>管理</b>：变更、版本、跟踪（正向反向、矩阵）、状态", "<b>引出</b>：获取、验证、变更"], memo:"开发四步：获、析、定、验；管理四项：变、版、跟、状", tip:"按“开发 + 管理”两部分组织，条理清楚，术语覆盖完整。", explain:["这一段基本就是知识点页“需求工程”卡片的内容，背熟后可直接用。"]},
{n:6, short:"段6 论点一·全", role:"论点一：需求获取与分析", q:"第三问", target:"470", arg:true, title:"（一）组合多种方法获取需求，统一模型与口径", text:"4 月需求调研初期，我们按惯例请各部门提交书面需求，收回材料后发现两个问题：一是同一材料口径不一，“营业执照”在三个部门有三种字段定义；二是窗口人员的实际操作难点在书面材料中几乎没有体现。获取方式有两种选择：继续以书面收集为主、辅以逐个部门面谈，或根据干系人类型组合多种方法。逐个部门面谈无法解决跨部门的口径冲突，因此我选择了后者：对牵头部门采用{{用户面谈}}；对涉及多部门的“一件事”联办事项组织{{联合需求计划（JRP）}}会议，让相关部门同场确认材料与流程；对窗口人员进行{{现场观察}}；对群众和企业发放{{问卷}}((1200 余份))。分析阶段，用用例图梳理参与者与用例，用活动图描述联办流程，并建立统一的{{数据字典}}，统一材料与字段定义。实施中，最初的 JRP 会议议题过多，一次会议难以形成结论。我们改为会前发放议题清单，每次只确认一个“一件事”，未决事项列入问题清单限期答复。最终形成((46 个))用例，统一了((300 余个))数据项定义，跨部门材料的口径冲突全部在需求阶段得到解决。", outline:["<b>景</b>：书面需求口径不一（营业执照三种定义）；窗口难点缺失", "<b>比</b>：书面 + 逐个面谈 vs 按干系人组合方法", "<b>选</b>：逐个面谈解决不了跨部门冲突，选组合", "<b>做</b>：面谈、JRP、现场观察、问卷 1200 余份；用例图、活动图；数据字典", "<b>坑</b>：JRP 议题过多 → 议题清单，每次一个“一件事”", "<b>证</b>：46 个用例；300 余数据项统一"], memo:"三种营业执照 → 书面 vs 组合 → 面谈、JRP、观察、问卷 → 字典统一 → 会太散就一次一件事", tip:"获取方法要按干系人类型对应选择，体现“为什么用这种方法”。", explain:["获取方法与干系人对应：部门用面谈，跨部门用 JRP，窗口用观察，群众用问卷，正好覆盖教材列出的几种方法。"]},
{n:7, short:"段7 论点二·实", role:"论点二：需求验证", q:"第三问", target:"460", arg:true, title:"（二）以原型和可测试的验收标准验证需求", text:"获取解决了“听全”，验证要解决的是“听对”。5 月需求规格说明书初稿评审时，业务部门对文字描述普遍表示认可，但在随后的原型演示中却提出了大量修改。例如“即办件”在一个部门指当场办结，在另一个部门指 1 个工作日内办结，这直接影响办理时限的计算。验证方式有两种：仅组织文档评审，或结合原型确认与可测试的验收标准。文字描述容易让双方各自理解，因此我选择了后者：对申报、受理等核心流程制作{{可交互原型}}，由业务人员实际操作确认；为每条需求补充{{可测试的验收标准}}，例如“即办件须在受理当日 18 时前办结”，并请测试人员参与评审；评审通过并经部门负责人签字确认后，形成{{需求基线}}。实施中出现了一个意外：原型做得较为逼真，部分部门误以为系统已基本完成，要求提前上线。我们在原型上标注“演示版”，并说明后续的接口对接和测试工作量。需求评审共发现并纠正了((80 余处))理解偏差，系统测试阶段因需求理解错误导致的缺陷占比由以往项目的约 30% 降至约 10%。", outline:["<b>景</b>：文字评审都认可，原型演示时大量修改；“即办件”两种口径", "<b>比</b>：仅文档评审 vs 原型确认 + 验收标准", "<b>选</b>：文字容易各自理解，选后者", "<b>做</b>：可交互原型；可测试验收标准；测试人员参与；签字形成基线", "<b>坑</b>：原型太逼真被要求提前上线 → 标注演示版", "<b>证</b>：纠正 80 余处偏差；需求类缺陷 30% → 10%"], memo:"即办件两口径 → 文档 vs 原型加标准 → 原型实操、标准可测、签字成基线 → 原型太真标演示版", tip:"“可测试的验收标准”要举一个具体例子，体现需求验证的落地。", explain:["严格定义法与原型法结合使用：原型澄清需求，确定后再以严格的规格和验收标准固化，与教材观点一致。"]},
{n:8, short:"段8 论点三·稳", role:"论点三：需求变更管理", q:"第三问", target:"470", arg:true, title:"（三）以基线、跟踪矩阵和 CCB 控制需求变更", text:"基线建立之后，变更仍不可避免，关键是让变更可控、可追溯。8 月上旬，市里调整惠企补贴政策，申报条件和所需材料都有变化，而此时距离上线只有三周。处理方式有两种：由开发人员按部门要求直接修改，或走正式的变更流程。直接修改虽然快，但容易遗漏关联功能，因此我坚持走变更流程：由业务部门提交变更申请，进行{{问题分析和变更描述}}；我们利用{{需求跟踪矩阵}}，从变更的需求条目正向定位到受影响的((4 个))用例、((11 个))接口及相关测试用例，完成{{变更分析和成本计算}}；经 {{CCB}} 评审批准后实施，并同步更新需求文档版本和跟踪矩阵。由于申报条件和材料清单在架构设计时已做成可配置规则，这次变更大部分通过配置完成。变更流程运行初期审批环节较多，紧急变更也要等每周例会。我们增设了紧急变更通道，由 CCB 两名成员线上会签，事后补全记录。这次政策调整在 3 天内完成分析和实施，没有引入新的缺陷；上线前共受理变更((37 项))，全部可追溯。", outline:["<b>景</b>：8 月政策调整，距上线三周", "<b>比</b>：直接修改 vs 正式变更流程", "<b>选</b>：直接改易遗漏，选正式流程", "<b>做</b>：问题分析与变更描述；跟踪矩阵定位 4 个用例、11 个接口；成本计算；CCB 批准；同步版本与矩阵；配置化承接", "<b>坑</b>：审批慢 → 紧急变更通道", "<b>证</b>：3 天完成，无新缺陷；37 项变更全部可追溯"], memo:"政策变、剩三周 → 直接改 vs 走流程 → 矩阵定位、CCB 批准、配置承接 → 太慢开紧急通道", tip:"变更流程的三步（问题分析与变更描述、变更分析与成本计算、变更实现）要写全。", explain:["与高并发篇的 9 月惠企补贴申报衔接：8 月政策调整，9 月集中申报，时间线一致。"]},

/* ---------- essay pages ---------- */
function deriveHTML(E,D){
  return `<div class="slide wide"><div>
  <div class="head"><span class="pos">${D.src}</span><h2>题目与论点推导</h2></div>
  <div class="map">
   <div class="panel stem"><h3>题目要求</h3><p style="margin:0 0 .4rem;font-weight:700">${E.COVER.title}</p><ol>${D.stem.map(s=>`<li>${s}</li>`).join("")}</ol><p class="note">项目：${D.project}</p></div>
   <div class="panel"><h3>五步推导</h3><ul class="judge">
    <li><b>看</b><span><em class="tagline">${TYPE_LABEL[D.type]}</em><br>${D.look}</span></li>
    <li><b>定</b><span>${D.how}</span></li>
    <li><b>埋</b><span>${D.bury}</span></li>
    <li><b>查</b><span>${D.check}</span></li></ul></div>
  </div>
  <div class="scroller" style="margin-top:1rem"><table class="lib"><thead><tr><th>论点（落）</th><th>来自题目的哪个词</th><th>绑定的项目场景</th></tr></thead><tbody>
  ${D.args.map((a,i)=>`<tr><td>论点${"一二三"[i]}：{{${a[0]}}}</td><td>${a[1]}</td><td>${a[2]}</td></tr>`).join("")}</tbody></table></div>
  ${E.LINKS&&E.LINKS.length?`<section class="explain"><h3>论点之间的衔接句</h3><ul>${E.LINKS.map(l=>`<li>${l}</li>`).join("")}</ul></section>`:""}
  </div></div>`;
}
function mapHTML(E,c){
  const C=E.COVER,total=E.P.reduce((a,p)=>a+p.words,0);
  return `<div class="slide wide"><div class="cover">
  <div class="pos" style="display:inline-block">${C.kicker}</div>
  <h1 class="q">${C.title}</h1>
  <div class="cells">${C.cells.map(x=>`<div class="cell"><div class="ch">${x[0]}</div><div class="cap"><b>${x[1]}</b><br>${x[2]}</div></div>`).join("")}</div>
  <div class="story"><h3>${C.storyTitle||"三个论点"}</h3><ol>${C.story.map(s=>`<li>${s}</li>`).join("")}</ol></div>
  <div class="panel" style="max-width:46rem;margin:1.2rem auto 0;text-align:left"><h3>九段地图（点击跳转）　全文约 ${total} 字</h3><div class="nine">
  ${E.P.map((p,i)=>`<button class="nrow${p.arg?" arg":""}" data-go="${i+2}"><span class="nn">${p.n}</span><span class="nm">${p.short.replace(/^段\d\s/,"")}</span><span class="fn">${p.role}<small>${p.q}</small></span><span class="wd">${p.words} 字</span></button>`).join("")}
  </div></div>
  <p class="meta">${C.meta}</p></div></div>`;
}
function paraHTML(E,p){
  const fig=p.figure&&E.svg?`<figure class="fig">${E.svg}<figcaption>${E.FIGCAP||""}</figcaption></figure>`:"";
  return `<div class="slide"><div>
    <div class="head"><span class="pos">第 ${p.n} 段｜${p.q}</span><h2>${p.title}</h2><span class="wc">${p.words} 字（建议约 ${p.target}）</span></div>
    ${fig}
    <article class="sheet"><div class="essay">${mk(p.text)}</div><ol class="outline">${p.outline.map(x=>`<li>${x}</li>`).join("")}</ol></article>
    <p class="legend2"><span class="sw r">下划线</span>关键词　<span class="sw y">黄底</span>示例数据，背之前换成真实数据</p>
    <section class="explain"><h3>讲解要点</h3><ul>${p.explain.map(x=>`<li>${x}</li>`).join("")}</ul></section>
  </div>
  <aside class="notes">
    <div class="tools"><p class="prog" id="prog"></p><div class="row"><button class="btn" data-act="next">揭示下一个</button><button class="btn" data-act="all">全部揭示</button><button class="btn" data-act="reset">重新遮住</button></div><small>先看助记默背，再按空格键逐个核对。</small></div>
    <div class="note memo"><h4>助记</h4><p>${p.memo}</p></div>
    <div class="note pt"><h4>本段作用</h4><p>${p.role}</p>${p.arg?`<div class="beats">${["释","景","比","选","做","坑","证"].map(b=>`<span>${b}</span>`).join("")}</div>`:""}</div>
    <div class="note tip"><h4>写法提醒</h4><p>${p.tip}</p></div>
  </aside></div>`;
}
function quizHTML(E){

function renderB(anim=true){
  const C=CH[ci],pg=C.pages[pi];

  segsB.innerHTML=C.pages.map((p,i)=>`<button class="seg${i===pi?" on":i<pi?" done":""}" title="${i+1}. ${p.short}" aria-label="第 ${i+1} 页：${p.short}" data-pg="${i}"></button>`).join("");

}
function goB(c,p){if(c<0||c>=CH.length)return;ci=c;pi=Math.max(0,Math.min(p,CH[c].pages.length-1));renderB();}
function nextB(){if(pi<CH[ci].pages.length-1)goB(ci,pi+1);else if(ci<CH.length-1)goB(ci+1,0);}
function prevB(){if(pi>0)goB(ci,pi-1);else if(ci>0)goB(ci-1,CH[ci-1].pages.length-1);}
function setModeB(m){bmode=m;document.body.dataset.mode=m;document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===m)));st.set("book-mode",m);updProg();}
buildTOC();
tocB.addEventListener("click",e=>{const b=e.target.closest("[data-ch]");if(b){goB(+b.dataset.ch,0);document.body.classList.remove("toc-open");}});
segsB.addEventListener("click",e=>{const b=e.target.closest("[data-pg]");if(b)goB(ci,+b.dataset.pg);});
document.getElementById("prev").onclick=prevB;document.getElementById("next").onclick=nextB;
document.getElementById("tocbtn").onclick=()=>document.body.classList.toggle("toc-open");
document.getElementById("scrim").onclick=()=>document.body.classList.remove("toc-open");
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>setModeB(b.dataset.m));
function revealB(){const k=stageB.querySelector(".essay .k:not(.shown)");if(k){k.classList.add("shown");k.scrollIntoView({block:"nearest"});updProg();}}
stageB.addEventListener("click",async e=>{
  const k=e.target.closest(".k");if(k&&bmode==="recite"){k.classList.toggle("shown");updProg();return}
  const g=e.target.closest("[data-go]");if(g){goB(ci,+g.dataset.go);return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="next")revealB();
  if(act==="all"){stageB.querySelectorAll(".essay .k").forEach(x=>x.classList.add("shown"));updProg()}
  if(act==="reset"){stageB.querySelectorAll(".essay .k").forEach(x=>x.classList.remove("shown"));updProg()}
  if(act==="openall")stageB.querySelectorAll("details").forEach(d=>d.open=true);
  if(act==="closeall")stageB.querySelectorAll("details").forEach(d=>d.open=false);
  if(act==="copy"){const t=document.getElementById("prompt"),msg=document.getElementById("copied");
    try{await navigator.clipboard.writeText(t.value);msg.textContent="已复制";}catch(err){t.focus();t.select();msg.textContent="已选中全文，按 Ctrl+C 或 ⌘+C 复制";}}
});
stageB.addEventListener("keydown",e=>{const k=e.target.closest&&e.target.closest(".k");if(k&&bmode==="recite"&&e.key==="Enter"){k.classList.toggle("shown");updProg();e.preventDefault()}});
document.addEventListener("keydown",e=>{
  if(e.target.closest&&(e.target.closest("summary")||e.target.closest("textarea")))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){nextB();e.preventDefault()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){prevB();e.preventDefault()}
  else if(e.key==="1")setModeB("explain");else if(e.key==="2")setModeB("recite");else if(e.key==="3")setModeB("outline");
  else if(e.key===" "&&bmode==="recite"&&CH[ci].pages[pi].kind==="p"){revealB();e.preventDefault()}
});
(function(){let sx=0,sy=0,t0=0,ok=false;
stageB.addEventListener("touchstart",e=>{if(e.touches.length!==1){ok=false;return}const el=e.target;ok=!(el.closest&&el.closest(".scroller,.fig,textarea,details[open] .a"));sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();},{passive:true});
stageB.addEventListener("touchend",e=>{if(!ok)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Date.now()-t0<700&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){dx<0?nextB():prevB();}},{passive:true});
window.addEventListener("resize",()=>{if(innerWidth>=1024)document.body.classList.remove("toc-open")});})();
setModeB(bmode);renderB(false);

</script>
</body>
</html>
