<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>系统架构设计师论文专题：一套方法，十五篇范文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBF6; --desk:#E7ECE4; --ink:#1E2738; --ink2:#5A6573;
  --rule:#CFE1D3; --grid:#3F7A58; --gridsoft:#E3EEE6; --red:#B8322A; --redsoft:#F7E4E0;
  --lh:2.15rem;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#18201B; --desk:#0F1411; --ink:#E4E9E2; --ink2:#9CA9A0;
    --rule:#2A3F32; --grid:#86C59F; --gridsoft:#1F2D24; --red:#EF8174; --redsoft:#3A2422;
  }
}
:root[data-theme="dark"]{
  --paper:#18201B; --desk:#0F1411; --ink:#E4E9E2; --ink2:#9CA9A0;
  --rule:#2A3F32; --grid:#86C59F; --gridsoft:#1F2D24; --red:#EF8174; --redsoft:#3A2422;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* top bar */
.bar{display:flex;align-items:center;gap:1rem;padding:.6rem 1.25rem;border-bottom:1px solid var(--rule);background:var(--paper);flex-wrap:wrap}
.bar .t{font-family:var(--serif);font-weight:600;font-size:.98rem;flex:1;min-width:12rem}
.modes{display:inline-flex;border:1.5px solid var(--grid);border-radius:6px;overflow:hidden}
.modes button{border:0;background:transparent;padding:.3rem .85rem;cursor:pointer;font-size:.9rem}
.modes button+button{border-left:1.5px solid var(--grid)}
.modes button[aria-pressed="true"]{background:var(--grid);color:var(--paper)}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.9rem}

/* stage */
.stage{overflow:auto;padding:1.5rem 1.25rem 2rem}
.slide{max-width:72rem;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 18.5rem;gap:1.5rem;align-items:start}
.slide.wide{grid-template-columns:minmax(0,1fr)}
.head{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;margin:0 0 .8rem}
.head h2{font-family:var(--serif);font-weight:900;font-size:clamp(1.35rem,2.6vw,1.8rem);margin:0;letter-spacing:.02em}
.pos{font-size:.85rem;color:var(--paper);background:var(--grid);padding:.1rem .55rem;border-radius:4px}
.wc{font-size:.85rem;color:var(--ink2)}

/* 稿纸 */
.sheet{background-color:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:var(--lh) 1.6rem var(--lh) 2.4rem;position:relative;
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% var(--lh);background-position:0 0;background-attachment:local}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:1.4rem;border-left:1.5px solid var(--rule)}
.essay p{font-family:var(--serif);font-size:1.07rem;line-height:var(--lh);margin:0;text-indent:2em;max-width:44em}
.essay p.suggest{color:var(--ink2);font-style:normal}
.essay p.suggest::after{content:"（建议补写的过渡句）";color:var(--red);font-family:var(--sans);font-size:.8rem}

.k{font-weight:600;background-image:linear-gradient(var(--red),var(--red));background-size:100% 1.5px;background-repeat:no-repeat;background-position:0 92%;padding:0 1px}
[data-mode="recite"] .k{cursor:pointer;border-radius:2px}
[data-mode="recite"] .k:not(.shown){color:transparent;background:var(--gridsoft);box-shadow:inset 0 -2px 0 var(--grid)}
[data-mode="recite"] .k.shown{color:var(--red);background:none}

.outline{display:none;margin:0;padding:0 0 0 1.6em;font-family:var(--serif);font-size:1.05rem;line-height:var(--lh)}
.outline li::marker{color:var(--grid);font-weight:700}
.outline b{color:var(--red);font-weight:600}
[data-mode="outline"] .essay{display:none}
[data-mode="outline"] .outline{display:block}

/* teacher comments */
.explain{margin-top:1.1rem;border-left:3px solid var(--red);background:var(--redsoft);padding:.8rem 1.1rem;border-radius:0 4px 4px 0}
.explain h3{margin:0 0 .35rem;font-size:.95rem;color:var(--red)}
.explain ul{margin:0;padding-left:1.2em}
.explain li{margin:.25rem 0;max-width:48em}
.explain .warn{margin:.6rem 0 0;padding-top:.55rem;border-top:1px dashed var(--red)}
[data-mode="recite"] .explain{display:none}

/* margin notes */
.notes{position:sticky;top:0;display:flex;flex-direction:column;gap:.85rem}
.note{border-top:2px solid var(--grid);padding-top:.45rem}
.note h4{margin:0 0 .2rem;font-size:.85rem;color:var(--grid)}
.note p{margin:0;font-size:.92rem;color:var(--ink)}
.note.memo p{font-family:var(--serif);font-weight:600;font-size:1.02rem;color:var(--red)}
[data-mode="recite"] .note.pt,[data-mode="recite"] .note.tip{display:none}
.tools{display:none;border:1.5px dashed var(--grid);border-radius:6px;padding:.7rem .8rem}
[data-mode="recite"] .tools{display:block}
.tools .prog{font-variant-numeric:tabular-nums;font-size:.92rem;margin:0 0 .5rem}
.tools .row{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:1.5px solid var(--grid);background:var(--paper);border-radius:5px;padding:.25rem .7rem;cursor:pointer;font-size:.88rem}
.btn:hover{background:var(--gridsoft)}
.tools small{display:block;margin-top:.5rem;color:var(--ink2);font-size:.8rem;line-height:1.5}

/* cover */
.cover{text-align:center;padding:1rem 0 1.5rem}
.cover .q{font-family:var(--serif);font-weight:900;font-size:clamp(1.5rem,3.6vw,2.4rem);margin:.4rem auto 1.6rem;max-width:22em;line-height:1.4}
.cells{display:flex;justify-content:center;gap:0;margin:0 auto;width:fit-content;border:2px solid var(--grid);background:var(--paper)}
.cell{width:clamp(4.2rem,13vw,7.5rem);border-left:2px solid var(--grid);position:relative}
.cell:first-child{border-left:0}
.cell .ch{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-family:var(--serif);font-weight:900;font-size:clamp(2.2rem,7vw,4.2rem);color:var(--ink);
  background-image:linear-gradient(var(--rule),var(--rule)),linear-gradient(var(--rule),var(--rule));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.cell .cap{border-top:1px solid var(--grid);font-size:clamp(.7rem,1.8vw,.86rem);padding:.35rem .2rem;color:var(--ink2);line-height:1.35}
.cover .meta{margin:1.6rem auto 0;color:var(--ink2);max-width:36em;font-size:.95rem}
.keys{margin:1.4rem auto 0;max-width:46rem;text-align:left;background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:1rem 1.2rem}
.keys h3{margin:0 0 .4rem;font-size:.95rem;color:var(--grid)}
.keys p{margin:0;font-family:var(--serif);line-height:1.9}
.how{margin:1.2rem auto 0;max-width:46rem;text-align:left;font-size:.92rem;color:var(--ink2)}
.how kbd{font-family:var(--sans);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--paper);color:var(--ink)}

/* map */
.map{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.5rem}
.panel{background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:1rem 1.2rem}
.panel h3{margin:0 0 .7rem;font-size:1rem;font-family:var(--serif)}
.qs{margin:0;padding:0;list-style:none}
.qs li{display:grid;grid-template-columns:2.2rem 1fr;gap:.6rem;padding:.65rem 0;border-top:1px solid var(--rule)}
.qs li:first-child{border-top:0}
.qs .n{font-family:var(--serif);font-weight:900;font-size:1.5rem;color:var(--grid);line-height:1}
.qs p{margin:0;font-size:.95rem}
.qs .to{display:block;margin-top:.3rem;font-size:.85rem;color:var(--red)}
.bars{display:flex;flex-direction:column;gap:.45rem}
.barrow{display:grid;grid-template-columns:6.8rem 1fr 3.4rem;align-items:center;gap:.5rem;border:0;background:none;padding:.15rem 0;cursor:pointer;text-align:left;font-size:.88rem}
.barrow .lab{color:var(--ink)}
.barrow .track{height:.8rem;background:var(--gridsoft);border-radius:2px;overflow:hidden}
.barrow .fill{height:100%;background:var(--grid)}
.barrow.hot .fill{background:var(--red)}
.barrow .num{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.barrow:hover .lab{text-decoration:underline}
.legend{margin:.8rem 0 0;font-size:.82rem;color:var(--ink2)}
.legend i{display:inline-block;width:.8rem;height:.8rem;background:var(--red);vertical-align:-1px;margin-right:.3rem;border-radius:2px}

/* architecture figure */
.fig{background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:.8rem;margin-bottom:1rem;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:560px;height:auto}
.fig figcaption{font-size:.85rem;color:var(--ink2);padding:.4rem .3rem 0}

/* quiz */
.quiz{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.9rem}
.quiz details{background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:.8rem 1rem}
.quiz summary{cursor:pointer;font-family:var(--serif);font-weight:600;list-style:none}
.quiz summary::-webkit-details-marker{display:none}
.quiz summary::before{content:"问";display:inline-block;color:var(--paper);background:var(--grid);font-family:var(--sans);font-size:.75rem;padding:0 .35rem;border-radius:3px;margin-right:.5rem;vertical-align:2px}
.quiz details[open] summary{margin-bottom:.5rem}
.quiz .a{color:var(--red);font-size:.94rem;border-top:1px dashed var(--rule);padding-top:.5rem}
.quiztools{display:flex;gap:.5rem;margin:0 0 1rem}

/* footer */
.foot{display:flex;align-items:center;gap:.8rem;padding:.55rem 1.25rem;border-top:1px solid var(--rule);background:var(--paper)}
.nav{border:1.5px solid var(--grid);background:var(--paper);border-radius:5px;padding:.3rem .9rem;cursor:pointer;white-space:nowrap}
.nav:disabled{opacity:.35;cursor:default}
.segs{flex:1;display:flex;gap:3px;min-width:0}
.seg{flex:1;height:.7rem;border:0;padding:0;background:var(--gridsoft);border-radius:2px;cursor:pointer;min-width:6px}
.seg.done{background:var(--rule)}
.seg.on{background:var(--grid)}

@media (max-width:860px){
  .slide{grid-template-columns:minmax(0,1fr)}
  .notes{position:static;order:-1}
  .map{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:var(--lh) 1rem var(--lh) 1.9rem}
  .sheet::before{left:1rem}
  .bar .t{font-size:.88rem}
}
@media (prefers-reduced-motion:no-preference){
  .slide.enter{animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
}

:root{--hl:#FFF0B3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#4A3E14}}
:root[data-theme="dark"]{--hl:#4A3E14}
.k.num{background:var(--hl);background-image:none;font-weight:600;border-radius:2px;padding:0 2px}
[data-mode="recite"] .k.num:not(.shown){background:var(--gridsoft)}
[data-mode="recite"] .k.num.shown{background:var(--hl)}
.legend2{font-size:.82rem;color:var(--ink2);margin:.6rem 0 0}
.legend2 .sw{display:inline-block;padding:0 .3rem;border-radius:2px;margin:0 .2rem}
.sw.r{background-image:linear-gradient(var(--red),var(--red));background-size:100% 1.5px;background-repeat:no-repeat;background-position:0 92%}
.sw.y{background:var(--hl)}
.beats{display:flex;flex-wrap:wrap;gap:.3rem;margin:.1rem 0 0}
.beats span{font-size:.8rem;border:1px solid var(--grid);border-radius:3px;padding:0 .35rem;color:var(--grid)}
/* nine list */
.nine{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:2.6rem 7.5rem 1fr 4.2rem;gap:.7rem;align-items:center;border:0;border-top:1px solid var(--rule);background:none;padding:.55rem .2rem;text-align:left;cursor:pointer}
.nrow:first-child{border-top:0}
.nrow:hover{background:var(--gridsoft)}
.nrow .nn{font-family:var(--serif);font-weight:900;font-size:1.35rem;color:var(--grid);text-align:center}
.nrow .nm{font-weight:700;font-size:.95rem}
.nrow .fn{font-size:.9rem;color:var(--ink)}
.nrow .fn small{display:block;color:var(--red);font-size:.8rem}
.nrow .wd{font-size:.82rem;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.nrow.arg .nn{color:var(--red)}
/* six beats */
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:2px solid var(--grid);background:var(--paper)}
.six>div{border-left:2px solid var(--grid);padding:.7rem .6rem}
.six>div:first-child{border-left:0}
.six .bc{font-family:var(--serif);font-weight:900;font-size:clamp(1.6rem,3.5vw,2.4rem);line-height:1.1;text-align:center;padding-bottom:.4rem;border-bottom:1px solid var(--rule);margin-bottom:.5rem}
.six .bn{font-weight:700;font-size:.9rem;text-align:center}
.six p{margin:.35rem 0 0;font-size:.82rem;color:var(--ink2);line-height:1.55}
.six .ex{color:var(--ink);border-top:1px dashed var(--rule);padding-top:.35rem}
.motto{font-family:var(--serif);font-weight:900;font-size:clamp(1.3rem,3vw,1.9rem);text-align:center;margin:1.4rem 0 .4rem;letter-spacing:.08em}
.motto+p{text-align:center;color:var(--ink2);margin:0 auto 1rem;max-width:40em;font-size:.92rem}
/* scene library */
.lib{width:100%;border-collapse:collapse;background:var(--paper);font-size:.9rem;min-width:640px}
.lib th,.lib td{border:1px solid var(--rule);padding:.5rem .6rem;vertical-align:top;text-align:left}
.lib th{background:var(--gridsoft);font-weight:700}
.lib td:first-child{font-weight:700;white-space:nowrap}
.scroller{overflow-x:auto;border:1.5px solid var(--grid);border-radius:3px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.6rem;margin:0 0 1.2rem}
.scene{background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:.6rem .7rem}
.scene b{font-family:var(--serif);font-size:1.6rem;color:var(--red);margin-right:.4rem;vertical-align:-3px}
.scene span{font-weight:700}
.scene p{margin:.3rem 0 0;font-size:.84rem;color:var(--ink2)}
.prompt{width:100%;min-height:22rem;font-family:var(--sans);font-size:.92rem;line-height:1.7;color:var(--ink);background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:1rem;resize:vertical}
.copyrow{display:flex;gap:.6rem;align-items:center;margin:.6rem 0 0}
.copyrow span{font-size:.85rem;color:var(--grid)}
.cover .story{margin:1.4rem auto 0;max-width:46rem;text-align:left;background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:1rem 1.2rem}
.story h3{margin:0 0 .5rem;font-size:.95rem;color:var(--grid)}
.story ol{margin:0;padding-left:1.4em;font-family:var(--serif);line-height:1.9}
.story li b{color:var(--red)}
@media (max-width:860px){
  .six{grid-template-columns:repeat(3,minmax(0,1fr))}
  .six>div:nth-child(4){border-left:0}
  .six>div:nth-child(n+4){border-top:2px solid var(--grid)}
  .nrow{grid-template-columns:2rem 1fr 3.6rem}
  .nrow .fn{grid-column:2/4}
  .nrow .wd{grid-row:1;grid-column:3}
}
.pair{border-top:1px solid var(--rule);padding:.6rem 0}
.pair:first-of-type{border-top:0}
.pair p{margin:0;font-family:var(--serif);font-size:.92rem;line-height:1.75;padding-left:2.4rem;position:relative}
.pair p::before{position:absolute;left:0;top:.15rem;font-family:var(--sans);font-size:.72rem;padding:0 .3rem;border-radius:3px}
.pair .after{margin-top:.35rem}
.pair .tag{font-family:var(--sans);font-size:.8rem;color:var(--grid);font-weight:700;padding-left:0}
.pair .tag::before{content:none}
.pair p.after{padding-left:0;margin-top:.2rem}
.pair p.after::before{content:none}

:root{--paper:#F9FAFB;--desk:#E6E9EE;--ink:#1F2430;--ink2:#5B6474;--rule:#D5DCE6;--grid:#3D4F66;--gridsoft:#E8ECF2;--red:#A86412;--redsoft:#FBF0DF;--hl:#FBE7A6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171B22;--desk:#0F1217;--ink:#E4E8EE;--ink2:#9AA3B2;--rule:#2C3442;--grid:#9FB3CC;--gridsoft:#1E2430;--red:#E8AE5C;--redsoft:#33281A;--hl:#4A3E14}}
:root[data-theme="dark"]{--paper:#171B22;--desk:#0F1217;--ink:#E4E8EE;--ink2:#9AA3B2;--rule:#2C3442;--grid:#9FB3CC;--gridsoft:#1E2430;--red:#E8AE5C;--redsoft:#33281A;--hl:#4A3E14}
[data-mode="recite"] .k{cursor:pointer;border-radius:2px}
[data-mode="recite"] .k:not(.shown){color:transparent;background:var(--gridsoft);box-shadow:inset 0 -2px 0 var(--grid)}
[data-mode="recite"] .k.shown{color:var(--red);background:none}
[data-mode="recite"] .explain{display:block}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:2px solid var(--grid);background:var(--paper)}
.flow>div{border-left:2px solid var(--grid);padding:.8rem .7rem;position:relative}
.flow>div:first-child{border-left:0}
.flow .bc{font-family:var(--serif);font-weight:900;font-size:clamp(1.8rem,4vw,2.8rem);text-align:center;line-height:1.1;padding-bottom:.4rem;border-bottom:1px solid var(--rule);margin-bottom:.5rem}
.flow .bn{font-weight:700;text-align:center;font-size:.92rem}
.flow p{margin:.35rem 0 0;font-size:.85rem;color:var(--ink2);line-height:1.6}
.flow p.q{color:var(--ink);font-family:var(--serif)}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.card{background:var(--paper);border:1.5px solid var(--grid);border-radius:3px;padding:.85rem 1rem}
.card h3{margin:0 0 .4rem;font-size:1rem;font-family:var(--serif)}
.card h3 .tag{font-family:var(--sans);font-size:.75rem;background:var(--grid);color:var(--paper);padding:0 .4rem;border-radius:3px;margin-right:.4rem;vertical-align:2px}
.card p{margin:.3rem 0;font-size:.92rem}
.card .eg{border-top:1px dashed var(--rule);padding-top:.4rem;margin-top:.5rem;font-size:.86rem;color:var(--ink2)}
.card ul{margin:.3rem 0;padding-left:1.15em;font-size:.9rem}
.card li{margin:.2rem 0}
.rule-line{font-family:var(--serif);font-weight:900;text-align:center;font-size:clamp(1.05rem,2.4vw,1.45rem);line-height:2;margin:1.1rem 0;letter-spacing:.04em}
.rule-line span{white-space:nowrap}
.args{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;margin-top:1rem}
.arg{background:var(--paper);border:1.5px solid var(--grid);border-top:5px solid var(--red);border-radius:3px;padding:.8rem .95rem}
.arg h4{margin:0 0 .35rem;font-family:var(--serif);font-size:1rem}
.arg h4 b{color:var(--red);margin-right:.3rem}
.arg p{margin:.3rem 0;font-size:.88rem;line-height:1.6}
.arg p em{font-style:normal;color:var(--grid);font-weight:700;margin-right:.25rem}
.stem{font-family:var(--serif);font-size:.95rem;line-height:1.85}
.stem ol{margin:.3rem 0 0;padding-left:1.4em}
.stem .note{font-family:var(--sans);font-size:.78rem;color:var(--ink2)}
.judge{margin:0;padding:0;list-style:none}
.judge li{display:grid;grid-template-columns:2.4rem 1fr;gap:.5rem;padding:.45rem 0;border-top:1px solid var(--rule);font-size:.92rem}
.judge li:first-child{border-top:0}
.judge li b{font-family:var(--serif);font-size:1.25rem;color:var(--grid);text-align:center}
.risk{margin-top:1rem;border-left:3px solid var(--red);background:var(--redsoft);padding:.7rem 1rem;border-radius:0 4px 4px 0;font-size:.92rem}
.risk b{color:var(--red)}
.check{counter-reset:c;margin:0;padding:0;list-style:none}

 title:"三、云原生数据库的技术特点与选型考虑",
 text:"云原生数据库是指由云平台以{{服务形式}}提供的数据库，使用方无需自行安装和维护数据库软件。其主要技术特点包括：{{计算与存储分离}}，二者可以独立扩展；{{规格和只读节点可按负载在线调整}}；{{多副本部署并支持故障自动切换}}；{{备份、监控和补丁升级由平台统一完成}}。题目所述传统数据库存储与计算耦合、扩展受限、故障恢复慢、运维成本高等问题，正是上述特点所要解决的。本项目使用的 RDS for MySQL 采用{{主备加只读实例}}架构，严格而言{{并未实现存算分离}}，读能力的扩展仍依赖数据复制。但它是当时政务云上{{可直接使用的成熟服务}}，具备弹性调整、主备切换和自动备份能力，同时保留了 {{MySQL 的事务特性和团队已有的技术积累}}，因此我们选择了它。数据库安装、备份脚本和主从切换等工作交由平台承担后，团队得以将主要精力放在{{表结构设计、事务边界划分和读写路由}}上。下面结合项目中遇到的三个问题，分别阐述选型依据、难点应对和实施效果。",
 outline:["<b>定义</b>：云平台以服务形式提供，无需自行安装维护","<b>四个特点</b>：存算分离；在线调整规格与只读节点；多副本自动切换；平台统一运维","<b>回扣题干</b>：耦合、扩展受限、恢复慢、运维成本高","<b>如实说明</b>：RDS 为主备加只读，未实现存算分离","<b>选择理由</b>：政务云上成熟可用，具备三项能力，保留 MySQL 事务与技术积累","<b>分工</b>：平台承担运维，团队专注表结构、事务边界、读写路由","<b>引出主体</b>：三个问题，阐述选型、难点、效果"],
 memo:"分离、弹性、多副本、平台运维；RDS 未分离，但成熟可用",
 tip:"题干点到“存储与计算耦合、弹性伸缩”，此处必须正面回应；产品存在差距时如实说明。",
 explain:["四个技术特点与题干列出的传统数据库不足一一对应，第二问在此一次答完。","如实说明 RDS 未实现存算分离，并给出仍然选择它的理由，体现了对产品边界的清醒认识。","末句点明“选型依据、难点应对和实施效果”，与题目第三问的要求对应。"]},
{n:6, short:"段6 论点一·峰", role:"论点一：应对访问高峰", q:"第三问", target:"480", arg:true,
 title:"（一）读写分离与弹性扩展",
 text:"系统试运行第二周恰逢{{首次全员核酸检测}}。当晚八点后网格员开始集中提交检测登记，不久即有人反映{{登记页面长时间无响应}}。监控显示主库 CPU 已超过((90%))，而指挥大屏仍在每((10 秒))刷新一次统计数据。团队当时提出了两种方案：一是{{按社区分库分表}}，以分散写入压力；二是{{实施读写分离}}，将查询负载移出主库。我要求先分析{{压测数据和慢查询日志}}，结果表明写入量并未超出单库的承载能力，导致主库过载的是{{大屏和报表中的若干复杂查询}}。分库分表改造量大，会增加跨社区统计的复杂度，工期也无法满足防控要求，因此我决定{{优先实施读写分离}}。具体做法如下：为 RDS {{增加只读实例}}，在数据访问层规定{{写操作及提交后的回查访问主库，统计和大屏查询访问只读实例}}；将重点人员数据拆分为{{当前状态表和历史流水表}}，并对状态、所属社区、任务批次和更新时间建立{{组合索引}}；大屏改为读取由{{消息队列驱动更新的汇总表}}，不再实时扫描明细数据。调整完成后，仍有部分报表在只读实例上执行缓慢，我们逐条分析慢 SQL，补充了索引并重写了其中((3 条))查询。此后每次集中检测前，我们均{{提前在控制台提升规格或增加只读节点}}，检测结束后再恢复。复测结果显示，在每分钟((2000 次))提交的负载下，登记接口 P95 稳定在((600 毫秒以内))，主库 CPU 保持在((50% 左右))。",
 outline:["<b>现场问题</b>：全员核酸当晚，登记页面无响应，主库 CPU 超 90%，大屏每 10 秒刷新","<b>方案比较</b>：按社区分库分表 vs 读写分离","<b>本人选择</b>：分析日志，写入未超单库能力，瓶颈在复杂查询，优先读写分离","<b>具体实现</b>：只读实例与路由规则；状态表 / 流水表拆分 + 组合索引；大屏读取汇总表","<b>异常处理</b>：部分报表在只读实例上仍慢 → 补索引、重写 3 条查询","<b>验证结果</b>：检测前扩容、结束后恢复；每分钟 2000 次提交下 P95 < 600 毫秒，CPU 约 50%"],
 memo:"登记无响应 → 看日志、不拆库 → 只读、拆表、汇总 → 检测前扩、结束后缩",
 tip:"选择依据来自数据分析（“写入量未超出单库承载能力”），而非个人偏好。",
 explain:["方案选择以压测数据和慢查询日志为依据，先定位真正的瓶颈，再否定分库分表，体现了架构判断过程。","“提前提升规格或增加只读节点，结束后再恢复”正面落实了题目中的“弹性伸缩”。","异常处理写出方案实施后仍存在的慢查询，说明方案经过了实际检验。"]},
{n:7, short:"段7 论点二·断", role:"论点二：故障切换与读写一致", q:"第三问", target:"450", arg:true,
 title:"（二）主备切换与读写一致性",
 text:"读写分离上线后不久出现了新的问题。有网格员反映，{{刚提交的人员状态在刷新后恢复为原值}}，误以为提交失败而再次上报。经排查，原因是只读实例存在{{复制延迟}}，回查时读到了旧数据。几乎同时，指挥部也提出要求：{{数据库所在节点发生故障时，系统需在多长时间内恢复}}。在高可用方案上，我们比较了{{自建 MHA 主从切换}}和 {{RDS 平台主备}}两种方式。前者需要团队自行维护切换脚本和虚拟 IP，而政务云网络限制较多，出现异常时难以保障。RDS 平台主备由平台负责{{故障检测和自动切换}}，且{{对外连接地址保持不变}}，因此我们采用了后者。但仅依靠平台并不足够，{{切换期间应用连接会短暂中断}}。为此，我们在连接池中启用{{连接有效性检测}}，失败后进行{{有限次数的重试}}；由于重试可能导致同一状态重复写入，又为状态更新操作增加了{{幂等键}}；针对状态回退问题，规定{{用户提交后数秒内的回查一律访问主库}}，同时在 {{Redis 中写入短期标记}}。上线前，我们与政务云运维人员共同开展了{{主备切换演练}}，切换在((约 30 秒))内完成，期间的请求经重试后全部成功，{{未出现数据丢失或重复记录}}，状态回退问题此后也未再发生。",
 outline:["<b>现场问题</b>：提交后状态恢复为原值，网格员重复上报；指挥部提出故障恢复时限要求","<b>方案比较</b>：自建 MHA 主从切换 vs RDS 平台主备","<b>本人选择</b>：自建需维护脚本和虚拟 IP，政务云网络限制多，选择平台主备","<b>具体实现</b>：连接检测 + 有限重试；幂等键；提交后数秒回查访问主库 + Redis 短期标记","<b>异常处理</b>：切换期间连接中断，重试可能重复写入 → 幂等键","<b>验证结果</b>：切换约 30 秒，无丢失、无重复，状态回退不再发生"],
 memo:"状态回退 → 不自建、用主备 → 检测、重试、幂等、读主",
 tip:"高可用不能只写“平台自动切换”，还要写清应用侧如何配合。",
 explain:["首句“读写分离上线后不久出现了新的问题”承接论点一，三个论点因此构成连续的处置过程。","应用侧的三项配合环环相扣：切换会断连，故需重试；重试会重复写，故需幂等；复制有延迟，故需读主路由。"]},
{n:8, short:"段8 论点三·错", role:"论点三：误操作恢复与可观测运维", q:"第三问", target:"440", arg:true,
 title:"（三）按时间点恢复与运维管控",
 text:"((7 月))的一次政策调整需要批量更新部分人员的网格归属。运维人员执行脚本时{{更新条件有误}}，导致((两个社区))约((3000 名))人员的网格信息被错误修改，相关社区随即反映了问题。此前系统仅有{{每日一次的全量备份}}，若据此恢复，{{当日上午网格员上报的数据将全部丢失}}，需要人工补录，工作量大且容易出错。RDS 提供{{按时间点恢复}}能力，我们据此将数据恢复到{{误操作前一分钟}}的{{临时实例}}中，与生产库比对后找出被错误修改的记录，{{仅将这部分数据写回}}，误操作之后的正常上报数据未受影响。从发现问题到恢复完成，((约用时 40 分钟))。事后我们做了以下调整：在每日全量备份的基础上{{延长日志保留时间}}，并{{每月开展一次恢复演练}}；{{收回生产库的直接写权限}}，批量操作须经审批后执行，执行前{{先在只读实例上确认影响行数}}；在 RDS 监控中为{{慢 SQL、连接数、锁等待、复制延迟和存储容量}}设置告警阈值，并接入值班通知。此后数据库异常基本能够{{在用户反映之前被发现}}，慢 SQL 数量也由每周((一百余条))下降至((十条以内))。",
 outline:["<b>现场问题</b>：7 月批量更新条件有误，两个社区约 3000 人网格被误改","<b>方案比较</b>：全量备份恢复 + 人工补录 vs 按时间点恢复","<b>本人选择</b>：全量恢复会丢失当日数据，补录量大易错，选择按时间点恢复","<b>具体实现</b>：恢复至误操作前一分钟的临时实例，比对后仅写回受影响记录","<b>异常处理</b>：保证误操作后的正常数据不被覆盖；事后收回直写权限、审批执行、只读预览","<b>验证结果</b>：约 40 分钟完成；日志延长、每月演练、五项告警；慢 SQL 由每周百余条降至十条以内"],
 memo:"条件有误 → 不补录、按时间点恢复 → 临时实例仅写回 → 收权限、加告警",
 tip:"恢复方案要写清如何避免覆盖误操作之后的正常数据。",
 explain:["“仅将这部分数据写回，误操作之后的正常上报数据未受影响”是本段的关键，体现了恢复操作对业务连续性的考虑。","事后调整覆盖备份、权限、监控三个方面，落实了题目中“自动化运维”的要求。"]},
{n:9, short:"段9 总结", role:"效果、体会、不足与改进", q:"结尾", target:"290",
 title:"四、总结",
 text:"系统于 2022 年 4 月底上线，日均处理数据((4 万余条))，经历多轮集中检测，{{未发生由数据库引起的服务中断}}。通过本项目我体会到，采用云数据库后，{{数据库安装、备份和故障切换等工作量明显减少}}，但{{表结构、事务范围和读写路由}}仍需架构师结合业务进行设计，这部分工作无法由平台代替。项目也存在不足：RDS 并非存算分离架构，增加只读节点需要复制数据，{{扩展速度有限且存在复制延迟}}；{{扩缩容目前依靠人工根据监控判断}}；数据库与政务云平台{{耦合较深}}，迁移成本较高。后续计划{{评估存算分离型云原生数据库}}，{{依据监控指标实现自动扩缩容}}，并{{进一步统一数据访问层}}，降低对特定平台的依赖。",
 outline:["<b>效果</b>：4 月底上线，日均 4 万余条，无数据库导致的中断","<b>体会</b>：运维工作量减少，但表结构、事务、路由仍需架构师设计","<b>不足</b>：非存算分离，扩展有限且有延迟；扩缩容依赖人工；平台耦合较深","<b>改进</b>：评估存算分离型数据库；指标驱动自动扩缩容；统一数据访问层"],
 memo:"一个效果、一条体会、三项不足对三项改进",
 tip:"不足要来自正文，改进要与不足逐一对应。",
 explain:["体会与第 5 段的选型考虑相呼应，首尾一致。","三项不足分别来自第 5 段和论点一，三项改进与之逐一对应。"]}
];

 text:"申报开放当天上午九点过后，办件查询接口的 P99 迅速升至((8 秒左右))，{{网关持续发出超时告警}}。团队的第一反应是{{扩充资源}}，运维人员随即将查询服务的 Pod 由((6 个))扩至((12 个))。但十余分钟后，监控显示{{响应时间基本没有变化，数据库 CPU 反而进一步升高}}。这说明瓶颈并不在服务实例数量，继续扩容只会将更多请求压向数据库。我要求暂停调整配置，从 {{SkyWalking}} 中抽取数百条慢请求，将耗时拆分为{{网关、服务处理、数据库和外部接口}}四段进行分析，最终找到三个原因：办件详情接口存在 {{N+1 查询}}，一次请求需访问数据库((7 次))；每次查询都{{同步调用统一认证接口}}获取用户信息，该接口变慢时查询服务的线程池随即被占满；另有一个{{统计报表在高峰期直接运行于主库}}。我们首先实施了可立即生效的措施：将统计报表{{迁移至 Doris 执行}}；为统一认证调用{{设置独立线程池和 500 毫秒超时}}，用户基本信息改为从登录令牌中解析。N+1 问题于当晚完成修改，{{合并为一次联表查询加批量查询}}，并补充了两个组合索引。次日在相近流量下，查询 P99 降至((2 秒左右))，数据库 CPU 由((85%))降至((50% 左右))。但日志同时显示，{{同一办件在数分钟内被查询数十次}}，主要源于群众的反复刷新，这部分压力无法通过 SQL 优化解决。",
 outline:["<b>现场问题</b>：九点后 P99 约 8 秒，网关持续超时告警","<b>方案比较</b>：扩容 vs 定位；Pod 由 6 扩至 12，响应未变，数据库 CPU 升高","<b>本人选择</b>：瓶颈不在实例数，暂停调整，先做链路分析","<b>具体实现</b>：耗时拆为四段；查出 N+1、同步调用认证、报表运行于主库","<b>异常处理</b>：先实施立即生效的措施（报表迁移、线程池隔离与超时），N+1 当晚修改","<b>验证结果</b>：P99 降至 2 秒左右，数据库 CPU 由 85% 降至 50%；遗留反复刷新问题"],
 memo:"扩容无效 → 拆四段 → 三个原因 → 先快后慢 → 刷新仍在",
 tip:"以“扩容后响应时间未变”这一事实作为方案比较的依据，比直接表态更有说服力。",
 explain:["方案比较不是空谈：扩容已实际尝试并被监控数据否定，选择链路分析的理由因此非常充分。","处置顺序体现了高峰期的判断：先实施风险小、见效快的配置类措施，再修改代码。","段末指出 SQL 优化无法解决的重复查询，自然引出论点二。"]},
{n:7, short:"段7 论点二·刷", role:"论点二：缓存优化", q:"第三问", target:"450", arg:true,
 title:"（二）以两级缓存承接重复查询",
 text:"进度查询具有{{读多写少}}的特点。一个办件从提交到办结，状态通常只变化((四五次))，而群众一天内可能查询((数十次))。此外，{{事项配置、部门字典和政策公开信息}}也属于读多写少的数据。针对这部分压力，团队提出了两种方案：一是继续优化数据库，{{增加只读库}}并调整索引；二是{{引入缓存}}。只读库可以分担部分负载，但每次刷新仍会产生一次数据库查询，申报期流量增长十几倍后，只读库同样会达到瓶颈。因此我选择了缓存方案，并分为两级：事项配置、部门字典等几乎不变的数据放在{{各服务的本地缓存}}中，每((5 分钟))刷新一次；{{办件状态和热门事项存放于 Redis}}。办件状态对准确性要求最高，我们为其设置了((约 60 秒))的过期时间，同时{{在状态变更时由办件中心发送消息删除对应缓存}}，使群众在多数情况下看到的是最新状态。上线第一周又出现新的问题：每天上午九点，{{前一晚预热的热门事项缓存同时失效}}，数据库负载出现瞬时冲高。随后我们{{为过期时间增加随机偏移}}，并在热点数据失效时{{只允许一个请求回源查询}}，其余请求等待缓存回填。至申报截止前，办件查询 P99 稳定在((1 秒以内))，缓存命中率约为((92%))，每分钟两万余次的查询中，落到数据库的{{不足十分之一}}。",
 outline:["<b>现场问题</b>：状态仅变化四五次，查询可达数十次；配置、字典同样读多写少","<b>方案比较</b>：增加只读库并调整索引 vs 引入缓存","<b>本人选择</b>：只读库每次仍查库，流量增长后同样成为瓶颈，选择缓存","<b>具体实现</b>：本地缓存存配置与字典（5 分钟刷新）；Redis 存办件状态与热门事项；60 秒过期 + 状态变更消息删除缓存","<b>异常处理</b>：九点预热缓存同时失效 → 过期时间随机偏移 + 热点单请求回源","<b>验证结果</b>：P99 稳定在 1 秒内；命中率约 92%；落库查询不足十分之一"],
 memo:"读多写少 → 不扩只读库、建两级缓存 → 短过期加主动删除 → 同时失效加随机偏移",
 tip:"缓存方案必须交代一致性如何保证，以及雪崩、击穿等问题如何处理。",
 explain:["开头用“状态变化四五次、查询数十次”的对比说明缓存的适用性，数据比概念更直观。","“办件状态对准确性要求最高”说明了一致性设计的业务依据，过期加主动删除的做法因此有据可依。","异常处理一拍写的是上线后真实出现的缓存同时失效问题，并给出了对应的雪崩与击穿防护措施。"]},
{n:8, short:"段8 论点三·涌", role:"论点三：异步削峰与容量保障", q:"第三问", target:"490", arg:true,
 title:"（三）异步削峰与容量保障",
 text:"读请求压力缓解后，申报截止前两天，瓶颈转移到了{{写入链路}}。提交申请时，系统除写入办件、更新状态外，还需在同一请求内串行{{发送短信、同步监管数据并更新统计}}，{{短信网关响应变慢即导致整个提交过程阻塞}}，前端长时间等待，部分群众再次提交，形成了{{重复申请}}。对此我考虑了两种方案：一是为短信和监管同步调用{{设置超时，失败后跳过}}；二是{{将其移出主流程}}。前者改动较小，但被跳过的短信和监管数据将会丢失，而{{监管数据纳入考核，不允许缺失}}。因此我推动将短信通知、监管同步和统计加工改为基于 {{Kafka 的异步处理}}，提交接口只负责{{校验、写入办件和更新状态}}，完成后立即返回。针对重复提交，我们在提交接口上增加了{{基于申请人和事项的幂等校验}}。异步化之后最需要防范的是{{后台处理失败而无人察觉}}，因此在消费端增加了{{堆积监控、有限次数重试和死信队列}}，死信每日由专人核对。在容量保障方面，我们依据压测结果{{在网关上为提交和查询接口设置限流阈值}}，超出阈值的请求直接返回排队提示，避免过量请求拖垮服务；查询和提交服务在 Kubernetes 上{{按 CPU 使用率和请求量配置自动扩容}}。截止日当天，提交量约为平时的((12 倍))，提交接口 P99 保持在((800 毫秒以内))，成功率达到((99.9% 以上))；短信最长延迟((约 3 分钟))，但{{无一丢失}}。",
 outline:["<b>现场问题</b>：截止前两天，提交请求内串行发送短信、同步监管、更新统计；短信网关变慢导致阻塞和重复申请","<b>方案比较</b>：设置超时后跳过 vs 移出主流程","<b>本人选择</b>：跳过会丢失监管数据，监管数据纳入考核，选择异步化","<b>具体实现</b>：Kafka 异步；提交仅做校验、写办件、更新状态；幂等校验","<b>异常处理</b>：防范后台静默失败 → 堆积监控、有限重试、死信专人核对","<b>验证结果</b>：网关限流 + K8s 自动扩容；12 倍提交量下 P99 < 800 毫秒，成功率 99.9%，短信最长延迟约 3 分钟、无丢失"],
 memo:"串行阻塞 → 不跳过、移出主流程 → 幂等防重 → 死信兜底 → 限流加扩容",
 tip:"限流与扩容需配合论述：扩容提升承载能力，限流保证超载时服务不被拖垮。",
 explain:["首句“瓶颈转移到了写入链路”承接论点二，使三个论点形成连续的处置过程。","方案选择的依据来自业务约束：监管数据纳入考核、不允许缺失，这是技术决策服从业务要求的典型写法。","效果中如实写出短信延迟约 3 分钟，说明异步化的代价，结论更为可信。"]},
{n:9, short:"段9 总结", role:"效果、体会、不足与改进", q:"结尾", target:"300",
 title:"四、总结",
 text:"此次申报期之后，平台又经历了多次集中办理，{{未再出现整体不可用的情况}}。回顾申报首日的处置过程，如果当时持续扩容，数据库很可能因压力过大而宕机。{{先明确瓶颈所在，再采取针对性措施}}，是我在本项目中最重要的体会。项目也存在不足：缓存与数据库的一致性仍{{依靠过期时间加主动删除}}来保证，极端情况下群众会看到数十秒前的状态；限流阈值和扩容规则{{主要依据压测结果设定}}，面对未曾出现过的热点仍需人工调整；异步链路的{{失败补偿目前依赖人工核对死信}}。后续计划将办件状态变更{{改为订阅推送}}，减少群众的轮询查询；{{利用历年申报数据进行容量预估}}，提前扩容；并{{实现死信补偿的自动化}}。",
 outline:["<b>效果</b>：此后多次集中办理未再整体不可用","<b>体会</b>：持续扩容可能导致数据库宕机；先明确瓶颈，再针对性处理","<b>不足</b>：一致性依靠过期加删除；阈值依赖压测与人工；死信依赖人工核对","<b>改进</b>：订阅推送；历年数据容量预估；死信补偿自动化"],

{n:6, short:"段6 论点一·理", role:"第三问论点一：需求到设计的流程变化", q:"第三问", target:"440", arg:true,
 title:"（一）对需求分析到架构设计流程的影响",
 text:"AIGC 对开发流程的第一项影响，体现在需求分析到架构设计的转换环节。工单中心是首个试点模块，其需求来自{{12345 热线、网格巡查和部门派单}}三个渠道，材料共((40 余份))，术语和口径并不统一。若由人工逐份阅读归纳，预计需要((两周))；另一种做法是先由模型提炼业务对象、角色和状态，再由人工裁定。考虑到材料量大且工期紧张，我选择了后者，但规定模型{{只做提炼和归类，不做边界划分}}。我们将材料分批输入，要求模型输出{{业务对象清单、状态流转草图和术语对照表}}，每一项均注明来源。校验中发现，模型将{{“退回”与“驳回”合并为同一状态}}，并补充了材料中不存在的{{“二次派单”状态}}。经与业务部门确认，“退回”是承办部门认为事项不属本部门职责而退回派单中心，“驳回”是派单中心认为处置不合格而要求重新处置，二者必须区分；“二次派单”予以删除。此后模板中增加了约束：{{无法注明出处的内容不得输出}}。最终工单中心的需求梳理用时((6 个工作日))，形成的{{术语对照表}}成为各模块统一使用的基础词汇。服务边界仍由我结合部门职责确定，将{{派单与处置拆分为两个服务}}。",
 outline:["<b>现场问题</b>：工单中心需求来自三个渠道，材料 40 余份，口径不一","<b>方案比较</b>：人工逐份归纳（约两周） vs 模型提炼 + 人工裁定","<b>本人选择</b>：选后者，但模型只提炼归类，不划边界","<b>具体实现</b>：分批输入；输出对象清单、状态草图、术语对照表，均注明来源","<b>异常处理</b>：模型合并“退回”“驳回”、虚构“二次派单” → 业务确认、增加出处约束","<b>验证结果</b>：6 个工作日完成；术语表全项目通用；边界由本人确定，派单与处置拆分"],
 memo:"材料杂 → 模型只提炼 → 对象、状态、术语三产物 → 退回驳回被合并 → 无出处不输出",
 tip:"一定要写清 AIGC 的职责边界：提炼归类可以交给模型，边界划分必须由人完成。",
 explain:["本段的关键是“模型只做提炼和归类，不做边界划分”，这句话直接回答了 AIGC 在流程中处于什么位置。","异常处理写的是模型合并了两个业务含义不同的状态，并虚构了一个状态。这种错误真实存在于大模型应用中，写出它并说明处理办法，比只写收益可信得多。","结尾强调服务边界由本人确定，与第 4 段的职责相呼应。"]},
{n:7, short:"段7 论点二·审", role:"第三问论点二：评审与变更流程变化", q:"第三问", target:"440", arg:true,
 title:"（二）对评审与变更流程的影响",
 text:"工单中心试点之后，知识库中积累的文档和术语表开始在{{评审和变更环节}}发挥作用。第三次迭代时，材料中心需要接入省级电子证照库，证照接口字段由((8 个))调整为((14 个))。此前一次类似变更中，开发人员凭记忆通知调用方，{{遗漏了办件中心的一个批量查询接口}}，导致联调返工((2 天))。这次我考虑了两种方式：由开发人员在代码中检索调用关系，或由模型基于知识库生成影响分析。代码检索结果准确，但只覆盖直接调用，难以反映文档、测试用例和权限配置的联动修改；模型给出的清单较全面，但结论需要验证。因此我采用{{两者结合}}的方式：由模型生成{{受影响的服务、接口、文档和测试用例清单}}，再以{{网关调用日志和代码检索结果}}进行核对。核对发现，清单遗漏了{{通过 Kafka 消息间接依赖证照数据的监管服务}}，原因是知识库只记录了同步调用关系。我们随即将各服务的{{消息主题和订阅关系}}补入知识库。评审准备方面，模型从{{性能、安全、兼容性和可测试性}}四个方面生成问题清单，评审人员在此基础上补充和取舍。本次变更的评审准备时间由((3 天))缩短至((1 天))，联调阶段{{未再出现因调用方遗漏导致的返工}}。",
 outline:["<b>现场问题</b>：证照接口字段 8 个调为 14 个；上次变更遗漏调用方，返工 2 天","<b>方案比较</b>：代码检索调用关系 vs 模型基于知识库做影响分析","<b>本人选择</b>：两者结合，模型生成清单，日志与代码检索核对","<b>具体实现</b>：清单覆盖服务、接口、文档、测试用例；评审问题从四个方面生成","<b>异常处理</b>：模型遗漏经 Kafka 间接依赖的监管服务 → 知识库补充订阅关系","<b>验证结果</b>：评审准备 3 天缩至 1 天；联调未再因遗漏返工"],
 memo:"证照字段变更 → 检索与模型结合 → 日志核对 → 漏了消息订阅 → 补入知识库",
 tip:"模型结论须有可核对的依据，本段以网关调用日志和代码检索作为核对手段。",
 explain:["首句承接论点一：试点中积累的知识库在本环节得到使用，两个论点构成先后关系。","方案选择不是二选一，而是“模型生成、事实核对”，这正是 AIGC 进入评审流程后的合理分工。","模型遗漏了消息间接依赖，根源在于知识库不完整。这一发现说明 AIGC 的分析质量取决于知识库质量，为结尾的不足埋下伏笔。"]},
{n:8, short:"段8 论点三·导", role:"第三问论点三：对架构模式的影响", q:"第三问", target:"460", arg:true,
 title:"（三）对系统架构模式的影响",
 text:"设计环节之外，AIGC 也进入了系统本身，对架构模式的影响在{{智能导办模块}}中体现得最为直接。智能导办需要根据群众提问推荐应办事项，并说明所需材料和办理时限。方案上可以{{调用公网大模型服务}}，也可以{{在政务云上私有化部署开源大模型}}并结合事项知识库进行检索增强生成。公网服务能力较强、成本较低，但群众提问中可能包含个人信息，且{{政务数据不得流出政务外网}}，因此我选择了后者。这一选择使系统架构发生了三方面变化：一是新增{{模型服务层}}，由模型网关统一负责鉴权、限流、调用审计和敏感词过滤；二是新增{{知识检索层}}，将((1800 余项))事项的办事指南切分后存入向量库，先检索、再生成，并附带出处；三是针对模型输出的{{不确定性}}设计{{降级路径}}，检索无命中或响应超时时转为常规搜索或人工客服。试运行中，模型在少数回答中给出了错误的办理时限，我们随即规定办理时限、收费标准等关键字段{{直接取自事项库原文}}；高峰期首字响应超过((5 秒))，则改为{{流式输出}}并限制并发。抽检显示，导办推荐准确率约为((90%))，约((15%))的咨询转由人工处理。此外，设计文档知识库与导办知识库共用{{同一套检索和权限基础设施}}，AIGC 由此从开发辅助工具转变为平台的一项基础能力。",
 outline:["<b>现场问题</b>：智能导办需推荐事项、说明材料与时限","<b>方案比较</b>：公网大模型服务 vs 政务云私有化部署 + 检索增强","<b>本人选择</b>：个人信息与政务数据不得出外网，选择私有化","<b>具体实现</b>：模型服务层（网关鉴权、限流、审计、过滤）；知识检索层（1800 余项指南入向量库，附出处）；降级路径","<b>异常处理</b>：办理时限答错 → 关键字段取事项库原文；首字超 5 秒 → 流式输出 + 并发限制","<b>验证结果</b>：准确率约 90%，约 15% 转人工；两套知识库共用基础设施"],
 memo:"导办要大模型 → 不走公网、私有化 → 网关层、检索层、降级路径 → 时限答错取原文 → 共用基础设施",
 tip:"架构模式的影响要落到具体的新增组件和设计原则上：模型网关、知识检索、降级兜底。",
 explain:["题目所说的“架构模式”，本段从系统架构的角度作答：大模型作为非确定性组件进入系统后，架构中出现了模型服务层、知识检索层和降级路径。","选择私有化部署的依据来自政务数据的安全要求，这是政务项目引入大模型时最真实的约束。","“关键字段直接取自事项库原文，不由模型生成”体现了对模型不确定性的工程化处理，是本段最有价值的设计决策。"]},
{n:9, short:"段9 总结", role:"效果、体会、不足与改进", q:"结尾", target:"300",
 title:"四、总结",
 text:"通过本项目，我认为 AIGC 对软件架构设计的作用主要在于{{辅助梳理、辅助表达和辅助分析}}；当系统本身引入大模型时，它还推动架构中增加{{模型服务、知识检索和降级兜底}}等组成部分。但 AIGC 不能替代架构师的判断，{{服务边界、技术选型和安全策略}}仍须由人决定，模型输出也须经过校验才能使用。项目也存在不足：知识库依赖人工维护，部分早期文档{{更新滞后}}，影响了分析结果；模型输出的{{质量评估主要依靠人工抽检}}；私有化部署的{{推理资源有限}}，高峰期只能依靠限流。后续计划实现接口定义与知识库的{{自动同步}}，建立{{导办问答评测集}}定期评估模型效果，并根据使用情况{{扩充推理资源}}。",
 outline:["<b>作用</b>：辅助梳理、表达、分析；推动架构新增模型服务、检索、降级","<b>底线</b>：边界、选型、安全由人决定；输出须校验","<b>不足</b>：知识库人工维护、更新滞后；质量评估靠人工抽检；推理资源有限","<b>改进</b>：接口定义自动同步；导办评测集；扩充推理资源"],
 memo:"三个辅助、一条底线、三项不足对三项改进",
 tip:"不足与改进要一一对应，且来自正文中的具体问题。",
 explain:["“辅助梳理、辅助表达、辅助分析”分别对应论点一、第二问和论点二，总结与正文一一呼应。","知识库更新滞后来自论点二中发现的遗漏，质量评估与推理资源来自论点三，不足均有出处。"]}
];

{n:6, short:"段6 论点一·链路", role:"论点一：链路追踪", q:"第三问", target:"470", arg:true, title:"（一）链路追踪：定位跨服务问题",
 text:"链路追踪是可观测性体系中最先建设的部分。选型时我们比较了两种方式：在代码中{{手动埋点}}，或采用基于{{字节码增强}}的 SkyWalking 探针自动采集。手动埋点灵活，但二十余个服务都要修改代码，遗漏难以避免；SkyWalking 探针对代码无侵入，且支持 Spring Cloud、Redis、MySQL 和 Kafka 等组件，因此我选择了后者。实施时，各服务在启动时挂载探针，网关为每个请求生成 traceId；对于经 Kafka 异步处理的链路，要求生产者{{将 traceId 写入消息头}}，消费者据此续接链路，使提交、短信通知和监管同步能在同一条链路中查看。试运行初期出现了新问题：链路数据{{全量采集}}，高峰期服务端和存储压力过大，链路查询响应缓慢。我们将采样策略调整为{{按比例采样}}，同时规定{{错误请求和耗时超过 1 秒的慢请求全部保留}}，既控制了数据量，又保证问题请求不被漏采。9 月申报开放首日，办件查询 P99 升至((8 秒左右))，扩容后仍无改善。我们从 SkyWalking 中抽取数百条慢请求，把耗时拆为{{网关、服务处理、数据库和外部接口}}四段分析，很快定位到 N+1 查询和对统一认证接口的同步调用两个原因，修复后 P99 降至((2 秒左右))。如果没有链路追踪，这类跨服务问题很难在当天找到根因。",
 outline:["<b>释</b>：最先建设的部分","<b>比</b>：手动埋点 vs SkyWalking 探针","<b>选</b>：无侵入、组件支持全，选探针","<b>做</b>：启动挂载；网关生成 traceId；消息头透传","<b>坑</b>：全量采集压力大 → 按比例采样，错误与慢请求全留","<b>证</b>：申报首日四段分析，定位 N+1 与同步认证，P99 降至 2 秒"],
 memo:"埋点 vs 探针 → 选探针 → 消息头透传 → 采样但慢错全留 → 首日定位", tip:"异步链路的 traceId 透传是容易被忽略的细节，写出来能体现经验。",
 explain:["“错误请求和慢请求全部保留”说明采样策略兼顾了成本与排障需要。","效果用申报首日的真实事件证明，与高并发篇的事实一致。"]},
{n:7, short:"段7 论点二·指标", role:"论点二：指标监控与告警", q:"第三问", target:"470", arg:true, title:"（二）指标监控：由被动发现转为主动发现",
 text:"链路追踪擅长事后分析，但要做到{{主动发现}}问题，还需要指标监控和告警。最初运维人员用脚本定时巡检服务器资源，覆盖面窄，也无法反映业务是否正常。对此有两种思路：扩展现有巡检脚本，或建立统一的指标体系。平台运行在 Kubernetes 上，而 {{Prometheus}} 能自动发现容器并采集指标，因此我选择以 Prometheus 为核心、{{Grafana}} 作为看板建设指标体系。指标分为三层：{{资源层}}采集节点和容器的 CPU、内存与磁盘；{{服务层}}按请求量、错误率、响应时间采集各接口指标；{{业务层}}采集事项提交成功率、Kafka 消费堆积量和死信数量等。告警分为三级：影响核心业务的{{一级告警}}电话通知值班人员，{{二级告警}}推送值班群，{{三级告警}}只记录不通知。9 月申报首日也暴露了问题：数据库变慢后，二十多个服务同时触发告警，值班群几分钟内收到上百条消息，{{真正的根因反而被淹没}}。此后我们为告警增加了{{按服务聚合}}和{{依赖抑制}}规则，下游数据库告警触发时，自动抑制上游服务的同类告警。申报截止日前，短信网关变慢引起的消费堆积在((3 分钟))内被告警发现，运维人员在群众反映之前完成了处置；与申报首日相比，同一时段的告警数量减少了((约八成))。",
 outline:["<b>释</b>：链路重事后，指标与告警重主动发现","<b>比</b>：扩展巡检脚本 vs 统一指标体系","<b>选</b>：K8s 自动发现，选 Prometheus + Grafana","<b>做</b>：资源、服务、业务三层指标；三级告警","<b>坑</b>：首日告警风暴淹没根因 → 聚合与依赖抑制","<b>证</b>：消费堆积 3 分钟内发现；告警量减少约八成"],
 memo:"脚本 vs 体系 → 三层指标 → 三级告警 → 告警风暴 → 聚合与抑制", tip:"业务层指标是区别于普通运维监控的关键，一定要写。",
 explain:["首句承接论点一，说明链路与指标的分工。","告警风暴是真实运维中常见的问题，写出它和处理办法，能体现对告警治理的理解。"]},
{n:8, short:"段8 论点三·日志", role:"论点三：日志聚合与关联", q:"第三问", target:"470", arg:true, title:"（三）日志聚合：统一格式与关联查询",
 text:"指标和链路能确定问题出在哪个服务，具体原因往往还要查日志。原先各服务的日志写在容器本地，格式各不相同，容器重启后即丢失。日志方案上，我们比较了 {{ELK}} 和 {{Loki}}。Loki 只为标签建索引，存储成本低；ELK 支持全文检索，资源消耗较大。群众投诉的排查经常需要按办件号、申请人等字段检索，且审计要求运行日志至少保存((180 天))，综合检索需求和团队的运维经验，我选择了 ELK，并通过{{索引生命周期管理}}控制成本：近((7 天))的日志存放在热节点，((30 天))内转入温节点，更早的日志归档至对象存储。采集链路为各节点的 {{Filebeat}} 将日志写入 Kafka，再由 Logstash 解析后写入 Elasticsearch，Kafka 作为缓冲，避免高峰期日志量突增压垮存储。所有服务统一采用 JSON 格式输出日志，并{{在每条日志中写入 traceId}}，从链路页面可以直接跳转到该请求的全部日志。实施中发现部分日志包含身份证号和手机号，我们随即在 Logstash 中增加{{脱敏规则}}，并将其纳入代码评审检查项。10 月有群众投诉“提交显示成功但未收到短信”，值班人员按办件号检索到对应的 traceId，再沿链路找到短信消费者因模板参数缺失而进入死信队列的日志，整个过程用时不到((15 分钟))。",
 outline:["<b>释</b>：指标和链路定位到服务，原因还需查日志","<b>比</b>：ELK vs Loki","<b>选</b>：需按字段检索、保存 180 天，选 ELK，并用生命周期管理控成本","<b>做</b>：Filebeat → Kafka → Logstash → ES；JSON 格式；写入 traceId","<b>坑</b>：日志含个人信息 → 脱敏规则并纳入评审","<b>证</b>：短信投诉 15 分钟内查明原因"],
 memo:"ELK vs Loki → 检索与审计选 ELK → 冷热分层 → traceId 关联 → 先脱敏", tip:"选型理由要来自业务需求（按办件号检索、保存 180 天），而非“业界常用”。",
 explain:["“Loki 成本低、ELK 检索强”是标准的取舍写法，最终依据是投诉排查和审计要求。","结尾的投诉案例把三个支柱串在一起：日志找到 traceId，链路找到服务，日志查明原因。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"300", title:"四、总结",
 text:"平台上线以来经历了多次集中申报和办理高峰，线上问题的平均定位时间由((约 2 小时))缩短至((15 分钟以内))，多数异常能在用户反映之前被发现。可观测性体系也成为限流阈值调整、扩容决策和复盘分析的主要依据，得到了建设单位运维部门的认可。通过本项目我体会到，可观测性应在架构设计阶段与服务拆分{{同步规划}}，尤其是 traceId 透传、日志格式和核心指标，越早统一，后期成本越低。项目也存在不足：三类数据分别存储在三套系统中，{{关联查询仍需跳转}}；告警阈值{{主要依靠经验设定}}，业务量变化较大时容易误报；部门业务系统不在追踪范围内，{{跨系统问题仍需人工协调}}。后续计划引入 {{OpenTelemetry}} 统一三类数据的采集标准，基于历史数据实现{{动态阈值告警}}，并推动与重点部门系统{{对接调用标识}}。",
 outline:["<b>效果</b>：定位 2 小时降至 15 分钟；多数异常先于用户发现","<b>评价</b>：成为调阈值、扩容、复盘依据，运维部门认可","<b>体会</b>：与服务拆分同步规划","<b>不足</b>：三套系统需跳转；阈值靠经验；部门系统不在追踪范围","<b>改进</b>：OpenTelemetry；动态阈值；对接调用标识"],
 memo:"效果、评价、体会、三不足对三改进", tip:"不足与改进一一对应。",
 explain:["体会落在“同步规划”，与背景中“联调中期才提出”相呼应。","三项不足均来自正文，改进逐一对应。"]}

{n:1, short:"段1 摘要·项目", role:"交代项目与本人职责", q:"摘要", target:"150", title:"摘要（一）：项目与职责",

{n:3, short:"段3 背景痛点", role:"建设背景与评估动因", q:"第一问", target:"340", title:"一、项目背景",
 text:"该平台将原先分散在((十余个))部门系统中的政务事项整合为统一入口，并为热线工单、网格事件和部门派单提供统一的流转平台。平台采用微服务架构，运行在 Kubernetes 上，共拆分为((20 余个))服务，对接十余个部门业务系统。一期建设工期紧，不少架构决策是在进度压力下作出的，例如{{办件中心与材料中心共用数据库实例}}、{{对部门系统的调用由各服务自行实现}}等。9 月惠企补贴集中申报期间，平台承受了((十几倍))于平时的流量，虽然通过链路定位、缓存和异步化等措施保障了运行，但也暴露出一些{{架构层面的隐患}}。二期需要接入更多部门和事项，业务部门希望优先扩充功能，运维部门希望优先解决稳定性问题，安全管理人员则关注数据保护，{{各方诉求难以排定先后}}。凭经验决定改进顺序，容易遗漏真正的风险。因此，我提出在二期规划前，采用结构化的架构评估方法，对一期架构进行一次系统检查。",
 outline:["<b>平台概况</b>：十余个部门系统整合，20 余个服务","<b>一期遗留</b>：共用数据库实例；部门调用各自实现","<b>申报期</b>：十几倍流量，暴露架构隐患","<b>二期分歧</b>：业务要功能、运维要稳定、安全要保护","<b>结论</b>：凭经验排序易遗漏风险，需结构化评估"],
 memo:"工期紧留隐患 → 申报期暴露 → 各方诉求冲突 → 需要评估", tip:"背景要写出“为什么需要评估”，而不是“为什么需要建平台”。",
 explain:["两项一期遗留决策提前点出，后文会被识别为风险点，形成伏笔。","三方诉求冲突说明了引入 ATAM 的必要性。"]},
{n:4, short:"段4 本人工作", role:"本人工作", q:"第一问", target:"250", title:"二、本人主要工作",
 text:"项目团队包括后端、前端、测试、数据开发、运维和业务分析人员，技术栈包括 {{Spring Cloud}}、{{Gateway}}、{{Redis}}、{{Kafka}}、{{MySQL}} 和 {{Kubernetes}}。作为系统架构师，我负责总体架构设计和服务划分，并主持本次架构评估。评估前，我组建了由我、两名开发负责人和一名测试负责人组成的{{评估小组}}，负责准备架构文档、引导评估会议和整理评估结论；邀请业务部门、运维部门、安全管理人员和部门系统对接人员作为{{利益相关者}}参加场景讨论。评估中，我负责介绍{{架构方法}}，组织{{场景生成与优先级排序}}，并带领评估小组逐项分析高优先级场景。评估结束后，我编写了{{评估报告}}，提出二期改进方案，并安排首批改进和验证工作。",
 outline:["<b>技术栈</b>：Spring Cloud、Gateway、Redis、Kafka、MySQL、Kubernetes","<b>组织</b>：评估小组四人；利益相关者四类","<b>评估中</b>：介绍架构方法；组织场景生成与排序；带领分析","<b>评估后</b>：编写报告；提出改进；安排验证"],
 memo:"组小组、请相关方、讲方法、排场景、写报告", tip:"评估小组与利益相关者要分开写，这是 ATAM 的角色要求。",
 explain:["ATAM 区分评估小组和利益相关者，写出两者的构成，能体现对方法的熟悉。"]},
{n:5, short:"段5 方法与步骤", role:"第二问：评估方法与 ATAM 步骤", q:"第二问", target:"430", figure:true, title:"三、常用架构评估方法与 ATAM 的步骤",
 text:"常用的软件架构评估方法主要有 {{SAAM}}、{{ATAM}} 和 {{CBAM}}。SAAM 以场景为中心，主要评估架构的{{可修改性}}，通过场景与架构的映射发现需要修改的构件；ATAM 在 SAAM 的基础上发展而来，可同时评估{{多个质量属性}}，并重点识别质量属性之间的{{权衡}}；CBAM 则在 ATAM 的基础上加入{{成本与收益分析}}，用于在多个改进方案之间进行投资决策。ATAM 通常分为四个阶段：{{描述与表述}}阶段，介绍 ATAM 方法、商业动机和架构；{{调查与分析}}阶段，确定架构方法，生成质量属性效用树并分析架构方法；{{测试}}阶段，由更多利益相关者进行头脑风暴、确定场景优先级，并再次分析架构方法；{{报告}}阶段，汇总风险点、敏感点、权衡点等评估结果。本平台需要同时兼顾性能、可用性、安全性和可修改性，且各方对质量属性的优先级存在分歧，因此我选择了 ATAM。下面结合项目，从效用树构建、三类点识别以及评估后的改进三个方面论述。",
 outline:["<b>SAAM</b>：场景为中心，侧重可修改性","<b>ATAM</b>：多质量属性，重点识别权衡","<b>CBAM</b>：加入成本收益，用于投资决策","<b>ATAM 四阶段</b>：描述与表述、调查与分析、测试、报告","<b>选择理由</b>：四类质量属性需兼顾，各方有分歧","<b>引出</b>：效用树、三类点、改进"],
 memo:"SAAM 改得动，ATAM 权衡多，CBAM 算成本；四阶段：述、析、测、报", tip:"三种方法的区别各用一句话说清，再给出选择 ATAM 的项目理由。",
 explain:["三种方法存在递进关系：SAAM → ATAM → CBAM，按这条线讲，逻辑清楚。","论点三借鉴 CBAM 思路排序，第二问提前介绍 CBAM，形成呼应。"]},
{n:6, short:"段6 论点一·树", role:"论点一：效用树与质量属性场景", q:"第三问", target:"490", arg:true, title:"（一）构建效用树，确定高优先级场景",
 text:"构建效用树是评估的第一项工作，目的是把笼统的质量目标转化为{{可度量的场景}}。最初讨论时，各方提出的要求多为“系统要快”“要安全”之类的表述，无法用于分析。场景收集有两种做法：由评估小组根据经验拟定，或组织利益相关者共同提出。前者效率高，但容易遗漏业务方和运维方真正关心的问题，因此我采用了后者，并要求每个场景按{{刺激源、刺激、环境、制品、响应、响应度量}}六要素描述。例如性能场景：在申报高峰期，群众提交事项申请，提交服务完成校验并返回结果，P99 不超过((1 秒))。可用性场景：某部门业务系统接口无响应时，与之无关的事项办理不受影响，核心服务可用性不低于((99.9%))。安全性场景：工作人员越权查询他人办件时，系统拒绝访问并记录审计日志。可修改性场景：新增一个部门事项接入时，开发工作量不超过((5 人日))。两轮讨论共收集场景((32 个))，合并相似场景后保留((21 个))。排序时，各方对安全与性能的优先级争执不下，我按照{{重要性和实现难度}}两个维度评级，并由利益相关者投票，最终确定 H/H 级场景((6 个))作为重点分析对象。场景大多来自一期运行中的真实问题，排序结果因此得到了各方认可。",
 outline:["<b>释</b>：把笼统目标转化为可度量场景","<b>比</b>：评估小组拟定 vs 利益相关者共同提出","<b>选</b>：后者，按六要素描述","<b>做</b>：性能、可用性、安全性、可修改性各举一例；32 个收集，21 个保留","<b>坑</b>：安全与性能优先级争执 → 两维评级 + 投票","<b>证</b>：6 个 H/H 级场景，各方认可"],
 memo:"六要素：源、激、境、品、应、量；32 收 21 留 6 重点", tip:"至少写出一个完整的六要素场景，这是阅卷老师重点看的地方。",
 explain:["四类质量属性各举一个场景，覆盖全面；其中性能场景的六要素完整，可以直接对照。","“重要性和实现难度”两维评级是 ATAM 的标准做法，写出 H/H 体现规范性。"]},
{n:7, short:"段7 论点二·点", role:"论点二：识别三类点", q:"第三问", target:"500", arg:true, title:"（二）分析架构方法，识别三类点",
 text:"确定高优先级场景后，评估小组逐个场景{{追踪相关的架构决策}}，判断其对质量属性的影响。分析时，逐个服务审查容易陷入细节，因此我以场景为线索沿调用链分析，直接回答“该场景能否满足”，并引用一期压测结果和申报期监控数据作为依据。{{敏感点}}方面，网关限流阈值同时决定了高峰期的吞吐量和超载时的可用性，阈值的微小变化就会显著影响两个场景的结果。{{权衡点}}方面，办件状态缓存的过期时间越长，查询性能越好，但群众看到旧状态的概率越高，需要在性能与一致性之间取舍；监管数据改为异步同步后提升了提交性能，但牺牲了监管端的实时性。{{风险点}}方面，共识别出((4 个))：对十余个部门系统的调用由各服务自行实现，{{超时与熔断策略不统一}}，一个部门系统故障可能拖垮调用方；办件中心与材料中心{{共用数据库实例}}，材料上传的大事务会影响办件查询；部分{{权限校验仅在前端实现}}；新事项接入需要{{修改多个服务的代码}}。此外，无状态服务在 Kubernetes 上多副本部署，满足可用性场景，被确认为{{非风险点}}。分析中也出现过分歧：开发人员认为部门系统故障属于偶发情况，不必列为风险。我调出申报期的监控数据，其中某部门接口超时曾导致调用方线程池占满约((10 分钟))，这一事实使大家对风险等级达成了一致。",
 outline:["<b>释</b>：逐个场景追踪架构决策","<b>比</b>：逐个服务审查 vs 沿调用链按场景分析","<b>选</b>：按场景分析，引用压测与监控数据","<b>做</b>：敏感点（限流阈值）；权衡点（缓存过期、异步同步）；4 个风险点；非风险点","<b>坑</b>：对部门系统风险等级有分歧","<b>证</b>：线程池占满约 10 分钟的数据，达成一致"],
 memo:"敏感看阈值，权衡看缓存与异步，风险四项：调、库、权、改", tip:"敏感点、权衡点、风险点的定义要准确，各举项目中的具体例子。",
 explain:["敏感点影响一个质量属性的关键参数；权衡点同时影响多个质量属性且方向相反。限流阈值与缓存过期时间分别是两者的典型例子。","风险点四项记作“调、库、权、改”：部门调用、共用数据库、权限校验、事项接入。","用监控数据化解分歧，体现了评估依靠事实而非意见。"]},
{n:8, short:"段8 论点三·改", role:"论点三：改进与验证", q:"第三问", target:"470", arg:true, title:"（三）依据评估结果改进与验证",
 text:"评估的价值最终要体现在改进上。针对 4 个风险点，评估小组提出了改进方案，但二期资源有限，无法同时完成。改进顺序可以按问题出现的先后处理，也可以按风险等级和改进成本排定优先级。我采用了后者，并借鉴 {{CBAM}} 的思路，估算每个方案的{{收益和成本}}。部门系统调用问题影响面最大、改造成本适中，列为第一批：新增{{部门系统适配层}}，统一负责协议转换、超时设置和熔断降级，各业务服务不再直接调用部门系统。权限问题涉及数据安全，同样列为第一批：将权限校验{{统一收口到网关和服务端}}。数据库拆分改造量大，安排在第二批，先通过{{读写分离}}缓解材料上传对办件查询的影响。事项接入的可修改性问题通过{{事项配置化}}逐步解决，排在最后。实施适配层时出现了新问题：各部门系统的接口响应时间差异很大，统一的超时设置要么过短导致误判，要么过长失去保护作用。我们改为按部门系统分别设定超时和熔断阈值，并{{依据监控数据定期调整}}。首批改进于 10 月中旬完成。故障演练中，我们模拟某部门系统接口无响应，熔断在((10 秒))内生效，其他事项办理未受影响；安全测试中的越权访问用例全部被拒绝并记录审计日志，对应的 H/H 级场景均达到了响应度量要求。",
 outline:["<b>释</b>：评估价值体现在改进上","<b>比</b>：按出现先后 vs 按风险与成本排序","<b>选</b>：借鉴 CBAM，按收益与成本排序","<b>做</b>：第一批适配层、权限收口；第二批读写分离；最后事项配置化","<b>坑</b>：统一超时不适用 → 按部门分别设定并定期调整","<b>证</b>：熔断 10 秒内生效；越权用例全拒；H/H 场景达标"],
 memo:"先调后权，再库后改；超时分部门设", tip:"改进的验证要回到论点一的场景和响应度量，形成闭环。",
 explain:["借鉴 CBAM 排序与第二问的介绍呼应。","验证结论“对应的 H/H 级场景均达到响应度量要求”把论点三与论点一连成闭环。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"290", title:"四、总结",
 text:"本次评估形成了一份包含((21 个))质量属性场景、((4 个))风险点及相应改进方案的评估报告，成为二期建设的主要依据，获得了建设单位的认可。通过本项目我体会到，架构评估的主要作用，是用{{可度量的场景}}统一各方对质量的理解，并用{{事实和数据}}判断风险，使改进有据可依；一期运行数据在这次评估中发挥了重要作用，许多结论正是依靠它才达成一致。项目也存在不足：评估在一期上线后才开展，部分风险本可以{{在设计阶段发现}}；场景分析主要依靠人工，{{耗时较长}}；成本收益估算较为粗略，{{缺少量化依据}}。后续计划在每次重大架构变更前开展{{轻量级评估}}，并将评估场景与压测用例、监控指标关联，使场景能够被{{持续验证}}。",
 outline:["<b>成果</b>：21 个场景、4 个风险点的评估报告，二期依据","<b>体会</b>：场景统一理解，数据判断风险","<b>不足</b>：评估偏晚；人工耗时；成本估算粗略","<b>改进</b>：变更前轻量评估；场景关联压测与监控"],
 memo:"成果、体会、三不足对改进", tip:"“评估偏晚”是真实且有分量的不足，与背景中“工期紧”相呼应。",
 explain:["体会落在“场景”和“数据”两个关键词上，与论点一、论点二分别对应。"]}
];

{n:5, short:"段5 Kappa 与关键技术", role:"第二问：架构特点与关键技术", q:"第二问", target:"430", figure:true, title:"三、实时数据处理架构的特点与关键技术",
 text:"实时数据处理架构的目标是让数据在产生后{{尽快被处理和使用}}。早期常用的 {{Lambda 架构}}同时维护批处理和流处理两条链路，批处理保证准确性，流处理保证时效性，但同一指标需要开发两套逻辑，结果还要合并，{{维护成本较高}}。{{Kappa 架构}}取消了批处理链路，所有数据都以流的形式处理，需要重新计算时通过{{重放消息队列中的数据}}实现，只需维护一套计算逻辑。实时数据处理的关键技术包括：基于 {{CDC}} 的变更数据采集，以 Kafka 等消息队列作为数据总线；以 {{Flink}} 为代表的流计算引擎，依靠窗口、状态管理和 Checkpoint 机制实现准确计算；以及 Doris、ClickHouse 等{{实时 OLAP}} 引擎，支撑高并发的分析查询。此外，{{湖仓一体}}架构把数据湖的低成本存储与数仓的管理能力结合起来，便于实时数据与历史数据统一管理。本平台的监管指标口径相对固定，而数据开发人员只有三名，难以同时维护两套链路，因此我采用了 Kappa 的思路。下面从数据采集、流式计算和存储分析三个方面论述具体设计。",

{n:6, short:"段6 论点一·采", role:"论点一：数据采集", q:"第三问", target:"460", arg:true, title:"（一）数据采集：基于 CDC 的变更捕获",
 text:"数据采集是实时链路的起点。办件、受理、审批等数据分布在办件中心、事项中心等多个业务库中，采集有两种方式：由{{业务服务在状态变化时发送消息}}，或通过 {{CDC}} 读取 MySQL 的 binlog。前者需要修改十余处业务代码，容易遗漏；后者对业务服务无侵入，能完整捕获每一次数据变更，因此我选择了 CDC。实现上，我们采用 {{Flink CDC}} 读取各业务库的 binlog，将变更数据按业务主题写入 {{Kafka}}，如办件主题、受理主题和审批主题，每条消息包含变更前后的数据和操作类型，为下游计算提供统一的数据总线。为保证顺序，同一办件的变更{{按办件号分区}}，确保下游按发生顺序处理。实施中遇到了两个问题。一是首次同步需要对历史数据做全量快照，办件表数据量超过((千万行))，早期方式会{{长时间锁表}}，影响业务写入，我们改用{{无锁的增量快照}}，按主键分片读取。二是业务库新增字段后，下游解析失败导致作业中断，我们为采集作业增加了{{表结构变更告警}}，并约定业务库变更须提前通知数据开发人员。采集链路上线后，业务库变更从发生到进入 Kafka 的延迟稳定在((秒级))，夜间批量抽取随之停用，业务库的夜间负载明显下降。",
 outline:["<b>释</b>：实时链路的起点","<b>比</b>：业务服务发消息 vs CDC 读 binlog","<b>选</b>：无侵入、不遗漏，选 CDC","<b>做</b>：Flink CDC → Kafka；按业务主题；按办件号分区保序","<b>坑</b>：全量快照锁表 → 无锁增量快照；表结构变更致中断 → 变更告警","<b>证</b>：秒级进入 Kafka；夜间抽取停用"],
 memo:"发消息 vs CDC → 选 CDC → 按主题、按办件号分区 → 锁表与改表两个坑", tip:"按办件号分区保证顺序，是容易被忽略的设计细节。",
 explain:["方案比较的依据是“修改十余处代码、容易遗漏”，事实具体。","两个坑都是 CDC 落地的真实问题，写出来比只写“采用 CDC”可信得多。"]},
{n:7, short:"段7 论点二·算", role:"论点二：流式计算", q:"第三问", target:"480", arg:true, title:"（二）流式计算：窗口统计与超期预警",
 text:"数据进入 Kafka 后，由流计算引擎完成实时计算。引擎方面，我们比较过 {{Spark Streaming}} 的微批处理和 {{Flink}} 的流式处理。前者团队较为熟悉，但处理延迟在秒级到分钟级，对事件时间的支持也较弱；超期预警需要按办件的实际发生时间判断，因此我选择了 Flink。计算分为两类作业：一类是{{指标统计}}，以 1 分钟为窗口，按部门和事项统计申报量、受理量和积压量；另一类是{{超期预警}}，为每个在办件维护状态，记录受理时间和承诺时限，剩余时间不足 1 个工作日时触发预警，推送给承办人员和部门负责人。为保证结果准确，作业开启了 {{Checkpoint}}，故障恢复后从最近一次检查点继续计算；写入 Doris 时采用两阶段提交，实现{{端到端精确一次}}。实施中出现了两个问题。一是部分部门系统回传的审批结果有数分钟延迟，导致窗口统计偏少，我们按事件时间计算，并通过{{水位线}}允许((5 分钟))的迟到数据。二是超期预警作业为每个在办件保存状态，办结后状态未清理，运行两周后状态持续膨胀，Checkpoint 耗时明显增加；我们改为办结时{{主动清除状态}}，并设置状态过期时间作为兜底。申报期间，实时统计与次日离线核对结果的差异控制在((0.1% 以内))。",
 outline:["<b>释</b>：流计算引擎完成实时计算","<b>比</b>：Spark Streaming 微批 vs Flink 流式","<b>选</b>：预警需事件时间，选 Flink","<b>做</b>：1 分钟窗口统计；按办件维护状态做预警；Checkpoint；两阶段提交精确一次","<b>坑</b>：迟到数据 → 水位线 5 分钟；状态膨胀 → 办结清除 + 过期兜底","<b>证</b>：与离线核对差异 0.1% 内"],
 memo:"微批 vs 流式 → 事件时间选 Flink → 窗口与状态 → 迟到与膨胀两个坑", tip:"窗口、状态、Checkpoint、精确一次是题目考点，都要在本段出现。",
 explain:["选择 Flink 的依据是“超期预警需要事件时间”，来自业务需求。","迟到数据和状态膨胀是 Flink 生产中最常见的两个问题，写出来体现实际经验。","与离线结果核对，回应了第 4 段中“数据核对”的职责。"]},
{n:8, short:"段8 论点三·存", role:"论点三：存储分析与湖仓", q:"第三问", target:"440", arg:true, title:"（三）存储分析：实时 OLAP 与湖仓融合",
 text:"计算结果需要支撑监管看板的高并发查询和灵活分析。存储方面，我们比较了 {{ClickHouse}} 和 {{Doris}}。两者都采用列式存储，查询性能接近；但 Doris 兼容 MySQL 协议，现有报表工具可直接连接，多表关联查询能力也更强，且一期已在使用，运维成本更低，因此我选择继续使用 Doris。表设计上，实时指标采用{{聚合模型}}，写入时按维度自动预聚合，看板查询直接读取聚合结果；办件明细采用{{主键模型}}，支持按办件号更新状态。历史数据没有全部留在 Doris 中，一年以前的明细归档到对象存储上的 {{Iceberg}} 表，Doris 通过外部数据目录直接查询，实现{{实时数据与历史数据的统一查询}}，同时降低了存储成本。实施中，归档作业产生了大量小文件，查询性能下降，我们增加了{{定期合并小文件}}的任务。改造完成后，监管数据的延迟由 T+1 缩短至((1 分钟以内))，看板查询响应时间在((1 秒左右))；申报期间共提前预警即将超期的办件((300 余件))，当月超期办件数比上月下降((约六成))。",

{n:6, short:"段6 论点一·切", role:"论点一：冗余与故障转移（RTO）", q:"第三问", target:"480", arg:true, title:"（一）冗余与故障转移：缩短 RTO",
 text:"冗余与故障转移是缩短 RTO 的基础。平台部署在政务云上，部署方案有两种：所有组件集中在一个可用区内多副本部署，或{{跨两个可用区部署}}。前者网络延迟低、成本低，但无法应对可用区级别的故障；后者成本较高，但能消除机房层面的单点。考虑到平台是全市唯一的办事入口，我选择了跨可用区部署，并按层设计冗余：{{应用层}}所有服务无状态化，在 Kubernetes 上至少部署 3 个副本，通过{{反亲和规则}}分散到两个可用区；{{中间件层}} Nacos 采用 3 节点集群，Redis 采用哨兵模式，Kafka 采用 3 副本；{{数据层}} MySQL 采用跨可用区的主备架构，由政务云数据库服务负责故障检测和自动切换。上线前的故障演练暴露出两个问题：一是 Redis 主节点切换后，部分服务仍连接旧主节点，写入持续失败，原因是这些服务配置了直连地址，我们统一改为{{通过哨兵获取主节点地址}}；二是数据库切换后，连接池中的失效连接没有及时剔除，我们开启了{{连接有效性检测}}并配置有限次重试。10 月，可用区 A 发生网络故障，该可用区内的服务实例失联，流量自动切换到可用区 B 的实例，数据库切换到备库，核心业务在((约 2 分钟))内恢复，未出现数据丢失，满足了 RTO 目标。",
 outline:["<b>释</b>：冗余与故障转移是缩短 RTO 的基础","<b>比</b>：单可用区多副本 vs 跨可用区部署","<b>选</b>：全市唯一入口，选跨可用区","<b>做</b>：应用 3 副本反亲和；Nacos 3 节点、Redis 哨兵、Kafka 3 副本；MySQL 跨区主备","<b>坑</b>：Redis 直连旧主 → 哨兵获取地址；失效连接 → 有效性检测 + 重试","<b>证</b>：10 月可用区故障约 2 分钟恢复，无数据丢失"],
 memo:"单区 vs 跨区 → 选跨区 → 三层冗余 → 哨兵直连与失效连接 → 2 分钟恢复", tip:"按应用、中间件、数据三层写冗余，层次清楚，不易遗漏。",

{n:7, short:"段7 论点二·保", role:"论点二：数据保护（RPO）", q:"第三问", target:"460", arg:true, title:"（二）数据保护：满足 RPO",
 text:"冗余能应对设备和机房故障，却无法应对{{误操作和逻辑错误}}，一条错误的批量更新会同步到所有副本。为满足 RPO 要求，我们建立了多层次的数据保护措施。复制层面，主备之间采用{{半同步复制}}，事务至少在一个备库收到日志后才提交，保证切换时数据不丢失。备份层面，每日进行全量备份，binlog 实时备份至另一可用区的对象存储，可将数据恢复到任意时间点；材料附件存储在多副本的对象存储中，并开启{{版本保留}}。恢复演练中出现了新问题：按时间点恢复需要先还原全量备份再回放日志，办件库完整恢复耗时近((3 小时))，远超 RTO 要求。对此有两种方案：缩短全量备份周期，或增加一个{{延迟从库}}。前者无法从根本上缩短回放时间；后者让一个从库固定延迟((1 小时))应用日志，误操作发生后可将其停在误操作之前，直接从中提取正确数据。我选择了延迟从库方案，并制定了误操作处置流程：先停止延迟从库的复制，再比对并只回写受影响的数据。演练中模拟误删除办件记录，从发现到恢复用时((约 20 分钟))。我们还将恢复演练固定为{{每月一次}}，确保备份真正可用。",
 outline:["<b>释</b>：冗余防不了误操作，需数据保护","<b>做（复制）</b>：半同步复制，切换不丢数据","<b>做（备份）</b>：每日全量 + binlog 异地实时备份；附件多副本 + 版本保留","<b>坑</b>：按时间点恢复近 3 小时，超 RTO","<b>比与选</b>：缩短全量周期 vs 延迟从库 → 选延迟从库","<b>证</b>：误删演练约 20 分钟恢复；每月演练"],
 memo:"冗余防不了误操作 → 半同步 + 全量 + binlog → 恢复太慢 → 延迟从库 → 20 分钟", tip:"本段的“比与选”出现在“坑”之后：先发现问题，再比较方案，这种顺序同样成立。",
 explain:["首句点出冗余与数据保护的区别，承接论点一。","延迟从库是针对误操作的专门手段，写出它能体现对 RPO 与 RTO 关系的理解。","“确保备份真正可用”说明备份必须经过恢复验证才算数。"]},
{n:8, short:"段8 论点三·降", role:"论点三：流量控制与降级（SLA）", q:"第三问", target:"500", arg:true, title:"（三）流量控制与降级：保障 SLA",
 text:"前两项措施解决的是平台自身的故障，但影响业务连续性的还有{{流量冲击和外部依赖故障}}。流量方面，9 月惠企补贴集中申报期间，我们依据压测结果在网关上为核心接口设置了{{限流阈值}}，超出阈值的请求直接返回排队提示，同时配置 Kubernetes 自动扩容，平台在十几倍于平时的流量下没有出现整体不可用。外部依赖方面，平台对接的十余个部门系统稳定性参差不齐。处理方式有两种：在各调用方分别设置超时，或引入{{统一的熔断组件}}。前者配置分散，难以统一管理；后者可以集中配置和监控，因此我们采用 {{Sentinel}}，对每个部门系统的调用分别设置超时、熔断和{{独立线程池}}，避免一个部门系统的故障占满调用方资源。在此基础上，我编写了{{分级降级预案}}：一级降级关闭统计报表、智能推荐等非核心功能；二级降级将部门系统不可用的事项改为{{“先提交、后流转”}}，申请数据暂存在平台，待部门系统恢复后自动补发；三级降级只保留办件查询和提交两项核心功能。降级开关统一配置在 Nacos 中，可在一分钟内生效。10 月下旬，市场监管部门的业务系统因升级中断约((2 小时))，熔断在((10 秒))内生效，涉及企业的((20 余项))事项按二级降级处理，群众和企业仍可正常提交申请；部门系统恢复后，暂存的((400 余件))申请自动补发，未出现遗漏。",
 outline:["<b>释</b>：还需应对流量冲击与外部依赖故障","<b>流量</b>：网关限流 + 自动扩容，申报期无整体不可用","<b>比</b>：各调用方分别设超时 vs 统一熔断组件","<b>选</b>：集中配置与监控，选 Sentinel，独立线程池","<b>做</b>：三级降级预案；二级“先提交、后流转”；Nacos 开关一分钟生效","<b>证</b>：市场监管中断 2 小时，熔断 10 秒生效，400 余件自动补发"],
 memo:"限流扛流量，熔断隔外部，三级降级保核心；先提交、后流转", tip:"降级预案要分级，并写清每一级关掉什么、保留什么。",
 explain:["首句承接前两个论点，说明还有外部因素需要应对。","“先提交、后流转”是政务场景特有的降级方式，体现业务连续性而非简单报错。","真实中断事件给出熔断时间、事项数和补发数量，验证完整。"]},

{n:5, short:"段5 主要问题", role:"第二问：引入 AIGC 面临的问题", q:"第二问", target:"400", figure:true, title:"三、在现有系统中引入 AIGC 面临的问题",
 text:"在现有系统中引入 AIGC 能力，主要面临四类问题。一是{{模型幻觉}}：大模型可能生成看似合理但与事实不符的内容，在政务场景中，错误的办理条件或时限会直接误导群众。二是{{数据隐私}}：群众提问中可能包含姓名、身份证号等个人信息，而政务数据不得流出政务外网。三是{{提示词注入}}：用户可能在提问中夹带指令，诱导模型偏离预设用途或泄露系统提示信息。四是{{推理资源与性能}}：大模型推理依赖 GPU，资源昂贵且有限，响应时间远长于普通接口，高峰期容易成为瓶颈。此外，大模型的输出具有不确定性，与传统服务“相同输入得到相同输出”的特点不同，{{对架构的容错设计提出了新要求}}。在本平台中，这些问题需要分别在接入、治理和资源三个层面解决：接入架构决定模型如何与业务隔离、如何获取准确知识；安全措施决定模型能否被管住；弹性设计决定模型能否扛住高峰。下面结合项目，从接入架构设计、安全与合规措施以及弹性伸缩设计三个方面论述。",
 outline:["<b>幻觉</b>：错误条件或时限误导群众","<b>隐私</b>：提问含个人信息，数据不出外网","<b>注入</b>：夹带指令，偏离用途或泄露提示","<b>资源</b>：GPU 昂贵有限，响应慢","<b>不确定性</b>：对容错设计提出新要求","<b>落到三层</b>：接入、治理、资源"],
 memo:"幻、隐、注、资，加一个不确定", tip:"四类问题后用一句话把它们归入三个层面，就是第三问的三个论点。",
 explain:["“相同输入得到相同输出”的对比，说明了大模型与传统服务在架构上的本质差异。","最后一句把问题归入接入、治理、资源三层，完成埋线。"]},
{n:6, short:"段6 论点一·接", role:"论点一：接入架构设计", q:"第三问", target:"490", arg:true, title:"（一）接入架构：网关与知识检索层",
 text:"接入架构要解决的问题是：让模型能力服务于业务，又{{不让业务服务直接依赖模型}}。部署方式上，公网大模型服务能力较强、成本较低，但不符合政务数据不出政务外网的要求，因此我们在政务云上{{私有化部署了开源大模型}}。接入方式有两种：由导办服务直接调用模型，或在模型与业务之间增加独立的{{模型服务层}}。直接调用实现简单，但鉴权、限流、审计等逻辑会散落在业务服务中，后续其他模块接入还要重复建设。我选择了后者，设计了{{模型网关}}，统一负责鉴权、限流、调用审计和敏感词过滤，业务服务只通过网关访问模型。为减少幻觉，我们在网关之下增加{{知识检索层}}，将((1800 余项))事项的办事指南切分后存入向量库，提问时先检索相关条目，再由模型基于检索结果生成回答，并附带出处。办事指南会随政策调整而变化，我们利用平台已有的 {{Kafka}}，在事项中心发布指南变更事件后，由索引服务{{增量更新向量库}}，无需人工同步。实施中发现，部分事项指南篇幅很长，按固定长度切分后，材料清单被截断在两个片段中，检索时只能命中一半。我们改为{{按指南的章节结构切分}}，保证同一部分内容完整，相关问题的检索命中率由((约 70%))提高到((90% 以上))。",
 outline:["<b>释</b>：服务于业务，又不让业务直接依赖模型","<b>部署</b>：公网服务不合规，私有化部署","<b>比</b>：导办服务直连 vs 独立模型服务层","<b>选</b>：避免逻辑分散和重复建设，设模型网关","<b>做</b>：网关鉴权限流审计过滤；检索层 1800 余项指南；Kafka 事件增量更新","<b>坑与证</b>：固定长度切分截断材料清单 → 按章节切分；命中率 70% 提至 90% 以上"],
 memo:"直连 vs 网关 → 选网关 → 检索附出处 → 事件更新索引 → 按章节切分", tip:"“利用平台已有的 Kafka”体现 AI 能力与现有事件驱动架构的融合。",
 explain:["融合的关键在两点：模型网关让模型成为平台的标准服务；Kafka 事件让知识库随业务数据自动更新。","切分方式的问题是检索增强中最常见的实际问题，写出来体现真实经验。"]},
{n:7, short:"段7 论点二·管", role:"论点二：安全与合规", q:"第三问", target:"470", arg:true, title:"（二）安全与合规：分层防护",
 text:"接入架构解决了“如何用”，安全与合规要解决的是“如何{{管住}}”。对此有两种思路：主要依靠提示词约束模型行为，或在输入、生成、输出各环节{{分层设防}}。提示词约束实现简单，但无法保证模型始终遵守，因此我采用了分层防护。{{输入环节}}，导办服务在调用模型前识别并替换身份证号、手机号等个人信息；对用户输入进行注入特征检测，并在构造提示词时将系统指令与用户输入{{严格分隔}}，用户内容只作为待回答的问题传入。{{生成环节}}，要求模型只能依据检索到的指南作答，检索无命中时不生成答案。{{输出环节}}，办理时限、收费标准等关键字段不由模型生成，而是{{直接取自事项库原文}}；输出内容经敏感词和合规审核后再返回。所有调用的输入、输出和检索结果均记录{{审计日志}}，保存((180 天))。试运行中，测试人员构造的部分注入样例绕过了初版规则，诱导模型输出了与政务无关的内容。我们据此补充了检测规则，并增加{{输出相关性校验}}：回答与检索到的事项无关时直接拦截，转为常规搜索。此后安全测试中的((50 余条))注入样例均被拦截，导办上线以来未发生个人信息外泄或错误时限误导群众的情况。",
 outline:["<b>释</b>：接入解决如何用，安全解决如何管住","<b>比</b>：提示词约束 vs 分层设防","<b>选</b>：提示词无法保证遵守，选分层","<b>做</b>：输入脱敏、注入检测、指令与输入分隔；只依据检索作答；关键字段取原文；输出审核；审计 180 天","<b>坑</b>：注入样例绕过初版规则 → 补规则 + 输出相关性校验","<b>证</b>：50 余条注入样例全部拦截；无外泄、无误导"],
 memo:"输入脱敏防注入，生成只靠检索，输出原文加审核，全程留审计", tip:"按输入、生成、输出三个环节写防护，结构清楚、不易遗漏。",
 explain:["首句承接论点一，“如何用”与“如何管住”的区分简洁清楚。","输出相关性校验是在发现绕过后补充的措施，体现了防护是持续迭代的。"]},
{n:8, short:"段8 论点三·扛", role:"论点三：弹性伸缩", q:"第三问", target:"470", arg:true, title:"（三）弹性伸缩：在有限资源下扛住高峰",
 text:"安全问题解决后，推理资源成为制约导办服务的主要因素。平台分配给模型的推理资源为((4 张)) GPU 卡，9 月申报期间导办咨询量增至平时的((5 倍))左右，首字响应时间超过((5 秒))，部分请求超时。对此有两种思路：申请增加 GPU，或在现有资源下通过调度和降级提升承载能力。GPU 采购周期长，无法在申报期内解决，因此我选择了后者，并从四个方面进行调整。一是推理服务采用支持{{连续批处理}}的推理框架，将多个请求合并计算，提高 GPU 利用率。二是在模型网关设置{{请求队列和并发上限}}，超过上限的请求排队等待，排队超过((10 秒))的请求{{降级为常规搜索}}。三是改为{{流式输出}}，生成一部分即返回一部分，缩短群众感知的等待时间。四是推理服务以多实例部署在 Kubernetes 上，按{{队列长度}}而非 CPU 使用率触发扩缩容，在 GPU 资源允许的范围内调整实例数，夜间低峰时释放资源，供文档辅助生成等离线任务使用。调整后，高峰期首字响应时间控制在((2 秒以内))，GPU 利用率由((约 40%))提高到((75% 左右))，降级为常规搜索的请求占比约为((8%))。",
 outline:["<b>景</b>：4 张 GPU；申报期咨询增至 5 倍，首字超 5 秒","<b>比</b>：增加 GPU vs 调度与降级","<b>选</b>：采购周期长，选后者","<b>做</b>：连续批处理；队列与并发上限，排队超 10 秒降级；流式输出；按队列长度扩缩","<b>坑</b>：CPU 指标不反映推理压力 → 按队列长度触发","<b>证</b>：首字 2 秒内；GPU 利用率 40% 提至 75%；降级约 8%"],
 memo:"加卡 vs 调度 → 选调度 → 批处理、排队、流式、按队列扩缩 → 夜间让给离线任务", tip:"按队列长度而非 CPU 扩缩，是推理服务弹性设计的关键点。",
 explain:["首句承接论点二。选择依据是“采购周期长”，是项目中的真实约束。","四项措施分别作用于吞吐、排队、感知和资源，层次清楚。","夜间释放资源供文档辅助任务使用，与 AIGC 影响篇相呼应。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"290", title:"四、总结",
 text:"智能导办上线以来，经业务部门抽检，事项推荐准确率约为((90%))，约((15%))的咨询转由人工处理，热线中的事项咨询类来电有所减少，获得了建设单位的认可。通过本项目我体会到，在现有系统中引入 AIGC，需要{{把不确定的模型能力纳入确定的架构约束之中}}：通过网关统一接入，通过检索和原文约束减少幻觉，通过分层防护保障安全，通过排队和降级应对资源不足。项目也存在不足：效果评估{{主要依靠人工抽检}}，缺少自动化评测；推理资源{{总量受限}}，高峰期仍需降级；注入防护以规则为主，{{对新型攻击的识别能力有限}}。后续计划建立{{导办问答评测集}}，在模型或知识库更新时自动评估效果；根据使用情况{{扩充推理资源}}；并引入专门的{{内容安全模型}}加强输入和输出审核。",
 outline:["<b>效果与评价</b>：准确率约 90%；约 15% 转人工；热线咨询减少；建设单位认可","<b>体会</b>：把不确定的能力纳入确定的约束","<b>不足</b>：评估靠人工；资源受限；注入防护靠规则","<b>改进</b>：评测集；扩充资源；内容安全模型"],
 memo:"效果、体会、三不足对三改进", tip:"体会句概括了三个论点，是全文的立意。",

{n:1, short:"段1 摘要·项目", role:"交代项目与本人职责", q:"摘要", target:"150", title:"摘要（一）：项目与职责",

 text:"本文结合该平台，论述数据中台技术及其应用。平台整合了十余个部门的政务事项，但各部门数据{{标准不一、重复采集、共享依赖点对点接口}}，群众办事仍需反复提交材料。为此，我们以数据共享中心为核心建设数据中台：通过{{多方式汇聚与统一数据标准}}实现数据集中，通过{{分层建模、主数据管理和质量规则}}实现统一治理，通过{{数据服务网关}}以 API 形式提供统一数据服务。中台共接入((14 个))部门的((120 余张))数据表，发布数据服务((80 余个))，日均调用((30 万次))左右，支撑((200 余项))办事材料实现免提交。",
 outline:["<b>点题</b>：论述数据中台技术及其应用","<b>问题</b>：标准不一、重复采集、点对点共享","<b>措施</b>：汇聚与标准；分层、主数据、质量；数据服务网关","<b>效果</b>：14 个部门、120 余张表；80 余个服务；日均 30 万次；200 余项材料免提交"],
 memo:"汇得齐，治得清，用得上", tip:"效果落到“材料免提交”，这是政务数据中台最有说服力的结果。", explain:["三项措施中，前两项对应第三问的“统一管理”，第三项对应“统一数据服务”。"]},
{n:3, short:"段3 背景痛点", role:"建设背景与数据痛点", q:"第一问", target:"340", title:"一、项目背景",
 text:"该平台将原先分散在((十余个))部门系统中的政务事项整合为统一入口，共拆分为((20 余个))服务。事项入口统一之后，数据问题随之凸显。一是{{数据分散且标准不一}}：同一家企业在市场监管、税务和人社系统中的名称、地址写法各不相同，部分系统甚至没有统一社会信用代码。二是{{重复采集}}：营业执照、身份证明等信息各部门已经掌握，群众办事时仍要反复提交。三是{{共享依赖点对点接口}}：部门之间需要数据时，各自开发接口或交换文件，平台建设前此类接口已有((50 余个))，口径不一、无人统一维护，一个字段调整往往牵动多个系统。四是{{数据使用缺少管控}}，谁在用、用了什么、是否超出授权范围，都难以说清。按照“一网通办”减材料、减环节的要求，平台必须把各部门数据汇集起来，统一治理后再以规范的方式提供使用，这正是数据中台要解决的问题。",
 outline:["<b>分散不一</b>：同一企业名称地址不同，缺信用代码（伏笔：治理）","<b>重复采集</b>：已掌握的信息仍要群众提交（伏笔：服务）","<b>点对点</b>：50 余个接口口径不一（伏笔：汇聚与服务）","<b>缺少管控</b>：使用情况说不清（伏笔：服务网关）","<b>目标</b>：汇集、治理、规范使用"],
 memo:"分散不一、重复采集、点对点、缺管控", tip:"四个痛点分别指向汇聚、治理、服务三个论点。", explain:["“同一家企业在三个系统中写法不同”是政务数据最典型的问题，写具体比写“数据质量差”有力得多。"]},
{n:4, short:"段4 本人工作", role:"本人工作", q:"第一问", target:"240", title:"二、本人主要工作",
 text:"项目团队共 22 人，其中数据开发人员((3 名))，技术栈包括 {{Spring Cloud}}、{{Gateway}}、{{Kafka}}、{{MySQL}}、{{Doris}} 和 {{Kubernetes}}。我负责总体架构设计和服务划分，在数据中台方面主要做了以下工作：设计数据共享中心的{{总体架构}}，确定汇聚、治理和服务三部分的边界；组织业务分析人员参照国家和省级政务数据标准，编制本平台的{{数据元标准}}；设计{{主数据管理}}方案和数据质量规则；设计{{数据服务网关}}的授权、脱敏和审计机制；并与各部门对接人员协调数据接入和服务开放的范围。",
 outline:["<b>团队与技术</b>：数据开发 3 人；Spring Cloud、Gateway、Kafka、MySQL、Doris、K8s","<b>工作</b>：总体架构；数据元标准；主数据与质量规则；服务网关机制；部门协调"],
 memo:"架构、标准、主数据、网关、协调", tip:"“与部门协调”是政务数据项目的真实工作量，值得一提。", explain:["五项工作分别对应汇聚、治理、服务三个论点。"]},
{n:5, short:"段5 概念与区别", role:"第二问：概念及与数仓、数据湖的区别", q:"第二问", target:"420", figure:true, title:"三、数据中台的概念及其与数据仓库、数据湖的区别",
 text:"数据中台是把分散在各业务系统中的数据进行{{汇聚、治理和资产化}}，再以{{服务的形式}}提供给前台业务复用的一套数据能力平台。它的核心目标不是存数据，而是让数据{{可复用、可共享}}，避免每个业务各建一套数据通道。{{数据仓库}}是面向主题、集成、相对稳定、反映历史变化的数据集合，强调先建模后入库，主要服务于统计分析和决策支持。{{数据湖}}以原始格式存储结构化、半结构化和非结构化数据，强调先存储、使用时再解析，适合探索性分析和机器学习。三者的区别在于：数据仓库和数据湖解决的是“数据如何存、如何分析”，侧重{{存储与计算}}；数据中台解决的是“数据如何管、如何用”，除存储外还包括数据标准、主数据、质量管理和{{数据服务}}，面向的是业务复用。在实际建设中，数据中台往往以数据仓库或数据湖作为底层存储。本平台中，数据共享中心以 Doris 作为分析存储，并在此之上建设标准、治理和服务能力。下面结合项目，从数据汇聚与标准统一、数据治理以及统一数据服务三个方面，论述数据中台的设计过程与应用效果。",
 outline:["<b>数据中台</b>：汇聚、治理、资产化，以服务形式复用","<b>数据仓库</b>：面向主题、先建模后入库，服务分析决策","<b>数据湖</b>：原始格式、先存后解析，适合探索与机器学习","<b>区别</b>：仓与湖重“存与算”；中台重“管与用”，含标准、主数据、质量、服务","<b>关系</b>：中台常以仓或湖为底层存储；本平台用 Doris","<b>引出</b>：汇聚与标准、治理、统一服务"],
 memo:"仓先建模，湖先存后解，中台管与用", tip:"区别要落到一句话：仓与湖侧重存储与计算，中台侧重管理与服务。", explain:["三个概念各一句定义，再用“存与算”和“管与用”区分，简洁且准确。","说明三者的关系（中台以仓或湖为底层），避免把它们写成互相替代。"]},
{n:6, short:"段6 论点一·汇", role:"论点一：数据汇聚与标准统一", q:"第三问", target:"470", arg:true, title:"（一）数据汇聚与标准统一",
 text:"数据统一管理的第一步是把数据汇集起来，并让它们说同一种语言。汇聚方式上有两种选择：延续部门之间的{{点对点交换}}，或由数据中台{{集中汇聚、统一分发}}。点对点方式改动小，但接口数量会随部门增加成倍增长，口径也无法统一，因此我选择了集中汇聚。接入方式按部门条件分为三类：平台自有业务库通过 {{CDC}} 实时采集；具备接口能力的部门系统通过{{接口定时拉取}}；无法改造的老旧系统通过{{前置机交换文件}}。所有数据先进入贴源层，保留原始内容，便于追溯。标准方面，我组织业务分析人员参照国家和省级政务数据标准，编制了((300 余个)){{数据元}}，统一字段名称、类型、长度和代码值，例如性别、证件类型、行政区划一律采用国家标准代码。接入过程中出现了新问题：某部门前置机推送的数据在系统升级后增加了字段，并调整了日期格式，导致入库批次连续失败，而部门方面并未通知。此后我们为每个接入源签订{{接入契约}}，明确字段、格式和更新频率，并在入库前增加{{结构校验}}，不符合契约的数据进入隔离区并通知对接人。最终中台接入((14 个))部门的((120 余张))表，原有((50 余个))点对点接口中的大部分逐步下线。",
 outline:["<b>释</b>：先汇集，再统一语言","<b>比</b>：点对点交换 vs 集中汇聚","<b>选</b>：接口成倍增长、口径难统一，选集中汇聚","<b>做</b>：CDC、接口拉取、前置机文件三类接入；贴源层；300 余个数据元","<b>坑</b>：部门升级改字段未通知 → 接入契约 + 结构校验 + 隔离区","<b>证</b>：14 个部门、120 余张表；点对点接口大部分下线"],
 memo:"点对点 vs 集中 → 三类接入 → 数据元统一 → 契约与校验", tip:"接入方式按部门条件分类，体现对现实约束的照顾。", explain:["“接入契约”是数据中台落地中非常实用的管理手段，写出来能体现经验。"]},
{n:7, short:"段7 论点二·治", role:"论点二：分层建模与数据治理", q:"第三问", target:"470", arg:true, title:"（二）分层建模与数据治理",
 text:"数据汇集之后，还需要经过治理才能放心使用。治理方式有两种：在使用时由各业务方{{自行清洗}}，或在中台内{{统一治理}}后再提供。前者灵活，但同样的清洗逻辑会被重复实现，结果也可能不一致，因此我选择统一治理，并按{{贴源层、明细层、汇总层和应用层}}分层建模：明细层完成清洗、标准化和关联，汇总层按主题形成企业、自然人、事项和办件等宽表，应用层面向具体服务。治理的重点是{{主数据管理}}。企业主数据以统一社会信用代码为唯一标识，自然人主数据以身份证号为标识并加密存储，各部门数据按标识归并，并按“权威来源优先”的原则确定字段取值，例如企业名称以市场监管部门数据为准。实施中遇到的典型问题是，同一企业因更名或历史数据缺失，在不同部门中存在多个名称，部分记录没有信用代码。我们将曾用名作为别名保存，对缺少信用代码的记录按名称、地址和法定代表人进行匹配，匹配度不足的交由部门人工确认。同时，我们制定了覆盖完整性、一致性、及时性的((200 余条)){{质量规则}}，每日自动检核，发现问题生成整改工单推送给数据来源部门。经过两轮治理，企业主数据的重复率由((约 18%))降至((1% 以下))，关键字段的完整率提高到((98% 以上))。",
 outline:["<b>释</b>：汇集后需治理才能放心使用","<b>比</b>：使用方自行清洗 vs 中台统一治理","<b>选</b>：避免重复与不一致，统一治理","<b>做</b>：四层建模；主数据（信用代码、身份证号）；权威来源优先；200 余条质量规则","<b>坑</b>：更名与缺信用代码 → 别名 + 多字段匹配 + 人工确认","<b>证</b>：重复率 18% 降至 1% 以下；完整率 98% 以上"],
 memo:"自行清洗 vs 统一治理 → 四层 → 主数据权威优先 → 更名与缺码 → 质量工单", tip:"主数据管理要写清唯一标识和权威来源。", explain:["“权威来源优先”回答了多部门数据冲突时以谁为准，这是政务主数据管理的关键。","质量问题生成工单推送给来源部门，说明治理形成了闭环，而不是中台单方面修数据。"]},
{n:8, short:"段8 论点三·用", role:"论点三：统一数据服务", q:"第三问", target:"470", arg:true, title:"（三）提供统一数据服务",
 text:"治理后的数据要以统一、可控的方式提供给业务使用。服务方式上，部门以往习惯{{直接开放数据库}}或{{导出文件}}，这两种方式无法控制使用范围，也无法追踪数据去向。我选择以 {{API}} 形式提供服务，并在平台网关的基础上建设{{数据服务网关}}，所有数据服务都经过“申请、审批、授权、调用、审计”的流程。服务分为三类：{{核验类}}服务只返回“是否一致”，例如核验企业名称与信用代码是否匹配，不暴露原始数据；{{查询类}}服务按授权返回指定字段；{{订阅类}}服务通过 Kafka 推送数据变更，如企业登记信息变化时通知相关部门。授权精确到{{字段级}}，未授权字段不返回，敏感字段按规则脱敏，每次调用都记录调用方、事由和返回条数。上线后出现了新问题：某部门的批量比对任务在工作时间高频调用企业查询服务，导致其他服务响应变慢。我们为每个调用方设置了{{调用配额和限流}}，批量任务改到夜间执行，并为高频查询的企业基础信息增加缓存。最终中台发布数据服务((80 余个))，日均调用((30 万次))左右；办件中心在受理时直接调用核验和查询服务，营业执照、身份证明等((200 余项))材料实现免提交，相关事项的平均办理时间缩短了((约 40%))。",
 outline:["<b>释</b>：以统一、可控的方式提供使用","<b>比</b>：开放数据库或导出文件 vs API 服务","<b>选</b>：前者不可控、不可追踪，选 API + 数据服务网关","<b>做</b>：申请审批授权调用审计；核验、查询、订阅三类；字段级授权与脱敏","<b>坑</b>：批量任务高频调用拖慢服务 → 配额限流、夜间执行、缓存","<b>证</b>：80 余个服务；日均 30 万次；200 余项材料免提交；办理时间缩短约 40%"],
 memo:"开库导文件 vs API → 五步流程 → 核验、查询、订阅 → 字段级授权 → 配额限流", tip:"“核验类服务只返回是否一致”体现了数据最小化原则，是政务数据服务的亮点。", explain:["三类服务覆盖了不同使用场景，核验类最能体现“数据可用不可见”。","效果从技术指标落到业务成果：材料免提交、办理时间缩短。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"290", title:"四、总结",
 text:"数据中台上线后，部门之间的数据共享从点对点接口转为统一服务，群众办事所需材料明显减少，平台获得了建设单位和各部门的认可。通过本项目我体会到，数据中台建设中技术并不是最难的部分，更难的是{{标准的统一和部门间的协同}}；接入契约、权威来源和整改工单这些管理机制，与分层建模、服务网关等技术手段同样重要。项目也存在不足：部分老旧系统仍通过前置机按天交换文件，{{数据时效性不足}}；质量问题的整改{{依赖来源部门配合}}，部分工单处理周期较长；数据服务的使用效果{{缺少量化评估}}，难以判断哪些服务价值高。后续计划推动老旧系统改造为接口或实时采集，将数据质量纳入部门考核，并建立数据服务的{{使用分析和评价机制}}。",
 outline:["<b>效果与评价</b>：点对点转统一服务；材料减少；各方认可","<b>体会</b>：标准与协同比技术更难；管理机制同样重要","<b>不足</b>：前置机时效不足；整改依赖部门；服务价值缺评估","<b>改进</b>：实时接入；质量纳入考核；服务使用分析"],
 memo:"效果、体会、三不足对三改进", tip:"数据中台的体会落在“管理机制”上，比纯技术总结更真实。", explain:["三项不足分别来自汇聚、治理、服务三个论点。"]}
];

{n:2, short:"段2 摘要·主旨", role:"概括威胁、措施与效果", q:"摘要", target:"220", title:"摘要（二）：威胁、措施与效果",

{n:3, short:"段3 背景痛点", role:"建设背景与安全风险", q:"第一问", target:"330", title:"一、项目背景",
 text:"该平台将原先分散在((十余个))部门系统中的政务事项整合为统一入口，共拆分为((20 余个))服务，并通过数据共享中心汇集了各部门的数据。平台上线后，市民和企业的身份信息、证照、办件材料以及基层治理中的人员信息都集中在一处，{{安全风险也随之集中}}。从外部看，平台直接面向互联网，登录、查询、提交等接口{{暴露面大}}，一旦被攻破，影响的是全市用户；从内部看，工作人员遍布市、区、街道三级，账号数量多、权限复杂，{{内部人员越权查询或泄露数据}}的风险不容忽视；从合规看，平台须满足{{网络安全等级保护第三级}}、{{商用密码应用安全性评估}}以及《个人信息保护法》的要求。此前各部门系统的安全措施各自为政，认证方式、权限模型和日志标准都不统一。因此，安全不能作为上线前的补充工作，而必须在架构设计阶段统一规划。",

{n:4, short:"段4 本人工作", role:"本人工作", q:"第一问", target:"240", title:"二、本人主要工作",

{n:5, short:"段5 设计原则", role:"第二问：安全架构设计原则及内涵", q:"第二问", target:"520", figure:true, title:"三、安全架构设计原则及其内涵",
 text:"安全架构设计的目标，是在系统的各个层次上建立相互配合的安全机制，使系统在面对攻击和误用时仍能保护信息的{{保密性、完整性和可用性}}。常用的设计原则包括：{{最小权限}}，每个用户、服务只授予完成任务所必需的权限；{{纵深防御}}，在网络、接入、应用、数据等多个层次设防，单层失效不至于导致整体失守；{{默认拒绝}}，未明确授权的访问一律拒绝，系统出错时进入安全状态；{{职责分离}}，关键操作由不同角色分别完成，避免权力集中；{{全程可审计}}，重要操作留有记录，事后可追溯。对于隐私保护，还应遵循{{最小必要}}原则，只采集、使用完成业务所必需的个人信息，并在存储、展示、共享各环节加以保护。从安全框架看，{{鉴别框架}}解决“你是谁”，依据主体所知（口令）、所有（令牌、证书）和所是（生物特征）验证身份，主要威胁是{{假冒与重放}}；{{访问控制框架}}解决“能做什么”，由访问控制决策功能（ADF）依据访问控制信息作出判定、访问控制实施功能（AEF）负责执行，主要威胁是{{越权访问}}。本平台按纵深防御的思路，将安全措施分布在接入层、应用层和数据层，每一层都贯彻最小权限和默认拒绝。下面结合项目，按这三个层次论述安全性设计与隐私保护，以及实际遇到的安全威胁和解决办法。",
 outline:["<b>目标</b>：保密性、完整性、可用性","<b>最小权限</b>：只授予必需权限","<b>纵深防御</b>：多层设防","<b>默认拒绝</b>：未授权即拒绝，出错进入安全状态","<b>职责分离</b>：关键操作分角色","<b>全程可审计</b>：可追溯","<b>隐私</b>：最小必要","<b>鉴别框架</b>：所知、所有、所是；威胁假冒、重放","<b>访问控制框架</b>：ADF 判定、AEF 执行；威胁越权","<b>引出</b>：接入层、应用层、数据层"],
 memo:"最小权限、纵深防御、默认拒绝、职责分离、全程审计，加隐私最小必要", tip:"每条原则一句内涵，最后用“纵深防御”引出三层论点。", explain:["第二问要求“原则及其内涵”，每条原则给出一句解释即可，不必展开。","以纵深防御作为组织第三问的线索，第二问与第三问自然衔接。","押题课变体：若题目要求“详细论述鉴别框架和访问控制框架设计，以及面临的主要威胁和危害”，把这两句扩写为第二问主体；第三问论点一“认人”即鉴别框架（撞库属假冒），论点二“控权”即访问控制框架（水平越权），论点三保留数据层。"]},
{n:6, short:"段6 论点一·认人", role:"论点一：接入层身份认证", q:"第三问", target:"470", arg:true, title:"（一）接入层：风险分级的统一认证",
 text:"接入层的首要任务是确认“来的是谁”。平台建设统一认证服务，市民、企业和工作人员分别通过不同方式登录，认证成功后签发{{短时有效的访问令牌}}，并配合刷新令牌续期，各业务服务只认令牌、不再各自维护账号。用户密码采用{{国密 SM3 加盐哈希}}存储，传输链路采用国密算法加密，满足密码应用要求。9 月申报期间，监控发现登录接口失败量突然升高，((1 小时))内出现((20 万次))以上的登录尝试，来源分散在((3000 多个)) IP 上，账号多为常见手机号，判断为{{撞库攻击}}。处置方案有两种：一是按 IP 封禁，二是建立{{风险分级认证}}。攻击来源分散且不断变化，单纯封禁 IP 效果有限，还可能误伤同一出口下的正常用户，因此我选择了后者：根据设备、地点、失败次数和请求频率评估每次登录的风险，低风险直接登录，中风险增加图形验证或短信验证码，高风险直接拒绝并临时锁定账号。同时上线{{弱口令检测}}，提示使用弱口令的用户修改密码。实施初期，风险规则过严，部分在外地出差的用户频繁被要求验证，投诉有所增加。我们随后调整了地点因素的权重，并允许用户将常用设备设为可信设备。此后同类攻击被拦截率达到((98% 以上))，未出现账号被盗用的情况。",
 outline:["<b>释</b>：确认来的是谁","<b>做（基础）</b>：统一认证；短时令牌；SM3 加盐哈希；国密传输","<b>景</b>：9 月 1 小时 20 万次登录尝试，3000 多个 IP，判断为撞库","<b>比</b>：按 IP 封禁 vs 风险分级认证","<b>选</b>：来源分散、易误伤，选风险分级；加弱口令检测","<b>坑</b>：规则过严误伤出差用户 → 调权重、可信设备","<b>证</b>：拦截率 98% 以上，无账号被盗用"],
 memo:"统一认证短令牌 → 撞库 → 封 IP vs 分级 → 低放中验高拒 → 误伤出差调权重", tip:"安全论点要写“威胁—判断—方案—误伤—效果”，体现安全与可用的平衡。", explain:["基础设计与真实威胁结合：先写认证体系，再写撞库攻击如何应对。","“规则过严导致误伤”说明安全措施需要兼顾可用性，这是成熟的写法。"]},
{n:7, short:"段7 论点二·控权", role:"论点二：应用层权限与接口安全", q:"第三问", target:"470", arg:true, title:"（二）应用层：权限收口与接口防护",
 text:"认证解决了“是谁”，应用层要解决的是“能做什么”。上线前的第三方渗透测试发现了一个高危问题：已登录用户修改请求中的办件编号，就能查看他人的办件详情，属于典型的{{水平越权}}。我们当即修复了该接口。9 月下旬的架构评估进一步确认，问题根源不在单个接口，而是部分权限校验仅在前端实现，服务端各自为政。整改有两种方式：逐个接口修补，或将权限校验{{统一收口}}。逐个修补见效快，但难以保证没有遗漏，新增接口也可能重犯，因此我推动统一收口，并于 10 月中旬完成：网关负责令牌校验和{{接口级权限}}判断；服务端提供统一的{{资源归属校验组件}}，凡按编号访问个人数据的接口，都必须校验资源是否属于当前用户；工作人员采用基于角色的权限模型，并按区域和部门限定{{数据范围}}，街道人员只能查看本辖区数据。对于部门系统对接的接口，增加{{签名、时间戳和随机数}}校验，防止请求被篡改和重放；所有数据库访问统一使用参数化查询，防范 SQL 注入。收口改造中，部分历史接口没有遵循统一的参数命名，校验组件无法自动识别资源编号，我们为这些接口补充了注解，并在代码扫描中增加规则，未声明归属校验的接口无法通过流水线。复测时，((30 余个))越权测试用例全部被拦截，平台顺利通过了等级保护测评。",
 outline:["<b>释</b>：认证解决是谁，应用层解决能做什么","<b>景</b>：渗透测试发现改办件编号可看他人办件","<b>比</b>：逐个接口修补 vs 统一收口","<b>选</b>：先急修；架构评估确认根因后统一收口，10 月中旬完成","<b>做</b>：网关接口级权限；资源归属校验组件；角色 + 数据范围；签名、时间戳、随机数；参数化查询","<b>坑</b>：历史接口命名不一 → 注解 + 流水线规则","<b>证</b>：30 余个越权用例全拦截；通过等保测评"],
 memo:"改编号看他人 → 修补 vs 收口 → 网关管接口、服务管归属 → 防重放防注入 → 流水线把关", tip:"水平越权是政务系统最常见的高危漏洞，写清根因和系统性解决办法。", explain:["“先急修再收口”体现了应急处置与根本治理的区分。","把校验要求放进流水线，使规则不依赖人的自觉，这是架构层面的解决方式。"]},
{n:8, short:"段8 论点三·护数", role:"论点三：数据安全与个人信息保护", q:"第三问", target:"490", arg:true, title:"（三）数据层：个人信息保护与行为审计",
 text:"前两层防的是“不该进来的人”和“不该做的事”，数据层还要防范{{合法账号的不当使用}}，并在全生命周期保护个人信息。我们首先对平台数据进行{{分类分级}}，将身份证号、手机号、住址、证照影像等列为敏感个人信息，按级别确定保护措施：采集环节遵循最小必要原则，梳理后取消了((12 项))非必需的采集字段，并在采集时明确告知用途；存储环节对敏感字段采用 {{SM4 加密}}，密钥由密钥管理系统统一保管；展示环节默认{{脱敏}}，确需查看完整信息时须说明事由并留痕；日志和数据共享环节同样执行脱敏和字段级授权。10 月，审计人员发现某街道工作人员账号在半小时内查询了((500 余条))非本辖区人员信息，经核实是账号被他人借用，用于批量查询。这暴露出原有审计只能事后翻查的不足。对此有两种改进方向：加强事后审计频次，或建立{{实时行为监测}}。前者仍然滞后，我选择了后者：为每类岗位建立查询行为基线，查询量、查询范围或时间段明显偏离基线时实时告警，超过阈值则自动冻结账号并通知管理人员；同时在页面中加入带有账号信息的{{数字水印}}，抑制截屏外传。监测上线初期，月末集中核查等正常工作也会触发告警，我们为这类有计划的批量工作增加了报备机制。此后又发现((2 起))异常查询，均在((10 分钟))内被冻结处置，上线以来未发生个人信息泄露事件。",
 outline:["<b>释</b>：防合法账号不当使用；全生命周期保护","<b>做</b>：分类分级；取消 12 项采集字段并告知；SM4 加密与密钥管理；默认脱敏、查看留痕；日志与共享脱敏","<b>景</b>：10 月某账号半小时查 500 余条非辖区信息，系账号借用","<b>比</b>：加强事后审计 vs 实时行为监测","<b>选</b>：事后仍滞后，选实时监测 + 自动冻结 + 水印","<b>坑</b>：月末核查误报 → 报备机制","<b>证</b>：2 起异常 10 分钟内冻结；未发生泄露"],
 memo:"分级 → 最小采集 → 加密 → 脱敏留痕 → 借号批查 → 实时基线 + 冻结 + 水印", tip:"隐私保护按采集、存储、展示、共享的生命周期写，结构完整。", explain:["个人信息保护按生命周期展开，覆盖了《个人信息保护法》关注的主要环节。","内部账号滥用是政务系统的真实风险，写出它能体现对“内部威胁”的认识。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"290", title:"四、总结",

{n:5, short:"段5 概念与区别", role:"第二问：概念、特点与区别", q:"第二问", target:"420", figure:true, title:"三、Vibe Coding 的概念、特点及与传统开发的区别",
 text:"Vibe Coding 是 2025 年初提出的一种开发方式：开发者用{{自然语言描述意图}}，由大模型生成代码，开发者主要通过{{运行结果}}判断是否符合预期，再用自然语言提出修改，反复迭代，而不是逐行编写代码。它的主要特点是：{{以自然语言为主要输入}}，降低了编码门槛；{{迭代速度快}}，原型和样板代码可以在很短时间内生成；{{关注结果而非过程}}，开发者不一定逐行理解生成的代码。与传统开发相比，区别主要体现在三个方面：一是编码主体由人转向 AI，人的工作重心转向描述需求、审查结果和验证质量；二是产出速度大幅提高，但代码的{{可理解性和一致性}}可能下降；三是风险来源发生变化，生成代码可能偏离项目的架构约束，可能引入安全漏洞或不存在的依赖。因此，Vibe Coding 适合原型开发、页面和样板代码，而核心逻辑、安全相关代码必须在严格约束下使用。在本项目中，我们没有放任“只看结果”，而是从架构约束、质量与安全、开发流程三个方面建立了相应机制。",

{n:6, short:"段6 论点一·规", role:"论点一：保证生成代码符合架构约束", q:"第三问", target:"470", arg:true, title:"（一）用规则文件和守护测试约束生成代码",
 text:"引入初期，最先暴露的问题是生成代码{{偏离架构约束}}。流程引擎模块的开发人员让 AI 生成一个查询待办的功能，生成的代码直接读取了办件中心的数据库表，绕过了办件中心的接口；不同开发人员生成的代码在异常处理、日志格式上也各不相同。对此有两种做法：依靠{{事后代码评审}}发现并纠正，或在生成之前就把{{约束交给 AI}}。前者每次都要返工，评审人员负担也很重，因此我选择了后者。具体做法有三项：一是编写{{项目规则文件}}，写明分层规范、禁止跨服务访问数据库、统一异常和日志格式、接口命名约定等，作为每次生成的上下文；二是提供{{参考实现}}，为控制器、服务、适配器等常见类型各准备一个标准样例，让 AI 照着写；三是引入{{架构守护测试}}，用依赖规则检查工具在流水线中自动检查分层和依赖关系，违反规则的代码无法合并。实施中发现，规则文件越写越长，超过一定篇幅后，AI 对后半部分规则的遵循明显变差。我们将规则文件{{按模块拆分}}，只加载与当前任务相关的部分，并把能够自动检查的规则交给守护测试，规则文件只保留需要理解的约定。调整后，流水线中拦截的跨层违规由每周((20 余处))下降到((个位数))，代码风格的一致性也明显提高。",
 outline:["<b>景</b>：生成代码直读办件中心数据库；风格各异","<b>比</b>：事后评审纠正 vs 生成前约束","<b>选</b>：避免反复返工，选事前约束","<b>做</b>：项目规则文件；参考实现；架构守护测试进流水线","<b>坑</b>：规则文件过长后半部分被忽略 → 按模块拆分，可自动检查的交给测试","<b>证</b>：跨层违规每周 20 余处降至个位数"],
 memo:"直读别人库 → 事后 vs 事前 → 规则文件、参考实现、守护测试 → 规则太长就拆", tip:"“规则文件 + 守护测试”是本文最核心的架构治理手段，要写清两者分工。", explain:["规则文件负责“告诉 AI 怎么写”，守护测试负责“检查写得对不对”，两者配合才可靠。","规则文件过长导致遵循变差，是使用大模型时的真实现象。"]},
{n:7, short:"段7 论点二·验", role:"论点二：保障代码质量与安全", q:"第三问", target:"480", arg:true, title:"（二）以测试先行和分级审查保障质量与安全",
 text:"架构约束解决了“写在哪里”，质量与安全要解决的是“写得对不对”。生成代码往往看起来能运行，但边界条件、并发和异常处理容易出问题。迁移工作中，AI 生成的转换脚本把一类会签节点错误地转换成了顺序审批，若未发现，将导致审批规则被改变。质量保障有两种思路：对所有生成代码{{人工逐行审查}}，或{{测试先行加分级审查}}。全部逐行审查会抵消 Vibe Coding 带来的效率，因此我选择了后者。测试先行是指先用自然语言描述功能的行为，生成测试用例并由人审定，再生成实现代码，以审定后的测试作为验收标准。分级审查是把代码分为两级：流程引擎、权限和数据访问等{{核心代码}}必须双人逐行审查；页面、样板代码等{{外围代码}}以测试和抽查为主。对于 ((300 余个))流程的迁移，我们用历史办件数据进行{{回放比对}}，新旧流程走向不一致的逐个人工核查。安全方面，流水线中加入静态代码扫描和依赖扫描。实施中还出现了一个意外：AI 建议引入的一个依赖包版本并不存在，另一个存在已知漏洞。此后我们规定依赖只能从内部制品库的{{白名单}}中选择，新增依赖须经评审。最终，迁移流程的回放一致率达到((99.6%))，其余差异均经业务确认后修正；四期上线后的缺陷密度未高于以往版本。",
 outline:["<b>景</b>：生成代码看似能跑；迁移脚本把会签错转为顺序审批","<b>比</b>：全部逐行审查 vs 测试先行 + 分级审查","<b>选</b>：逐行审查抵消效率，选后者","<b>做</b>：先审测试再生成实现；核心双人逐行、外围抽查；历史办件回放比对；静态与依赖扫描","<b>坑</b>：AI 推荐不存在的版本和有漏洞的依赖 → 内部白名单","<b>证</b>：回放一致率 99.6%；缺陷密度未高于以往"],
 memo:"会签变顺序 → 逐行 vs 测试先行 → 核心双人、外围抽查 → 回放比对 → 依赖白名单", tip:"“先审测试，再生成实现”是 AI 编程质量保障的关键做法。", explain:["会签被错转为顺序审批，是业务后果明确的真实问题，比泛泛说“生成代码有缺陷”更具体。","AI 推荐不存在或有漏洞的依赖，是 AI 编程特有的安全风险。"]},
{n:8, short:"段8 论点三·流", role:"论点三：开发流程的变化", q:"第三问", target:"440", arg:true, title:"（三）开发流程与团队分工的调整",
 text:"前两项措施落实后，Vibe Coding 对{{开发流程}}的影响逐渐显现。以往的流程是业务分析人员编写需求文档，开发完成后再演示给业务部门，往往到演示时才发现理解有偏差。对此有两种做法：维持原流程，只把 AI 当作代码补全工具；或{{调整流程}}，发挥其快速生成的优势。我选择了后者。在需求阶段，业务分析人员和开发人员在需求评审会上用 AI 当场生成{{可交互的原型}}，例如流程设计器的节点配置页面，业务人员直接操作并提出修改，确认后再进入开发。团队分工也随之调整：开发人员的工作重心转向{{编写规格、审查代码和设计测试}}；架构师负责维护规则文件和参考实现；测试人员提前参与，与开发人员共同审定测试用例。迭代周期由((两周))缩短为((一周))。调整过程中也出现了问题：原型生成太快，业务部门在开发阶段仍不断提出新的修改，需求反复变化。我们因此规定原型只用于确认需求，确认后设定{{需求冻结点}}，冻结后的变更进入下一迭代。四期最终按期交付，开发工作量较原估算减少((约 30%))，因理解偏差导致的返工明显减少；流程平台上线后，新事项流程的配置上线时间由((2 周))缩短至((2 天))。",
 outline:["<b>景</b>：需求文档到演示才发现偏差","<b>比</b>：只当补全工具 vs 调整流程","<b>选</b>：发挥快速生成优势，调整流程","<b>做</b>：评审会当场生成可交互原型；开发转向规格、审查、测试；架构师维护规则；测试前移；迭代一周","<b>坑</b>：原型太快导致需求反复 → 需求冻结点","<b>证</b>：按期交付；工作量减少约 30%；配置上线 2 周缩至 2 天"],
 memo:"演示才发现偏差 → 当场出原型 → 人转向规格、审查、测试 → 冻结点防反复", tip:"写出角色变化，回答“对开发流程的影响”。", explain:["首句承接前两项措施，说明流程变化建立在约束与质量机制之上。","“原型太快导致需求反复”是真实的副作用，写出来更可信。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"290", title:"四、总结",
 text:"平台四期按期交付，自定义流程平台上线后，业务人员已自行配置和调整了((百余个))事项流程，开发团队不再疲于应付流程变更，得到了建设单位的认可。通过本项目我体会到，Vibe Coding 提高了编码速度，但{{架构约束、质量标准和安全要求}}不会因此降低，反而需要以规则文件、守护测试和分级审查等更明确的形式表达出来；架构师的工作也从“写代码、审代码”更多转向“定规则、守边界”。项目也存在不足：规则文件的维护{{依赖少数人}}，人员变动时存在风险；生成代码的{{可理解性}}仍不如人工代码，后期维护成本有待观察；对 AI 使用效果的度量{{较为粗略}}。后续计划将规则文件纳入版本管理并建立评审机制，要求核心代码补充设计说明，并建立 AI 生成代码占比、缺陷率等度量指标。",
 outline:["<b>效果与评价</b>：按期交付；业务人员自配百余个流程；建设单位认可","<b>体会</b>：约束不降低，形式更明确；架构师转向定规则、守边界","<b>不足</b>：规则维护依赖少数人；可理解性；度量粗略","<b>改进</b>：规则版本管理与评审；核心代码设计说明；建立度量指标"],
 memo:"效果、体会、三不足对三改进", tip:"“架构师从写代码转向定规则、守边界”是本文的立意。", explain:["不足中的“可理解性”与第二问中 Vibe Coding 的局限相呼应。"]}
];

{n:4, short:"段4 本人工作", role:"本人工作", q:"第一问", target:"230", title:"二、本人主要工作",
 text:"四期团队中，智能办事助手由((5 名))开发人员负责，技术栈在原有 {{Spring Cloud}}、{{Kafka}}、{{Redis}} 和政务云私有化大模型的基础上，引入了{{模型上下文协议}}用于工具接入。我负责四期的总体架构设计，在智能办事助手方面主要做了以下工作：确定智能体的{{总体架构}}，划分规划、工具、记忆和安全控制四个部分；梳理可开放给智能体的{{业务能力清单}}，并为每项能力确定读写属性和权限要求；设计{{记忆分层}}和个人信息的存储边界；制定写操作确认、人工接管等{{安全控制规则}}；并组织业务部门对智能体的办事过程进行{{抽检评估}}。",
 outline:["<b>团队与技术</b>：5 人；原有技术栈 + 私有化大模型 + 模型上下文协议","<b>工作</b>：总体架构四部分；业务能力清单与读写属性；记忆分层；安全控制规则；抽检评估"],
 memo:"四部分架构、能力清单、记忆、安全、评估", tip:"“为每项能力确定读写属性”是智能体安全设计的起点。", explain:["工作内容与三个论点逐一对应。"]},
{n:5, short:"段5 组成与区别", role:"第二问：智能体组成及与问答应用的区别", q:"第二问", target:"420", figure:true, title:"三、智能体的基本组成及其与问答式应用的区别",
 text:"大模型智能体是以大模型为核心，能够围绕目标{{自主规划、调用工具并根据结果调整行动}}的软件系统。它通常由四部分组成：{{规划}}，把用户目标分解为若干步骤，并在执行中根据结果调整；{{工具}}，即智能体可以调用的外部能力，如查询接口、业务操作和计算服务；{{记忆}}，包括当前会话的短期记忆和跨会话保存的长期记忆；{{行动与反馈}}，执行工具调用并观察结果，决定下一步。与传统的问答式大模型应用相比，区别主要在于：问答式应用{{只生成文本}}，输出由人来判断和使用；智能体则{{直接作用于外部系统}}，一次任务可能包含多次调用，过程不完全可预知。这带来了新的架构要求：工具必须规范封装、可被模型正确理解；多轮任务需要可靠的状态和记忆管理；对外部系统的操作必须可控、可追溯、可接管。下面结合项目，从任务规划与工具调用、记忆与知识管理、安全可控与人工协同三个方面，论述智能办事助手的架构设计及效果。",
 outline:["<b>定义</b>：围绕目标自主规划、调用工具、根据结果调整","<b>四部分</b>：规划、工具、记忆、行动与反馈","<b>区别</b>：问答只生成文本；智能体直接作用于外部系统、过程不完全可预知","<b>新要求</b>：工具规范封装；状态与记忆；操作可控可追溯可接管","<b>引出</b>：规划与工具；记忆与知识；安全与人工协同"],
 memo:"规划、工具、记忆、行动；问答只说，智能体要做", tip:"区别要落到“直接作用于外部系统”，由此推出三项架构要求。", explain:["三项架构要求正是第三问的三个方面，第二问完成了埋线。"]},
{n:6, short:"段6 论点一·划", role:"论点一：任务规划与工具调用", q:"第三问", target:"480", arg:true, title:"（一）任务规划与工具调用",
 text:"任务规划要解决的是“先做什么、后做什么”。以“我要开饭店”为例，智能体需要识别出营业执照、食品经营许可等事项，查询办理条件，预填表单，提示所需材料。规划方式有两种：按场景{{预定义工作流}}，或完全由{{模型自主规划}}。预定义工作流结果确定、易于测试，但无法覆盖长尾需求；模型自主规划灵活，但步骤不可预知，出错难以排查。我选择了{{两者结合}}：对开饭店、新生儿出生、退休等((20 余个))高频“一件事”场景，预先定义工作流，由模型负责理解意图和填充参数；其余需求由模型在受限的工具范围内自主规划，并设置最大步数。工具接入方面，我们把查询事项、查询办件、表单预填、材料预审、预约窗口等能力按{{模型上下文协议}}封装，统一注册到工具网关，每个工具声明参数格式、读写属性和所需权限；表单预填调用数据共享中心的核验和查询服务，避免模型凭空填写。试运行中出现了两类问题：模型有时在查询失败后反复调用同一工具，形成循环；有时生成的参数格式不符合要求。我们在工具网关增加{{参数格式校验}}，校验失败的结果连同原因返回给模型重新规划，并限制同一工具的连续调用次数，超过即转入人工。调整后，常见办事任务的完成率约为((82%))，平均每个任务调用工具((3 至 4 次))。",
 outline:["<b>释</b>：先做什么、后做什么","<b>比</b>：预定义工作流 vs 模型自主规划","<b>选</b>：两者结合：20 余个高频场景工作流，长尾受限规划","<b>做</b>：工具按模型上下文协议封装，注册到工具网关，声明参数、读写、权限；预填调用数据中台","<b>坑</b>：循环调用、参数格式错 → 参数校验、失败原因回传重规划、连续调用上限","<b>证</b>：完成率约 82%；平均调用 3 至 4 次"],
 memo:"工作流 vs 自主 → 高频走流程、长尾受限规划 → 工具网关声明读写 → 循环与参数两个坑", tip:"“确定性场景用工作流，长尾用规划”是当前智能体落地的主流做法。", explain:["表单预填调用数据共享中心服务，与数据中台篇衔接，体现同一平台的整体性。","循环调用和参数错误是智能体最常见的问题，处理方式具体。"]},
{n:7, short:"段7 论点二·记", role:"论点二：记忆与知识管理", q:"第三问", target:"450", arg:true, title:"（二）记忆与知识管理",
 text:"办事任务往往要多轮对话才能完成，智能体需要{{记得住}}前面说过的内容。最初我们把完整对话历史全部放入模型上下文，对话一长，模型就会忽略前面确认过的信息，推理成本也随之上升。对此有两种做法：扩大上下文长度，或{{分层管理记忆}}。前者成本高，且不能解决信息被忽略的问题，因此我选择了分层管理：{{短期记忆}}保存当前会话，超过一定轮数后由模型将早期对话压缩为摘要，已确认的关键信息如所办事项、已填字段，以{{结构化任务状态}}单独保存，每轮都完整传入；{{长期记忆}}只保存用户授权的办事偏好和历史办件编号等结构化标签，不保存对话原文，用户可以随时查看和删除；{{知识}}则沿用一期的事项知识库，通过检索获取。任务状态保存在 Redis 中，群众中断后再次进入，可以从上次的步骤继续办理。实施中，我们发现摘要压缩偶尔会丢失用户补充的限制条件，如“只办理个体工商户”。此后规定凡涉及办事条件的信息都写入结构化任务状态，不依赖摘要保存。调整后，单次会话的平均模型调用成本下降了((约 40%))，多轮任务中因遗忘导致的重复询问明显减少。",
 outline:["<b>景</b>：全量历史放上下文，长对话遗忘、成本上升","<b>比</b>：扩大上下文 vs 分层记忆","<b>选</b>：成本高且仍会忽略，选分层","<b>做</b>：短期记忆 + 摘要；结构化任务状态；长期记忆只存授权标签、可查可删；知识沿用检索","<b>坑</b>：摘要丢失限制条件 → 办事条件一律写入任务状态","<b>证</b>：调用成本下降约 40%；可中断续办；重复询问减少"],
 memo:"全塞上下文会忘 → 分层 → 摘要、任务状态、授权标签、知识检索 → 条件不靠摘要", tip:"长期记忆的隐私边界（只存授权标签、可查可删）一定要写。", explain:["“结构化任务状态”把关键信息与对话分开保存，是智能体记忆设计的关键。","长期记忆的隐私处理与安全篇的最小必要原则一致。"]},
{n:8, short:"段8 论点三·控", role:"论点三：安全可控与人工协同", q:"第三问", target:"470", arg:true, title:"（三）安全可控与人工协同",
 text:"智能体能够操作业务系统，{{安全可控}}是上线的前提。控制方式有两种：主要依靠提示词约束模型，或在架构上设置{{硬性控制点}}。提示词无法保证模型始终遵守，因此我选择了后者，并设置了三道控制。第一，{{身份传递}}：智能体不持有任何特权账号，所有工具调用都携带当前用户的访问令牌，由业务服务按用户本人的权限校验，智能体能做的事不会超过用户本人能做的事。第二，{{写操作确认}}：查询类工具可以自动调用，提交申请、预约窗口等写操作，必须向用户展示将要提交的内容，由用户确认后才执行。第三，{{人工接管}}：当模型置信度低、连续调用失败或用户要求时，会话转给人工坐席，坐席可以看到智能体已执行的步骤和任务状态，无需从头询问。试运行中，测试人员在上传的材料图片中嵌入了隐藏文字，试图让智能体修改他人的办件，属于{{间接提示词注入}}。由于身份传递机制的存在，该操作被业务服务拒绝，但暴露出工具返回内容被模型当作指令的问题。我们随即规定，工具返回和用户上传的内容只作为数据提供给模型，并在提示词中与系统指令隔离，同时增加异常操作告警。上线以来，约((12%))的会话转由人工接管，未发生越权操作，群众申请的退件率下降了((约三成))。",
 outline:["<b>释</b>：能操作业务系统，安全可控是前提","<b>比</b>：提示词约束 vs 架构硬性控制点","<b>选</b>：提示词不可靠，选硬性控制","<b>做</b>：身份传递（无特权账号）；写操作用户确认；人工接管可见步骤","<b>坑</b>：材料图片中隐藏指令的间接注入 → 工具返回与上传内容只作数据、与指令隔离、异常告警","<b>证</b>：约 12% 人工接管；无越权；退件率下降约三成"],
 memo:"不给特权、写要确认、随时接管；外来内容只当数据", tip:"“智能体能做的不超过用户本人能做的”是智能体权限设计的核心原则。", explain:["身份传递使越权在业务服务层被拦截，即使模型被诱导也无法越权，这是纵深防御在智能体上的应用。","间接提示词注入是 2025 年智能体安全的热点问题。"]},
{n:9, short:"段9 总结", role:"效果、评价、体会、不足与改进", q:"结尾", target:"290", title:"四、总结",
 text:"智能办事助手上线后，常见办事任务的完成率约为((82%))，群众申请的退件率下降了((约三成))，未发生越权操作，获得了建设单位的认可。通过本项目我体会到，智能体架构设计的重点，是在模型的灵活性与系统的{{确定性}}之间划清边界：确定的事交给工作流和业务规则，权限交给业务系统本身，模型只在受限范围内发挥理解和规划能力。项目也存在不足：长尾任务的完成率{{仍然偏低}}；智能体的效果评估{{主要依靠人工抽检}}；工具数量增加后，模型选错工具的情况有所增多。后续计划将高频的长尾任务逐步沉淀为工作流，建立覆盖典型任务的{{自动化评测集}}，并按场景对工具进行分组，减少每次规划时可选的工具数量。",
 outline:["<b>效果与评价</b>：完成率约 82%；退件率降约三成；无越权；建设单位认可","<b>体会</b>：在灵活性与确定性之间划清边界","<b>不足</b>：长尾完成率低；评估靠抽检；工具多易选错","<b>改进</b>：长尾沉淀为工作流；自动化评测集；工具分组"],
 memo:"效果、体会、三不足对三改进", tip:"体会落在“灵活性与确定性的边界”，概括了三个论点的共同思路。", explain:["三项改进分别对应三个论点中的遗留问题。"]}
];

{n:1, short:"段1 摘要·项目", role:"交代项目与本人职责", q:"摘要", target:"160", title:"摘要（一）：项目与职责",
 text:"{{2025 年 5 月}}，我参与了某市{{政务服务一网通办与基层治理协同平台四期}}的建设，担任{{系统架构师}}。按照政务信息系统信息技术应用创新的要求，四期需要将平台从原有的 x86 服务器和国外商业软件环境，迁移到政务云提供的{{信创资源池}}上。项目建设周期((7 个月))，团队共((15 人))。我负责四期的总体架构设计，并主持了平台的{{国产化迁移}}方案设计与实施。",
