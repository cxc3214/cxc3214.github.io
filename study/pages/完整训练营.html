<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>论文练习室 · 7天把逻辑写清楚</title>
<style>
:root{--paper:#faf7ef;--card:#fffefa;--ink:#223d3c;--muted:#5c706d;--green:#285d50;--mint:#e2eee5;--yellow:#f6d988;--line:#d7ded3;--red:#9e4639;--rose:#f7e5dd;--blue:#e7edf3;--r:24px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a,summary,input,select,textarea{touch-action:manipulation}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:11px 18px;background:var(--card);color:var(--ink);font-weight:650;line-height:1.5}button:hover{background:var(--mint);border-color:#92b2a0}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{background:#1d4a3e}button.soft{background:var(--mint);border-color:transparent}button.danger{color:var(--red)}a{color:var(--green);text-underline-offset:4px}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c68e23;outline-offset:4px}.top{max-width:1140px;margin:auto;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:15px;font-weight:800;letter-spacing:2px}.brand span{display:inline-grid;place-items:center;width:32px;height:32px;background:var(--yellow);border-radius:50%;margin-right:10px;letter-spacing:0}.top small{font-size:13px;color:var(--muted)}main{max-width:1040px;margin:auto;padding:10px 28px 90px}.hero{position:relative;padding:46px 48px;background:var(--mint);border-radius:30px;overflow:hidden}.hero:after{content:'写';position:absolute;right:30px;top:25px;color:#bfd5c8;font-size:160px;line-height:1;font-weight:900;transform:rotate(-12deg);pointer-events:none}.hero>*{position:relative;z-index:1}.eyebrow{font:700 13px/1.5 ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(30px,4.8vw,46px);line-height:1.3;letter-spacing:-1px;max-width:700px;margin:13px 0 14px}h2{font-size:27px;line-height:1.4;margin:0 0 16px;letter-spacing:-.5px}h3{font-size:20px;line-height:1.5;margin:20px 0 10px}p{margin:12px 0}.subtitle{font-size:19px;font-weight:650}.goal{max-width:740px;color:#415e56;margin-bottom:0}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 0}.pill{background:#ffffffae;border-radius:30px;padding:4px 13px;font-size:13px;font-weight:700}.route{display:flex;gap:9px;overflow:auto;white-space:nowrap;padding:22px 1px}.route a{padding:7px 15px;background:white;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:14px}.route a.active{background:var(--green);color:white}.statusline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 24px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:16px 18px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:16px}.notice{padding:17px 21px;border-radius:17px;background:#f7ecd0;font-size:14px;line-height:1.8;margin:18px 0}.notice.plain{background:#eeeae1}.notice.bad{background:var(--rose);color:#773a30}.section{padding:31px 35px;margin:24px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 3px 0 #31473e04}.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px}.sectionhead .num{font:700 13px ui-monospace,monospace;color:var(--muted)}.lead{color:var(--muted);margin-top:-3px}.readblock{padding:10px 0 24px;border-bottom:1px dashed var(--line)}.readblock:last-child{border-bottom:0}.readblock p{white-space:pre-line;line-height:2.02}.source{font-size:12px;line-height:1.6;color:var(--muted);display:block;padding-top:8px}.checkline{display:flex;align-items:flex-start;gap:12px;padding:14px 17px;background:var(--mint);border-radius:14px;font-size:15px;margin-top:20px;cursor:pointer}input[type=checkbox],input[type=radio]{accent-color:var(--green);width:20px;height:20px;flex-shrink:0;margin-top:5px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:24px 0}.node{position:relative;background:var(--mint);padding:19px;border-radius:17px}.node:nth-child(2n){background:#f9eed2}.node small{font:800 12px ui-monospace,monospace;color:var(--green)}.node strong{display:block;font-size:17px;margin:7px 0}.node p{font-size:14px;line-height:1.65;margin:0}.arrow{position:absolute;right:10px;top:12px;font-size:20px;color:#779485}.flowcaption{font-size:14px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.flash{text-align:left;min-height:145px;padding:20px;font-weight:500;background:#f3f5ed;border-radius:18px}.flash b{display:block;font-size:16px}.flash span{display:block;color:var(--muted);font-size:14px;line-height:1.7;margin-top:12px}.flash small{display:block;font-size:12px;color:#577c63;margin-top:12px}.flash[aria-expanded=true]{background:#fff2cc}.steps{counter-reset:step}.step{display:grid;grid-template-columns:44px 1fr;gap:15px;margin:25px 0}.step:before{counter-increment:step;content:counter(step);display:grid;place-items:center;align-self:start;background:var(--mint);border-radius:50%;width:40px;height:40px;font-weight:800}.step b{font-size:17px}.step small{font-size:12px;margin-left:10px;color:var(--muted)}.step p{font-size:15px;line-height:1.8;margin:5px 0}.question{border:0;padding:22px 0;margin:0;border-bottom:1px dashed var(--line);min-width:0}.question legend{padding:0;font-weight:700;font-size:17px}.critical{font-size:11px;background:#f4e0bd;border-radius:5px;padding:3px 6px;color:#76551c;white-space:nowrap;margin-left:6px}.option{display:flex;align-items:flex-start;gap:11px;background:#f6f5ef;border-radius:12px;padding:11px 14px;margin:9px 0;cursor:pointer;font-size:15px}.option:hover{background:var(--mint)}.explain{background:var(--mint);border-radius:12px;padding:13px 17px;font-size:14px;margin:12px 0}.explain.wrong{background:var(--rose)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:21px}.result{font-size:16px;font-weight:700;margin-top:17px}.quiet{font-size:13px;color:var(--muted)}.timerbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 21px;background:var(--ink);color:#fff;border-radius:16px;margin:18px 0}.timer{font:700 27px ui-monospace,monospace;letter-spacing:1px}.timerbar small{display:block;font-size:12px;color:#c1d9cd}.prompt{font-size:16px;background:#f3f0e7;padding:18px 21px;border-radius:15px;white-space:pre-line}.editor{display:block;resize:vertical;width:100%;min-height:380px;border:1px solid #b8c9b9;background:#fffef9;border-radius:16px;padding:22px;line-height:1.9;font-size:17px;color:var(--ink);margin-top:18px}.counts{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted);margin-top:9px}.revealbox{background:#faf2df;padding:18px 22px;border-radius:15px;font-size:15px;white-space:pre-line;margin-top:14px}.rubric{padding:20px 0;border-bottom:1px dashed var(--line)}.rubric strong{font-size:17px}.rubric p{font-size:14px;color:var(--muted);margin:4px 0 12px}.rubric select{width:100%;border:1px solid var(--line);background:#f8f7f0;padding:10px 13px;border-radius:10px;color:var(--ink)}.rubric input{margin-top:10px;width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:9px 13px;font-size:14px}.footer{text-align:center;font-size:13px;color:var(--muted);margin-top:35px}.studyhidden{display:none!important}.progress{height:5px;border-radius:6px;background:#d9dfd3;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:var(--green);transition:width .3s}.topselect{max-width:440px;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.mono{font-family:ui-monospace,monospace}.manualcopy{width:100%;min-height:160px;font-size:13px;margin-top:12px}.sessionnote{font-size:14px;color:var(--red)}[hidden]{display:none!important}details>summary{cursor:pointer;font-weight:700}.printnote{display:none}@media(max-width:700px){body{font-size:16px}.top{padding:15px 18px;align-items:flex-start;flex-direction:column;gap:10px}.top small{font-size:12px}main{padding:5px 15px 65px}.hero{padding:29px 25px;border-radius:23px}.hero:after{right:8px;top:30px;font-size:100px;opacity:.6}.hero h1{max-width:450px}.subtitle{font-size:16px}.goal{font-size:15px}.statusline{gap:7px}.stat{padding:12px 10px}.stat strong{font-size:13px}.stat small{font-size:11px}.section{padding:23px 21px;border-radius:20px}h2{font-size:23px}h3{font-size:18px}.cards,.flow{grid-template-columns:1fr}.node{padding:16px 19px}.node strong{margin:3px 0}.flash{min-height:115px}.sectionhead{align-items:flex-start}.editor{padding:15px;font-size:16px}.timerbar{padding:14px}.timer{font-size:23px}.route{padding:16px 0}.notice{padding:14px 17px}.step{grid-template-columns:34px 1fr;gap:10px}.step:before{width:32px;height:32px}.topselect{width:100%;max-width:100%}.actions button{flex:1 1 auto}.question legend{font-size:16px}.option{font-size:15px} .readblock p{line-height:1.95}}@media print{body{background:white}.top,.route,.actions,.footer,.flash,.timerbar{display:none!important}.section{break-inside:avoid;box-shadow:none;padding:15px}.hero{padding:20px}textarea{min-height:0}.printnote{display:block}}
</style></head><body><header class="top"><div class="brand"><span>7</span>论文练习室</div><div id="chooser"></div></header><main id="app"></main><noscript>本练习需要浏览器启用 JavaScript 才能显示课程和保存本地进度。没有内容会上传。</noscript>
<script>
const DAYS=[{"day": 1, "title": "把「异步削峰」真正写明白", "subtitle": "高并发 · 从短信堵车到可靠排队", "date": "10/15", "minutes": 45, "goal": "今天只攻一个关键段。你要能用自己的话解释：为什么不能超时就跳过，怎样把慢任务移出主链路，又怎样保证后续有人处理。记逻辑和术语，不背整篇字句。", "reading": [{"title": "01 先看现场：一条慢短信，为什么拖住整个申报？", "source": "改写自原文件：高并发篇第 8 段", "text": "申报截止前，用户集中提交申请。原来的接口在同一个请求里依次完成校验、写入办件、更新状态、发送短信、同步监管数据和更新统计。只要短信网关变慢，提交请求就要一直等，线程被占住，用户又因看不到结果重复点击，压力反而更大。这里真正的矛盾是：核心办件提交必须及时完成，后续通知和数据加工却被串在了同一条等待链上。\n\n写作文时不要只说“并发高，所以用了 Kafka”。先写出“短信慢 → 主请求阻塞 → 用户重试 → 重复申请”这条因果链，再提出方案。这样，架构选择才有业务现场。"}, {"title": "02 方案比较：快一点，不能以漏数据为代价", "source": "改写自原文件：高并发篇第 8 段", "text": "团队可以给短信与监管同步设置超时，超时后直接跳过；也可以把这些工作移出提交主流程。第一种改动较小，但如果没有持久记录和补偿，跳过就意味着通知或监管记录可能永久缺失。范文的业务约束是监管数据纳入考核，不允许缺失，因此选用异步处理。\n\n提交接口只负责校验、写入办件和更新状态；短信通知、监管同步与统计加工由后台消费任务处理。接口返回的是“申请已受理”，不代表短信已经送达，也不代表监管端已经同步完成。异步化缩短的是主流程等待，代价是最终完成存在延迟，并增加消息与补偿的运维复杂度。"}, {"title": "03 不漏，不重，也不能悄悄失败", "source": "原文措施 + 明确标记的教学补充", "text": "原文在提交侧加入幂等校验，并在消费侧配置堆积监控、有限重试、死信队列和专人核对。理解顺序是：用户重试不能产生第二笔相同业务；后台失败要有记录和重试出口；重试仍失败要转入待处理队列并告警；人工核对后再补偿，不能让死信成为无人查看的垃圾箱。\n\n教学补充：Kafka 不会自动让数据库事务和消息发送成为一个原子操作。可在同一数据库事务中写入办件状态与本地消息表（Outbox），提交成功后由投递任务把消息发送到 Kafka，收到确认后标记投递状态，失败可重试。投递后、标记前崩溃会引起重复投递，因此消费端还需按事件 ID 或业务流水号做幂等，并将去重记录与业务更新可靠衔接。对短信这类外部副作用，还要确认供应商是否支持幂等请求或结果查询。\n\n教学补充：申请人加事项只是范文中的简化表述，真实业务可能允许同一人多次办理同一事项。幂等键应识别“同一次申请”，例如申请流水号或含批次的业务键，避免把合法的新申请误判为重复。"}, {"title": "04 削峰之后还要管容量，最后要写验证与代价", "source": "改写自原文件：高并发篇第 8—9 段；验证建议为教学补充", "text": "队列能暂存突发流量，不能无限增加系统的处理能力。如果输入长期大于消费速度，消息仍会越积越多。范文依据压测结果为查询和提交接口设定网关限流阈值，同时让服务按 CPU 和请求量自动扩容。限流负责过载时保住核心服务，扩容负责在资源允许时提高处理能力；二者配合，还要看数据库、下游和消费者是否已达到上限。\n\n验证时要同时看提交延迟、成功率、积压消息数量和最老消息等待时间，并用故障注入检查重试、重复投递与死信补偿是否有效。原文用“短信延迟约 3 分钟”说明异步方案的代价，该数字属于练习范文，不是你的实测成绩。没有真实监控数据时，练习中写“拟通过压测和故障演练验证”，不要写成已经取得效果。"}], "flow": [{"title": "入口限流 + 提交幂等", "text": "识别同一次申请；超载明确提示，不冒充受理成功"}, {"title": "校验 + 办件事务", "text": "写办件与状态；补充方案：同事务写 Outbox"}, {"title": "可靠投递 → Kafka", "text": "确认、重试；允许重复，不能无记录地遗失"}, {"title": "消费者幂等处理", "text": "短信 / 监管 / 统计；受理成功 ≠ 全部任务完成"}, {"title": "失败有出口", "text": "有限重试 → 死信 → 告警与人工核对 → 补偿"}, {"title": "容量与验证闭环", "text": "看积压与最老消息；限流、扩容、压测和故障演练"}], "cards": [{"q": "六拍写段落，先后是什么？", "a": "现场问题 → 方案比较 → 本人选择及依据 → 具体实现 → 异常处理 → 验证结果与代价。背这个逻辑，不必逐字背范文。"}, {"q": "为什么不是“超时后跳过”？", "a": "无持久记录和补偿的跳过可能丢监管数据，不符合“不允许缺失”的业务约束。超时本身仍可作为隔离手段，但后续任务必须可追踪、可补偿。"}, {"q": "主流程留下什么？", "a": "校验、写入办件、更新状态；保证必要的业务事务提交。短信、监管同步、统计加工异步完成。"}, {"q": "两处幂等各防什么？", "a": "提交幂等防用户重试造成重复受理；消费幂等防消息重复投递造成重复业务副作用。"}, {"q": "数据库提交了，消息没发出去怎么办？", "a": "教学补充：办件和 Outbox 同事务写入，投递器确认发送并可重试；重复投递再由消费端幂等兜住。"}, {"q": "异步化之后，最危险的是什么？", "a": "后台静默失败。用堆积/最老消息监控、有限重试、死信、告警和责任人补偿构成闭环。"}, {"q": "限流和扩容，为什么不能只写一个？", "a": "限流保住承载上限，扩容提升可用容量；扩容有时延与资源边界。队列只削峰，不创造无限容量。"}], "steps": [{"minutes": 9, "title": "读懂并画出来", "text": "读上面四段，用手指沿流程图走一遍。用一句话说出监管约束，再指出“申请已受理”和“短信已送达”分别发生在哪里。"}, {"minutes": 6, "title": "遮住答案，回忆关键词", "text": "先口述六拍，再逐张翻卡校对。重点不是背组件名，而是解释每个措施修复哪一种失败。说不清的卡片再读对应段落。"}, {"minutes": 5, "title": "完成情境测验", "text": "独立选择 5 题，提交后阅读每题解释。至少 4/5 且关键题全对才算客观题通过；不通过先改正理解再重测，历史尝试会保留。"}, {"minutes": 20, "title": "闭卷写一段", "text": "点击开始后材料收起，围绕题目写 350—500 字，串起“景、比、选、做、坑、证”。可以查看提示，但查看次数会如实记入打卡。"}, {"minutes": 5, "title": "自检并交给 007", "text": "按五个维度评估，给出文本证据或待改点。导出或复制打卡，把正文发给 007 批改。客观题通过不等于作文通过。"}], "quiz": [{"q": "短信网关变慢，监管数据又不允许缺失。哪种改法最符合约束？", "options": ["统一设很短的超时，超时便丢弃后续任务", "核心办件完成后，可靠记录后续任务并异步处理，失败可追踪补偿", "不停增加提交服务实例，忽略下游限制", "把所有请求无限缓存，永不拒绝"], "correct": 1, "critical": true, "explanation": "关键在“主流程解耦 + 后续任务可靠可追踪”。超时可以保护主流程，但无补偿的跳过违反监管约束；扩容也不能修复下游慢和丢任务。"}, {"q": "用户再次点击提交，Kafka 也可能重复投递。哪一项设计最完整？", "options": ["只在页面禁用按钮", "只有消费者做幂等", "提交按同一次申请做幂等，消费者按事件/流水号做幂等", "仅扩大队列分区数"], "correct": 2, "critical": true, "explanation": "两处重复的来源不同，需要分别约束。前端按钮不是可靠防线；幂等键也不能误伤合法的不同申请。"}, {"q": "业务库事务已提交，进程却在发 Kafka 前崩溃。哪种补充方案能覆盖这个缺口？", "options": ["认为 Kafka 有副本，所以一定不会丢任务", "让用户自己发现后重填", "把消息发送前的日志删掉", "在同一事务写办件与本地消息表，投递器重试，消费端处理重复"], "correct": 3, "critical": false, "explanation": "本地消息表使“应当发送什么”与业务状态一起持久化。它仍需投递确认、重试和消费幂等，并不是写上 Outbox 一词就自动获得端到端保证。"}, {"q": "后台消费速度长期低于进入队列的速度，应如何判断？", "options": ["有队列就不会影响业务，无需处理", "异步只能缓冲短期尖峰，需看积压/最老消息，并做限流、扩容或下游治理", "只监控提交接口 CPU 就够了", "把有限重试改成无限重试，问题自然消失"], "correct": 1, "critical": true, "explanation": "积压增长意味着最终完成时间越来越长。限流、容量和慢下游要一起治理，无限重试还可能放大拥塞。"}, {"q": "哪一种论文效果表述最可信？", "options": ["上了 Kafka 后绝对零丢失，永无延迟", "范文写 99.9%，因此我的项目也达到 99.9%", "只写性能变好，不提代价", "用真实监控/演练证据说明效果与通知延迟；缺数据时标明验证计划"], "correct": 3, "critical": false, "explanation": "效果必须有口径和证据，且说清异步延迟、人工补偿和资源成本等代价。范文数字不能冒充本人经历。"}], "writing": {"title": "写作任务：异步削峰与容量保障", "prompt": "练习情境：截止日前提交集中，短信变慢拖住提交，用户重复点击。监管数据要求不缺失。请写一个完整论点段，说明问题、备选方案与取舍、主流程与异步职责、可靠衔接与防重、失败处理、容量和验证代价。你可以使用范文项目作练习，但要明确标注；若改写个人项目，只写有依据的事实。", "minutes": 20, "target": "建议 350—500 字；首日练清逻辑即可，字数不判作文质量", "hint": "景：串行短信拖慢提交。比：超时跳过 vs 移出主流程。选：监管不能缺失。做：主流程保留校验/办件/状态；异步处理；可靠衔接；两处幂等。坑：失败重试、死信、告警和补偿。证：压测与故障演练，延迟和成本。", "model": "练习示范（基于范文改写，含教学补充，不是本人已验证经历）：申报截止前，短信网关响应变慢，使与其串行执行的提交接口长期等待，用户重复提交又加重了压力。对于超时后跳过和移出主流程两种方案，我选择后者，因为监管记录不允许缺失，单纯跳过不能满足业务约束。提交接口保留校验、办件写入和状态更新，短信、监管同步与统计加工交由 Kafka 后台处理。为覆盖业务提交与消息发送之间的故障窗口，可在同一事务中保存办件与本地消息记录，由投递任务确认发送并支持重试；提交端以申请流水号防止重复受理，消费端以事件标识防止重复执行。对于消费者故障，设置有限重试、积压告警和死信处理，并明确核对、补偿责任人。容量设计依据压测确定限流阈值，结合服务与消费者能力扩容，避免积压持续增长。验证中应同时检查提交延迟、成功率、最老消息等待时间，以及故障恢复后有无漏处理和重复处理。该方案缩短了主流程等待，但通知存在延迟，补偿和监控也增加了运维成本；具体效果须以实际压测与运行记录为准。"}, "rubric": [{"title": "业务因果与选型", "text": "写出短信慢如何导致阻塞与重复提交；比较两个方案，并用“不丢监管数据”解释选择。"}, {"title": "职责与可靠衔接", "text": "明确主流程保留什么、异步做什么；不把 Kafka 等同不丢失，交代业务提交与发消息的故障窗口。"}, {"title": "防重与异常闭环", "text": "提交和消费各有幂等依据；重试失败进入死信，并有告警、责任人和补偿路径。"}, {"title": "容量与验证", "text": "有压测定阈值、限流/扩容边界；效果有指标口径与证据，不编造数据，承认通知延迟。"}, {"title": "表达与真实性", "text": "六拍自然连贯，体现本人决策而非组件清单；练习项目/数字明确标注，真实项目事实不混写。"}]}, {"day": 2, "title": "可靠性：先识别，再容错，快恢复", "subtitle": "把 FMEA、恢复块和健康检查串成一条因果链", "date": "10/16", "minutes": 60, "goal": "能区分可靠性与可用性，讲清恢复块的接受测试与回退边界，并独立写出一个有取舍、有异常处理的可靠性实践段。", "reading": [{"title": "01｜把质量目标翻译成故障场景", "text": "材料说明：以下项目、规模、数字和效果均为用户提供原文中的项目示例或教学设定，只用于写作训练，不代表你的实际经历，也不是你的测评分数。正式写作须换成可解释、可核实的个人项目事实。\n\n原文项目把“办件不丢、不重、流程不断”作为质量目标。写作时要进一步说明：外部证照接口超时，会阻塞提交；消息重复投递，可能造成重复受理；服务进程还在但无法处理请求，会形成假死。三个风险分别指向外部依赖、业务正确性和服务恢复，不能用“多部署几个实例”一笔带过。背景段只交代与这些风险相关的业务、规模和职责，随后按“设计阶段识别失效→运行时容忍失效→故障后恢复”的顺序展开。\n\n可靠性强调在规定条件与时间内正确完成规定功能，可用性强调需要服务时能够使用。MTBF 与 MTTR 可以帮助描述故障频度与修复速度；在简化的稳态可修复系统模型中，可用性约为 MTBF／（MTBF＋MTTR），不能把公式当作任何系统的完整 SLA 统计口径。原文的约 170 小时与约 5 分钟换成同一单位后，可得到约 99.95% 的示例可用性；正式论文还应交代统计窗口、故障范围和数据来源。教学补充：平均无故障时间不能证明“永不失败”，恢复快也不等于故障发生少。", "source": "用户原文（可靠性） 第 1—5、9 段；公式适用边界为教学补充"}, {"title": "02｜FMEA：从风险表走到设计决定", "text": "原文在概要设计评审阶段，将提交链路拆成网关、事项、办件中心、消息队列、部门适配和证照核验，逐项讨论可能怎样失效、影响谁、是否容易被发现。以“消息重复投递”为例，失效效应是同一申请被重复受理，现有检测可能只能靠事后核对；采取业务唯一键与消费端幂等控制后，还要用重复投递测试验证控制是否生效。这样写，FMEA 才与实现连接起来。\n\n常用风险优先数 RPN＝严重度 S×发生度 O×可探测度 D。教学补充：采用“越难发现，D 越高”的评分约定时，应把约定写清，避免把容易发现的风险排得更高。RPN 是排序辅助，不是机械裁决；严重后果的风险即便总分较低，也可能需要优先处理。原文示例中，团队发现不同人对发生度评分差异很大，于是用历史故障记录和跨角色评议校准。好段落要写出“失效模式—效应—评估依据—控制措施—责任与复核”，不能只写“识别了若干风险”。", "source": "用户原文（可靠性） 第 6 段；评分约定与严重度例外为教学补充"}, {"title": "03｜恢复块：接受测试是业务闸门", "text": "原文的主版本调用省级电子证照接口，接口超时后，备选版本使用最近同步的本地数据。两个版本都要经过接受测试，核验证照有效期及持证人与申请人是否一致；备选路径通过后仍标记待复核，外部接口恢复后补核。写法顺序应是“为什么主路径会失败→备选路径有何不同→用什么条件判定可接受→如何回到可控状态”。\n\n教学补充：经典恢复块包含入口状态保存、主版本、接受测试及备选版本；测试失败时应恢复到约定状态，再尝试备选版本。把“超时后换接口”称为恢复块式容错时，必须交代对已产生副作用的处理。只读核验容易隔离；若已发消息或写入数据，需避免重复执行，并通过事务、幂等或补偿维持一致性，不能声称所有外部操作都能回滚。接受测试验证的是业务可接受性，不只是 HTTP 200。\n\n原文还暴露了本地数据约一天的同步延迟。这是备选路径的风险，而非容错成功的证明。必须先确认业务是否允许使用该时效的数据；过期、无命中或不满足政策边界时，应挂起、拒绝自动放行或转人工。待复核标记并不授权先违反规则再补核。恢复块通常顺序尝试备选版本，N 版本程序设计通常强调独立开发的多个版本及结果表决，两者不能混写。", "source": "用户原文（可靠性） 第 5、7 段；状态恢复、副作用与合规安全边界为教学补充"}, {"title": "04｜健康检查：发现故障，别制造故障", "text": "原文实例曾出现进程存活但请求全部超时，说明“进程在”不足以说明“服务可用”。就绪探针决定实例是否接收流量，存活探针用于判断实例是否需要重启；启动探针可给慢启动应用足够初始化时间。可观测性还要看错误率、延迟、队列积压与资源状态，不能把一个探针接口当作全部监控。\n\n原文用轻量数据库查询和消息发送检查业务依赖，并记录了超时过短引发多个实例同时摘除的问题。教学补充：生产探针应低成本、无破坏性，优先使用只读或隔离的专用检测路径；不要让每次探针都发送真实业务消息。共享数据库短暂变慢时，若所有实例同时被摘除或重启，反而会放大故障。应按依赖重要性设计就绪条件，设置合理超时、连续失败阈值和恢复窗口，限制变更节奏，并通过故障注入验证。外部依赖异常通常不应直接触发所有实例重启。\n\n把“摘除故障实例”“重启不可恢复实例”“对未完成业务做幂等补偿”分开叙述。效果段分别检查用户可用性、恢复时间与业务是否丢失或重复；不要只用进程重新启动证明办件恢复正确。", "source": "用户原文（可靠性） 第 8—9 段；探针副作用、启动探针与级联故障防护为教学补充"}], "flow": [{"title": "质量目标", "text": "规定条件、规定时间、正确功能；把“不丢不重”变成具体失败场景。"}, {"title": "识别失效", "text": "FMEA 列出模式、效应、严重度与控制措施。"}, {"title": "容忍失效", "text": "主路径＋备选路径＋接受测试；状态和副作用受控。"}, {"title": "快速恢复", "text": "就绪摘流、存活重启、业务补偿各司其职。"}, {"title": "验证边界", "text": "故障注入与统计口径证明效果，再写残余风险。"}], "cards": [{"q": "可靠性和可用性怎么区别？", "a": "可靠性关心规定期间正确完成任务；可用性关心需要时能否提供服务。故障少与恢复快相关，但不是同一件事。"}, {"q": "FMEA 写作要保留哪条链？", "a": "失效模式→业务效应→评估依据→控制措施→责任与复核。记住链条，不必背示例数量。"}, {"q": "接受测试测试什么？", "a": "版本输出是否满足可接受的业务条件。返回成功码不足够，还要检查有效期、主体一致性等。"}, {"q": "主版本失败后，直接执行备选版本够吗？", "a": "不够。经典恢复块先恢复约定状态；已有外部副作用必须用幂等、事务或补偿处理。"}, {"q": "本地数据核验通过是否一定能放行？", "a": "不能。还要满足数据时效、授权和业务规则；边界不满足时挂起或转人工。"}, {"q": "就绪与存活探针分别干什么？", "a": "就绪决定是否接流量，存活决定是否重启。共享依赖慢不等于进程应被重启。"}, {"q": "RPN 最高的必须永远先处理吗？", "a": "不是。评分需校准，严重后果和强制约束不能被乘积排序掩盖。"}, {"q": "效果段需要哪三种证据？", "a": "检测及恢复时间、服务可用性、业务正确性，并说明观察窗口与测量口径。"}], "steps": [{"minutes": 8, "title": "搭骨架", "text": "读质量目标，闭卷说出“识别、容错、恢复”三段。"}, {"minutes": 17, "title": "细读三项实践", "text": "对 FMEA、恢复块、探针各圈出一个决定、一个风险和一个修正。"}, {"minutes": 7, "title": "概念自检", "text": "先答五题再看解释，关键题答错回读对应段。"}, {"minutes": 20, "title": "独立写段", "text": "完成一个 350—500 字恢复块实践段。时间有余再写探针检测短答，选做不算必交内容。"}, {"minutes": 8, "title": "人工复核", "text": "按五项检查表修改；口述一次探针误判如何扩大故障。"}], "quiz": [{"q": "恢复块主版本返回 HTTP 200，但结果中的证照已过期，应该怎样处理？", "options": ["认为调用成功，直接放行", "接受测试判失败，恢复到约定状态，再尝试允许的备选路径", "只记录日志，用户可以继续", "关闭接受测试，减少延迟"], "correct": 1, "explanation": "接受测试面向业务正确性。传输成功不能代替证照有效、身份一致等业务条件。", "critical": true}, {"q": "共享数据库短暂变慢时，所有实例反复重启。最优先检查哪项设计？", "options": ["是否还可以增加重启频率", "是否把外部依赖异常错误地当作存活失败，并设置了过激阈值", "是否删除全部告警", "是否让探针执行更长的交易"], "correct": 1, "explanation": "共享依赖异常可能触发级联摘流或重启。应区分就绪与存活，采用低成本检测并校准阈值。", "critical": true}, {"q": "按“越难发现，D 越高”的约定开展 FMEA，下列说法正确的是？", "options": ["高严重度风险只要 RPN 不高，就无需关注", "评分无需历史数据或跨角色校准", "RPN 辅助排序，仍需单独关注严重后果与控制措施", "FMEA 只能在上线后进行"], "correct": 2, "explanation": "FMEA 应前置设计阶段；RPN 不替代对严重后果、证据质量和责任落实的判断。", "critical": false}, {"q": "为什么本地证照库可以作为备选路径，却不能默认允许所有申报通过？", "options": ["本地数据始终比外部数据可靠", "标记待复核就可以忽略政策限制", "容错的目的就是绕过所有校验", "缓存可能过期或缺失，仍须满足时效和业务授权边界"], "correct": 3, "explanation": "容错要保住规定功能的正确性。备选路径仍有边界，不确定时应挂起或转人工。", "critical": true}, {"q": "以下哪个结论能由“MTTR 下降”单独支持？", "options": ["故障发生频率必然下降", "软件不会再出错", "在相同统计口径下，平均修复速度提高", "任何场景都可达到 100% 可用性"], "correct": 2, "explanation": "MTTR 表示平均修复时间；不能单独推出 MTBF、业务无错误或绝对可用性。", "critical": false}], "writing": {"title": "写一个恢复块实践段", "prompt": "按训练项目设定：外部证照核验偶发超时，本地副本可能延迟；核验不通过不能放行。写 350—500 字恢复块实践段，交代问题、两个方案的取舍、接受测试、状态及副作用边界、一次落地问题与验证办法。所有示例数据注明训练设定，不要虚构个人业绩。\n\n选做（时间有余再写）：用 80—120 字说明如何发现“进程活着但请求失败”，以及如何避免探针引发级联重启。未写选做不影响本日自检完成。", "minutes": 20, "target": "主任务 350—500 字；80—120 字探针短答为选做，不计完成条件", "hint": "先写“为什么选”，再写“怎样做”，最后写“何时不能做”。关键句：接受测试检查……；当……不满足时，停止自动放行。", "model": "示例练习稿（基于原文项目，非个人经历）：\n在训练项目的办件链路中，证照接口超时会阻塞申报，而直接跳过核验会破坏业务规则。我比较了 N 版本程序设计与恢复块式容错：外部权威数据源只有一个，难以构造真正独立的多个核验版本，因此采用主路径实时核验、备选路径使用已同步数据的方案。核验阶段与最终受理分离，先保存申请状态，避免失败重试造成重复受理。主路径超时或输出不合格时，恢复约定状态，再进入备选路径；两条路径都执行相同的接受测试，检查证照有效期、主体一致性及数据时效。返回成功码并不意味着业务检查通过。\n备选结果只有在业务明确允许的时效范围内才可使用，并保留来源和待复核状态。外部服务恢复后，以申请唯一标识执行幂等补核；若数据缺失、过期或不符合政策边界，则挂起申请并提示补充材料或转人工，不能先违规放行再补救。原文示例暴露过本地数据更新延迟，说明备用能力也可能失效。训练方案因此增加数据新鲜度检查与按需更新，并通过外部超时、过期证照和重复回调等用例验证提交是否正确。验证时分别统计核心流程中断、补核积压和重复受理，而不把“有结果返回”当作容错成功。\n健康检查补充：就绪检查采用无业务副作用的轻量路径，失败达到阈值后停止向实例分流；存活检查只在实例自身异常且难以恢复时触发重启。共享数据库短暂变慢不能导致全部实例同时重启，并结合错误率和延迟确认故障。"}, "rubric": [{"title": "概念准确", "text": "可靠性与可用性分开；接受测试不是接口成功码。"}, {"title": "选择有依据", "text": "明确外部依赖和独立版本限制，说明为何选择恢复块式容错。"}, {"title": "边界完整", "text": "有状态恢复、幂等或补偿，并说明过期数据不能自动放行。"}, {"title": "实践有波折", "text": "写出数据延迟或探针误判，再给出修正及验证。"}, {"title": "证据可解释", "text": "指标说明口径；示例数据明确标注；本表仅供人工自评，不自动评定论文成绩。"}]}, {"day": 3, "title": "ATAM × 数据中台：两种论证方式", "subtitle": "上午想清场景，随后写清数据如何变成可复用服务", "date": "10/17", "minutes": 150, "goal": "写出一个可度量质量场景，准确区分敏感点与权衡点；再用“汇聚、治理、服务”完成数据中台论证。今天在同一编辑区完成两段独立输出。", "reading": [{"title": "01｜ATAM：先把“要快、要稳”变成场景", "text": "材料说明：以下项目、规模、数字和效果均为用户提供原文中的项目示例或教学设定，只用于写作训练，不代表你的实际经历，也不是你的测评分数。正式写作须换成可解释、可核实的个人项目事实。\n\n原文平台一期上线后，业务方要求增功能，运维方关注稳定性，安全方强调保护数据；这不是靠组件清单就能解决的争议。ATAM 用质量属性场景分析架构方法及其取舍。可先介绍商业动机和现有架构，再生成效用树、分析关键场景，邀请更广泛的利益相关者补充与排序，最后报告风险、非风险、敏感点和权衡点。记住“商业目标→场景→架构方法→证据→改进”，无需把阶段名称写成孤立目录。\n\n质量属性场景可按刺激源、刺激、环境、制品、响应、响应度量六要素描述。训练示例：“申报高峰期，市民向提交服务发送有效申请，系统完成校验并返回受理结果，在约定流量模型下 P99 不超过 1 秒，错误率不超过 0.1%。”这里的数字是训练阈值，必须与负载、统计窗口一起说明。“系统很快”不能验收；“用 Redis 保证很快”则把方案提前混进了需求。效用树按质量属性、细化关注点和场景组织，结合重要性与实现难度排序。H/H 表示重要且难，不等于已经证明风险最大。", "source": "用户原文（ATAM 架构评估） 第 1—6 段；场景负载与 H/H 解读为教学补充"}, {"title": "02｜敏感点、权衡点、风险点，不要靠名称猜", "text": "敏感点是某个架构决策或参数的变化，会显著影响某项质量属性。例如，某线程池大小变化显著影响高负载下的请求排队延迟，便需要分析其性能敏感性。权衡点是影响多个质量属性、存在取舍的架构决策，例如办件缓存 TTL 延长可能降低数据库负载、改善性能，同时扩大读取旧状态的时间窗口。教学补充：权衡点通常也是敏感点，但不能因为一个参数“影响了两个指标”就直接判为权衡点，还要说明不同质量目标如何相互制约。原文把限流阈值写作敏感点，可以沿一个质量属性分析；若进一步论证可接受吞吐与过载保护之间的取舍，则应明确讨论其权衡性质。\n\n风险点是有证据表明架构决定可能妨碍质量目标达成，例如各业务服务自行调用部门接口，超时和隔离不统一，慢接口可能耗尽线程池。非风险点是在既定场景与假设下已被证据支持的可接受决定，不能简单把“部署了 Kubernetes”当作非风险。原文用运行监控中的线程池占满现象推动团队达成一致，再增加适配层、独立超时与熔断，并通过故障演练复验。评估报告最好同时列出场景、发现、证据、责任人、优先级与验证结果。CBAM 可补充成本收益取舍，但不要把粗略排序包装成精确收益证明。", "source": "用户原文（ATAM 架构评估） 第 7—9 段；敏感点与权衡点边界为教学补充"}, {"title": "03｜数据中台：汇聚必须带着契约", "text": "原文项目的困境是同一企业在不同部门名称和地址口径不同，已有材料仍被重复采集，共享依赖点对点接口，授权和使用去向也难追踪。数据中台的论证应从业务复用切入：先汇聚并统一标准，再治理形成可信的数据资产，最后通过受控服务供业务使用。只说“把数据放入 Doris”还没有完成中台建设。\n\n接入方式按源系统能力选择：平台自有业务库用 CDC 采集变更，具有接口的部门定时拉取，暂时不能改造的旧系统通过文件交换。进入贴源层保留来源与原始记录，便于回溯；统一数据元名称、类型、代码和语义，避免同名异义。原文示例中，源系统升级改变字段和日期格式，连续导致入库失败；随后建立接入契约，约定模式、格式、更新频率、责任人和变更通知，在入库前校验，不合格数据隔离并告警。教学补充：CDC 也会有延迟、重复或断点恢复问题，不能把“用了 CDC”写成绝对实时且不丢数据；应验证断点、顺序和重复处理。", "source": "用户原文（数据中台） 第 1—6 段；接入契约细化及 CDC 边界为教学补充"}, {"title": "04｜治理：分层、主数据、质量闭环", "text": "原文采用贴源层、明细层、汇总层和应用层：贴源层保留原貌，明细层清洗与标准化，汇总层按主题汇总，应用层面向具体数据服务。层次名称可因项目而异，重要的是职责和加工关系清楚。主数据管理则解决“同一对象是谁、哪个字段信谁”。例如企业使用统一社会信用代码作为主标识，企业名称采用权威来源；更名历史保留别名，没有标识的记录先匹配再人工确认，不能仅凭相似名称自动合并。\n\n质量规则应能落到检查与整改：完整性检查关键字段是否为空，一致性检查代码和跨源口径，及时性检查更新是否超出约定时间；发现问题后形成工单、反馈来源部门、复核修复并防止复发。原文“重复率约 18% 降到 1% 以下”属于项目示例，引用时要明确重复定义、样本范围与时间。教学补充：治理不仅发生在仓库里，还包括源端责任、数据目录、血缘、权限和生命周期。数据仓库通常强调主题整合与分析，数据湖强调灵活保存多种数据，中台强调可治理、可复用的服务能力；三者可以组合，并非互相替代，也不能断言仓库从不包含治理或服务能力。", "source": "用户原文（数据中台） 第 4、7、9 段；治理职责与产品边界为教学补充"}, {"title": "05｜服务：把“能查到”升级为“有权、可控、可追溯”", "text": "原文没有把数据库账户直接分发给部门，而是设计核验、查询和订阅三类服务。核验类只返回“是否匹配”，在能满足业务时避免返回原始资料；查询类按授权给出指定字段；订阅类通过变更事件通知业务方。调用经过申请、审批、授权、调用和审计，权限细化到字段，并记录调用主体、用途与访问范围。敏感数据的保护还应覆盖访问控制、传输与存储加密、日志最小化，不能认为“脱敏一次”就解决所有问题。\n\n原文上线后遇到批量任务工作时间高频调用，拖慢其他服务；团队增加调用方配额和限流，批量任务改在低峰执行，并缓存高频公共信息。论文可用“某办件受理通过核验服务免交已有材料”说明业务价值，再用服务调用、质量改善和材料减少等口径补充效果。不要把接入表数当作唯一成功指标。结尾也应保留局限：旧系统按天交换造成时效不足，整改依赖源部门配合，服务价值尚需持续度量。这样才能形成“业务问题—数据链路—治理责任—复用效果”的完整论证。", "source": "用户原文（数据中台） 第 8—9 段；安全与价值口径为教学补充"}], "flow": [{"title": "共用项目锚点", "text": "同一平台只保留可信背景，主题不同则问题与职责不同。"}, {"title": "ATAM 场景化", "text": "六要素写需求，效用树按重要性与难度排序。"}, {"title": "ATAM 有证据", "text": "沿场景检查架构决定，识别敏感、权衡与风险，再复验。"}, {"title": "中台贯穿链路", "text": "源数据→接入契约→分层治理→受控服务→业务复用。"}, {"title": "两段独立输出", "text": "先写 ATAM，换题写数据中台；不把两个主题糊成一篇。"}], "cards": [{"q": "ATAM 最短论证链？", "a": "商业动机→可度量场景→架构方法→风险与取舍→改进及复验。"}, {"q": "质量属性场景的六要素？", "a": "刺激源、刺激、环境、制品、响应、响应度量。逐一回答谁、做什么、何时、作用于什么、系统怎样、做到多少。"}, {"q": "敏感点与权衡点怎样区分？", "a": "敏感点强调决定变化对质量属性的显著影响；权衡点还需指出多个质量目标间的取舍。"}, {"q": "风险点和非风险点凭什么成立？", "a": "凭约定场景、假设与分析或验证证据，不凭技术名称。"}, {"q": "中台与仓库最重要的区分？", "a": "中台强调跨业务可治理、可复用的数据服务能力；仓库常作为整合分析的基础，二者可组合。"}, {"q": "接入契约至少管什么？", "a": "字段语义、类型与格式、更新频率、变更通知、质量要求和责任；不合格数据隔离处理。"}, {"q": "主数据管理解决什么？", "a": "对象唯一标识、权威来源、别名历史与冲突合并规则；不确定匹配需人工确认。"}, {"q": "为什么核验 API 常优于直接导出全量数据？", "a": "只返回业务所需结果，减少暴露，并能统一授权、限流与审计。"}], "steps": [{"minutes": 25, "title": "学习 ATAM", "text": "读前两节，自己补齐一个六要素场景；口头区分三类点。"}, {"minutes": 30, "title": "学习数据中台", "text": "读后三节，画出从源系统到业务 API 的加工链，为每段写一条风险。"}, {"minutes": 10, "title": "概念自检", "text": "完成五题，回读关键错题；不用术语数量替代准确性。"}, {"minutes": 35, "title": "输出 A：ATAM", "text": "以“【A：ATAM】”开头，写 350—500 字，剩余时间回查场景与三类点是否正确。"}, {"minutes": 35, "title": "输出 B：数据中台", "text": "以“【B：数据中台】”开头，写 350—500 字，剩余时间补全主数据和质量整改闭环。"}, {"minutes": 15, "title": "双题人工复核", "text": "分别检查场景证据和数据闭环，把模板化空话改成决定与验证。"}], "quiz": [{"q": "下列哪项最清楚地描述了一个权衡点？", "options": ["数据库名称是 MySQL", "缓存 TTL 变长降低回源压力，但增加读取旧状态的时间窗口", "系统使用四个实例", "团队召开了一次评审会"], "correct": 1, "explanation": "这里明确了性能与数据新鲜度之间的取舍。仅提参数或产品名称不足以证明权衡。", "critical": true}, {"q": "“新增部门事项接入时，开发工作量不超过 5 人日”最直接属于哪类场景？", "options": ["可修改性", "可用性", "保密性", "界面美观性"], "correct": 0, "explanation": "它量化了完成变化所需工作量，属于可修改性。项目还应交代接入范围和计算工作量的口径。", "critical": false}, {"q": "关于数据中台与数据仓库，哪项最准确？", "options": ["只要采购分析数据库，中台就已建成", "仓库从来不需要数据治理", "中台强调治理与业务复用能力，仓库可作为其基础，二者可以组合", "建中台后无需数据标准和责任人"], "correct": 2, "explanation": "中台不能缩减为存储产品；其关键还包括标准、质量、主数据及受控服务。", "critical": true}, {"q": "源系统悄悄改变日期格式后，持续出现脏数据。最完整的修正是？", "options": ["让每个调用方各自猜格式", "关闭校验，使数据先入库", "只增加磁盘容量", "明确接入契约，校验并隔离异常，通知源端修正后复核"], "correct": 3, "explanation": "要同时控制入口质量和形成源端整改闭环。静默猜测或跳过校验会把错误传给下游。", "critical": false}, {"q": "ATAM 评估中，哪项足以支持把某决定记录为特定场景下的非风险？", "options": ["架构用了流行框架", "关键人员觉得没有问题", "多副本方案已在约定故障场景下验证达到响应度量，并记录适用假设", "项目还没收到投诉"], "correct": 2, "explanation": "非风险结论必须受场景、证据与假设约束，不能因为采用常见技术就自动成立。", "critical": true}], "writing": {"title": "同一编辑区，完成两题输出", "prompt": "【A：ATAM，350—500 字】二期规划中功能、稳定性与安全诉求冲突。用一个可度量的场景引出一个敏感点、一个有明确取舍的权衡点、一个风险点，并写明改进后怎样验证。重点是准确区分三类点，不必把所有 ATAM 步骤展开成长文。\n\n【B：数据中台，350—500 字】多部门对同一企业记录不同名称、部分记录缺主标识，更新字段时也未通知。聚焦数据治理：写出统一标识与权威来源、接入契约和质量检查、异常隔离与源部门整改复核，以及治理结果如何支撑受控 API。\n\n两段分别标“A”“B”，均使用训练项目，不把示例成绩写成个人事实。更多背景只作理解和延伸，今天不要求两篇完整论文。", "minutes": 70, "target": "A、B 各 350—500 字；聚焦两个薄弱点，不拼成两篇全文", "hint": "A 先画“场景→决定→证据”，B 先画“源→治理→服务→复用”。写完 A 后另起明确标题再写 B。", "model": "示例练习稿（结构参考，项目内容来自训练材料）：\n【A：ATAM】\n平台一期完成后，业务方希望扩展事项，运维方要求优先稳定系统，安全方则指出权限校验不统一。为使改进顺序有共同依据，我在训练项目中采用 ATAM，先介绍商业目标和架构，再组织各方提出质量属性场景。可用性场景设定为：申报高峰期间，某部门接口持续无响应，相关适配服务应在规定超时内隔离该依赖，与其无关的事项仍可办理。具体成功率、负载与观察窗口在评审中约定，随后作为故障演练验收依据。\n效用树将可用性、性能、安全性和可修改性逐层细化，各方结合重要性与实现难度排序。我没有仅凭服务数量判断风险，而是沿场景追踪调用链。线程池容量对排队延迟的影响构成待验证的性能敏感点；办件状态缓存的 TTL 延长可以减少回源，但会扩大旧状态窗口，构成性能与新鲜度之间的权衡；部门调用缺乏隔离，则存在耗尽共享线程池的风险。不同概念分别描述影响、取舍和潜在目标失效，不能互相替代。\n针对隔离风险，训练方案引入部门适配层，集中处理协议转换、超时、熔断与降级。统一管理不意味着所有部门使用同一超时时间：原文各部门响应特征不同，单一阈值容易误判，因此按依赖特征配置并持续观测。评估后以持续超时和局部故障注入验证隔离是否生效，检查无关事项成功率和延迟，并记录场景假设。改造成本高的数据库拆分分批推进，权限缺陷优先修复。评估成果由此成为可跟踪的改进任务，而不是只列风险名称的会议记录。每个发现还应标注责任人、依赖条件和下一次验证时间，并把关键场景沉淀为压测或故障演练用例。若没有足够证据确认某项决定可接受，就记录待验证假设，避免为了让报告完整而直接写成非风险。后续架构变更时复用这些场景，才能观察原先的结论是否仍然成立。\n\n【B：数据中台】\n训练项目虽然统一了办事入口，但各部门的数据口径、标识和共享方式仍不一致，群众仍要重复提交已经存在的材料。中台建设因此围绕业务复用展开，而不是先建设一个大型存储库。数据从自有业务库 CDC、部门接口和旧系统文件三种路径汇入贴源层，保留来源与采集时间，并统一字段语义和代码。源系统曾修改日期格式而未通知，导致入库失败；我据此把字段、格式、更新频率及变更通知写入接入契约，入口校验失败的数据隔离并交由来源部门确认。\n在治理侧，明细层清洗与标准化，汇总层按企业和办件等主题组织，应用层面向具体服务。企业主数据以统一社会信用代码识别对象，名称使用权威来源，历史更名保留别名；缺少标识且匹配不确定的记录转人工确认，避免误合并。质量检查覆盖关键字段完整性、跨源一致性与更新及时性，问题生成工单，修正后复核，而非仅生成一份无人负责的质量报表。\n在服务侧，业务先申请用途和字段，再按授权调用核验、查询或变更订阅接口。能够只返回匹配结果时，不返回整条个人或企业记录；配合字段权限、脱敏、限流与审计控制使用范围。原文中批量任务在工作时间抢占资源，训练方案为调用方设置配额，将批量任务调到低峰，并缓存适宜的高频信息。效果不只看接入了多少张表，还要验证办件是否减少材料提交、重复数据是否减少、服务是否持续被使用。旧系统按天同步仍限制数据时效，因此保留来源时间并在业务侧说明可用边界。评价质量改善时应固定对象和统计口径，例如同一范围内的企业重复记录占比、关键字段缺失率及超过约定更新周期的记录比例。调用量可以说明使用情况，却不能单独证明业务价值；还应观察服务是否减少重复采集、是否带来不必要的数据暴露，以及来源部门的整改工单是否真正关闭。"}, "rubric": [{"title": "A：场景完整", "text": "六要素可辨认，响应度量带负载或故障前提，而非“更快更稳”。"}, {"title": "A：三类点准确", "text": "敏感点写显著影响，权衡点写目标取舍，风险点写目标可能失效与证据。"}, {"title": "B：链路完整", "text": "汇聚、治理、服务都有动作及产物，不能停留在数据库选型。"}, {"title": "B：治理可闭环", "text": "有权威来源、质量规则、责任与复核；有最小权限和审计。"}, {"title": "双题可复述", "text": "两段各有问题、选择、实施、波折与验证；所有数字来源明确，按此表人工修改。"}]}, {"day": 4, "title": "AIGC 融合 × 一篇完整限时模拟", "subtitle": "先学新主题，再在高并发或可靠性中只选一题写完", "date": "10/18", "minutes": 180, "goal": "讲清 AIGC 接入、安全与有限 GPU 资源的治理；随后独立完成一篇完整论文。默认练高并发，也可改选可靠性，今天不写两篇。", "reading": [{"title": "01｜AIGC 接入：让模型进入受控链路", "text": "材料说明：以下项目、规模、数字和效果均为用户提供原文中的项目示例或教学设定，只用于写作训练，不代表你的实际经历，也不是你的测评分数。正式写作须换成可解释、可核实的个人项目事实。\n\n原文项目的智能导办要把群众口语转换为事项建议，但原有微服务不能直接承受模型的不确定性与高推理成本。接入层可采用“业务服务→模型网关→知识检索与模型服务”的结构，网关统一鉴权、配额、超时、路由与审计，业务服务保留传统搜索和人工路径。选择私有化部署，是原文项目的数据边界决定，不代表所有业务都必须私有化；也不能因为模型在内网就省略授权和安全设计。\n\nRAG 先从可信指南检索相关内容，再让模型依据内容组织回答，并提供可追溯出处。原文固定长度切块曾把材料清单截断，改为按章节结构切分，结合事项指南变更事件增量更新索引。这说明检索质量取决于文档质量、切分、召回、权限及版本，不是“加上向量库”就完成。教学补充：必须在检索阶段执行访问权限，防止用户通过问答看到其无权读取的资料；检索命中不等于答案正确，相关片段也可能过期、遗漏或被模型误解。", "source": "用户原文（AIGC 融合架构） 第 1—6 段；检索权限及 RAG 边界为教学补充"}, {"title": "02｜安全：RAG 降低风险，不能保证真实", "text": "原文把防护分为输入、生成、输出：输入识别并替换个人信息，检测注入特征；生成尽量限定在检索到的指南范围，无可靠命中时停止生成；输出对办理时限与收费等关键字段直接引用权威业务库，并做相关性和合规检查。论文应写出“不确定时怎么办”，例如转常规搜索或人工，而非宣称用一句提示词彻底消除幻觉。\n\n教学补充：提示词分隔、关键字规则和有限样例测试只能降低风险，不能证明注入被彻底解决。检索到的网页或文档也可能包含恶意指令，应作为数据处理，不允许其越权修改系统规则。模型不得绕过业务系统的权限和审批，涉及写入或办理动作时仍需确定性校验。审计要记录足够的事件、版本与引用以支持复盘，但避免无差别保存完整敏感输入；保存周期、脱敏与访问范围需依据实际制度确定，原文中的保存天数只是项目示例。\n\n验证时分别评估检索覆盖、回答事实依据、拒答与转人工是否合适、越权与注入场景表现。某次测试集全部通过只能说明这组用例通过，不能写成未来绝对安全。", "source": "用户原文（AIGC 融合架构） 第 7、9 段；评测、日志最小化与安全边界为教学补充"}, {"title": "03｜资源：扩 Pod 不会凭空增加 GPU", "text": "原文的训练案例只有 4 张 GPU，咨询量在申报期间约增至平时的 5 倍。采购无法及时解决，因此先采用连续批处理提高计算利用率，再以并发上限与有界队列保护推理服务，排队超时降级为传统搜索。流式输出使用户更早看到首个片段，主要改善首字体验，不保证整段生成更快，也不等于系统吞吐必然提高。\n\n扩缩容可以参考队列长度、等待时间及 GPU 利用率，但必须受可分配 GPU、显存、模型加载时间和调度能力约束。在总 GPU 已用满时，增加副本可能排队等待资源或争用资源，不能声称“自动扩容解决无限请求”。在线服务优先，离线文档任务在低峰调度，并设置取消、最大输出长度、请求超时和租户配额。教学补充：响应时间至少区分排队等待、首字时间和总时延；除平均值外，观察尾延迟、降级率和单位请求资源成本。\n\n原文的首字响应、利用率和转人工比例只作为项目示例。效果段要同时承认代价：为了保护核心办理链路，一部分导办请求会降级，用户仍需得到可操作的搜索入口或人工指引。", "source": "用户原文（AIGC 融合架构） 第 8—9 段；固定 GPU 上限与性能指标细化为教学补充"}, {"title": "04｜高并发模拟素材：定位、缓存、异步闭环", "text": "原文高并发案例中，查询 P99 约 8 秒，查询服务副本从 6 个扩至 12 个却未改善，数据库压力反而增加。这些都是原文项目示例。通过链路追踪分解网关、服务、数据库和外部调用耗时，团队找到 N+1 查询、同步认证依赖和主库报表三项瓶颈，再采用批量查询及索引、依赖隔离、报表迁移等措施。论证重点是证据推翻“先扩容”的直觉，再在相近流量下复测，而不是堆积监控工具名。\n\n重复刷新仍给数据库施压，因此稳定字典放本地缓存，办件状态放 Redis，结合状态变化后失效与 TTL 控制陈旧窗口。集中失效用过期抖动缓解，单热点回源用互斥或请求合并防止击穿；不能把这些都笼统称为“解决一致性”。状态查询可允许的陈旧时间须由业务决定，敏感写操作仍以权威状态校验。\n\n写入链路把短信、监管同步等从核心提交移到异步消费者，核心受理仍需可靠落库。教学补充：数据库提交与消息发布之间存在失效窗口，可通过本地消息表／事务发件箱及重试核对保证事件最终送达；不能仅凭“用了 Kafka”宣称不丢消息。消费幂等、有限重试、失败队列、积压监控与补偿责任形成闭环。幂等键应标识同一次业务意图，不能仅按“申请人＋事项”永久拒绝其合法再次申请。", "source": "用户原文（高并发） 第 4—9 段；可靠发布与幂等键边界为教学补充"}, {"title": "05｜完整论文：每段回答一个问题", "text": "完整模拟建议采用“摘要—背景与职责—主题理论—三个实践段—总结”的结构。摘要压缩交代项目、问题、方案和效果，不写成行业口号。背景只留能解释技术决策的业务事实；职责写本人确实做过的设计、协调和验证工作。理论部分短而准确，让读者知道下文为何按三个方面展开。\n\n实践段可沿“具体问题→候选方案→选择理由→实施步骤→新问题及修正→验证与边界”推进，不要求机械出现六个小标题。高并发可写瓶颈定位、缓存、异步及容量保障；可靠性可写 FMEA、恢复块式容错、检测与恢复。总结既回扣主题，也保留尚未解决的问题及下一步。不要把所有范文的亮点一股脑塞入同一论文，导致角色、时间或架构前后矛盾。\n\n本次训练设 10 分钟审题列纲、100 分钟正文写作、10 分钟回读，共 120 分钟；它是本课程的模拟安排，不是对具体考试时长或评分规则的声明。字数目标约 2200—2800 字用于练习，正式答卷以实际题干要求为准。参考稿只用于写完后对照结构，不能把示例指标冒充个人项目业绩。", "source": "用户原文（高并发、可靠性） 的整体结构；模拟时间和字数为教学安排"}], "flow": [{"title": "接入隔离", "text": "模型网关与知识检索承接能力，核心业务保留确定性校验。"}, {"title": "安全边界", "text": "输入、检索、生成、输出逐层治理，无依据就降级或转人工。"}, {"title": "有限资源", "text": "批处理、有界排队、流式、受 GPU 约束的扩缩容。"}, {"title": "只选一题", "text": "默认高并发；可靠性作为备选。先列三段主线。"}, {"title": "完整交卷", "text": "写完摘要到总结，按人工检查表改掉概念和逻辑问题。"}], "cards": [{"q": "AIGC 融合的三条主线？", "a": "接入与知识链路、安全与权限、推理资源与降级。"}, {"q": "RAG 能保证答案真实吗？", "a": "不能。知识可能过期或检索遗漏，模型也可能误读；要有引用、权威字段校验与拒答路径。"}, {"q": "模型私有化后是否安全工作已完成？", "a": "没有。还需权限、脱敏、注入防护、日志控制和持续验证。"}, {"q": "流式输出改善什么？", "a": "主要改善首字等待与感知体验，不自动保证总生成时长或吞吐提升。"}, {"q": "GPU 已满时增加 Pod 有用吗？", "a": "不一定。副本需要可用 GPU 和显存；应先优化调度、限流、排队与降级。"}, {"q": "高并发实践的三段主线？", "a": "用证据定位瓶颈；用适合的数据缓存减少重复工作；用可靠异步、限流和容量验证保护核心链路。"}, {"q": "异步化为什么不等于绝不丢消息？", "a": "发布和业务提交可能不一致，消费者也可能失败；需可靠发布、幂等、重试、失败队列和补偿。"}, {"q": "今天写几篇完整论文？", "a": "只写一篇。默认高并发，也可用可靠性替换；AIGC 今天以学习与概念练习为主。"}], "steps": [{"minutes": 35, "title": "学习 AIGC 三段", "text": "读接入、安全和资源，分别记住两项措施及一项不能承诺的边界。"}, {"minutes": 10, "title": "概念自检", "text": "完成五题，纠正 RAG、GPU 与消息可靠性误解。"}, {"minutes": 15, "title": "整理模拟素材", "text": "复习高并发素材，或回到 Day 2 可靠性；选定一题后不换题。"}, {"minutes": 10, "title": "审题与提纲", "text": "列摘要信息、背景职责、理论、三个实践段、总结，每段写一个核心判断。"}, {"minutes": 100, "title": "限时完整写作", "text": "独立写约 2200—2800 字，不边写边抄参考稿。"}, {"minutes": 10, "title": "交卷前回读", "text": "检查题目覆盖、技术边界、数字口径和段落前后关系，保存一篇完整稿。"}], "quiz": [{"q": "加入 RAG 后，怎样描述系统能力最准确？", "options": ["检索命中就能保证回答完全真实", "能降低无依据生成的风险，仍需权限、版本、引用与拒答控制", "可以删除所有人工处理路径", "向量相似度高说明政策仍有效"], "correct": 1, "explanation": "RAG 是降低风险的一部分；检索、知识版本与生成过程都可能出错。", "critical": true}, {"q": "4 张 GPU 已满载，队列持续增长，最合理的判断是？", "options": ["无限增加 Pod 就会无限增加算力", "流式输出一定能让总算力翻倍", "扩副本受 GPU 与显存约束，应结合批处理、并发控制、有界队列和降级", "关闭限流即可提升稳定性"], "correct": 2, "explanation": "资源上限是真实约束。软件调度提高效率，但不会凭空创造 GPU 容量。", "critical": true}, {"q": "测试中的全部注入样例都被拦截，能得出什么结论？", "options": ["该测试集在该版本下通过，仍需持续评测与分层防护", "所有未来注入都已被解决", "提示词分隔可以替代权限校验", "无须保留审计和升级机制"], "correct": 0, "explanation": "有限样例通过不能证明对未知攻击绝对安全。", "critical": false}, {"q": "数据库已提交办件，但进程在发送消息前崩溃。哪项能针对这个窗口提供补救？", "options": ["把 Kafka 名称写进架构图", "仅增加消费者副本", "仅延长前端等待时间", "使用本地消息表或事务发件箱记录待发布事件，再幂等重试与核对"], "correct": 3, "explanation": "可靠异步须处理业务提交与消息发布间的一致性窗口，不能只依赖队列本身。", "critical": true}, {"q": "高并发查询慢，扩容应用后数据库 CPU 更高、P99 未改善，下一步应优先做什么？", "options": ["继续无限扩容应用", "根据链路、SQL 和资源指标定位瓶颈，再做针对性改进和同口径复测", "删掉 P99 指标只看平均值", "把所有写操作都放缓存"], "correct": 1, "explanation": "证据提示瓶颈可能在数据库或下游，盲目扩应用会放大压力。", "critical": false}], "writing": {"title": "完整模拟：高并发／可靠性二选一", "prompt": "只选一道题，在本编辑区完成一篇完整论文。默认建议选择 A，今天不同时写 A、B。\n\nA｜论高并发系统的性能优化：结合训练项目，简述项目背景与本人承担的工作；说明高并发的主要挑战；重点论述瓶颈定位、缓存设计、异步削峰与容量保障中的架构决策、实施问题及验证效果，并总结不足。\n\nB｜论软件可靠性设计技术及应用：结合训练项目，简述项目背景与本人承担的工作；说明主要可靠性设计技术及其适用条件；重点论述 FMEA、恢复块式容错和故障检测恢复的实践、业务安全边界及验证效果，并总结不足。\n\n统一要求：包含摘要、背景与职责、必要理论、三个实践段、总结；训练字数约 2200—2800 字。用“训练项目／示例”标明材料属性，不把范文数字写成个人真实业绩。10 分钟列纲，100 分钟写作，10 分钟回读。参考稿为 A 题结构示范，完成自己的稿后再展开。", "minutes": 120, "target": "一篇完整训练稿，约 2200—2800 字；正式考试以实际题干为准", "hint": "先确定三个实践段分别证明什么。每段至少写清一项选择及其代价；结尾不宣称零风险。", "model": "完整训练参考稿｜论高并发系统的性能优化\n说明：下文是基于原文改写的项目练习稿，叙述角色、场景及数字均为训练示例，不代表你的真实经历。\n\n摘要\n在某政务服务平台训练项目中，我承担总体架构设计和性能保障工作。平台将分散的事项入口整合后，集中申报流量放大了查询链路长、数据库重复访问以及提交过程依赖外部服务等问题。围绕核心办件链路，我先通过链路追踪和数据库指标定位瓶颈，再用分层缓存承接重复读取，最后将非核心操作可靠异步化，并结合限流和容量演练保护提交服务。原文示例中，查询 P99 从约 8 秒改善到 1 秒以内，集中申报期提交成功率超过 99.9%。训练复盘同时保留了缓存新鲜度、异步补偿和容量预测的不足，说明性能优化需要以证据为基础，并持续验证业务正确性。\n\n一、项目背景与职责\n该平台面向市民、企业和政务工作人员，覆盖事项查询、申报、材料流转、办件处理、数据共享与监管等功能，采用微服务架构。网关承担统一入口，业务数据存储于 MySQL，Redis 用于适宜的缓存，Kafka 承接异步事件，服务部署于 Kubernetes，链路追踪辅助定位跨服务耗时。上述组件只是实现工具，真正困难在于访问高度集中：政策开放申报后，群众反复查询进度，外部部门接口响应又不受本团队完全控制，慢请求会占用线程，重复操作进一步扩大压力。\n我在训练角色中负责与业务方量化查询和提交的性能目标，组织按真实接口比例构造负载，评审缓存及异步方案，并协调上线观察与故障处置。性能目标不仅包含响应时间，还包含错误率和业务受理结果；测试时固定负载模型、数据规模及观察窗口，避免把不同条件下的结果直接比较。\n\n二、高并发优化的基本思路\n高并发问题可从性能、稳定性和容量三个方面分析。性能关注请求耗时来自哪里，平均值正常并不说明尾部用户体验可接受；稳定性关注下游慢调用如何传播，以及过载时是否仍能保护核心业务；容量关注在给定资源和服务目标下可承受多少流量。优化不应以增加实例为起点，而应先建立基线，找到约束，再通过减少重复工作、缩短同步链路和限制过量请求实施针对性调整。每次调整还要检查是否损害数据正确性或引入新的故障方式。\n\n三、以链路证据定位瓶颈\n原文示例中，申报开放后查询 P99 升至约 8 秒。团队先把查询服务实例翻倍，但时延没有明显变化，数据库 CPU 继续升高。这说明增加应用处理能力并未消除下游约束，反而把更多请求压向数据库。我因此暂停盲目扩容，将慢请求按网关、服务逻辑、数据库和外部调用拆分，并结合 SQL 执行及线程池指标分析。\n分析发现，一次详情查询多次访问数据库，存在 N+1 问题；查询链路同步获取用户基础信息，慢认证调用阻塞共享线程；统计报表又在高峰占用主库资源。针对这三类原因，先把适宜的统计分析迁移到分析存储，为外部依赖设置隔离和合理超时，再通过批量查询和经执行计划验证的索引减少数据库访问。读取登录上下文时仍需验证令牌与授权，不能为了减少远程调用而取消安全校验。修改后以相近流量复测，并检查错误率和结果一致性。瓶颈有所缓解，但日志显示同一办件仍被反复刷新，表明下一步应减少重复读取。\n\n四、用缓存降低重复工作并控制代价\n我比较了增加只读副本和引入缓存两种方案。只读副本可分担部分查询，但频繁刷新仍重复执行相同工作，因此按数据特性采用不同缓存策略：变化很少的事项字典使用本地缓存，办件进度等共享热点放入 Redis。缓存键隔离业务对象及必要的权限上下文，授权检查不能因命中缓存而被跳过。办件状态在权威库更新后使缓存失效，结合过期时间限制旧数据持续时间，并把可接受的新鲜度边界与业务方确认。\n落地后曾出现热门数据集中失效，瞬时回源压高数据库负载。为此，在过期时间中引入随机偏移，并对单一热点采用互斥加载或请求合并，减少同一时间的重复回源。对未命中的异常请求设置适当保护，避免随意把所有空结果永久缓存。需要强调的是，随机过期主要缓解集中失效，请求合并主要限制热点回源，两者不等于强一致性保证。涉及最终受理等关键写操作时，仍以权威业务状态校验。效果通过命中率、数据库请求量、P99 与旧状态投诉共同观察，避免只追求命中率而忽略业务准确性。\n\n五、可靠异步与容量保障\n查询压力降低后，提交链路成为新的瓶颈。原先申请落库后还串行发送短信、同步监管信息和更新统计；短信网关变慢会拉长前端等待，用户再次点击又增加重复请求。我没有选择失败后简单跳过，因为通知和监管事件仍需最终处理，而是把核心提交与后续处理分离。核心路径完成必要校验和可靠受理后返回，通知、同步及统计由独立消费者执行。\n异步化必须处理两个风险。首先，数据库提交后、消息发送前可能发生故障，训练方案以同事务保存待发布事件，再由任务重试发布并核对，保证事件不会仅因进程退出而失去记录。其次，重复投递和消费失败不可避免，因此以同一次业务申请标识建立幂等控制，配置有限重试、失败队列、积压告警和明确的补偿责任。幂等键不能粗暴地永久限定为申请人与事项，否则会阻止合法的再次申请。补偿也要校验当前状态，防止重复执行已经完成的操作。\n容量方面，根据接近真实业务比例的压测确认服务边界，为查询与提交分别设置限流和隔离策略，过载时向用户给出清楚的等待或重试提示。自动扩容需结合瓶颈资源和启动时间，不能只看应用 CPU；当数据库或外部系统已到上限时，更多实例未必提高吞吐。高峰前预热必要缓存并演练依赖超时，运行中同时观察提交成功率、尾延迟和异步积压。原文示例在截止日保障了核心提交，但短信仍存在分钟级延迟，这项代价应对用户和运维透明。\n\n六、总结\n本次训练表明，高并发优化的关键是先识别约束，再减少重复工作、缩短关键链路，并在过载时有序保护核心功能。缓存带来新鲜度取舍，异步带来可靠发布与补偿责任，扩容也受下游容量限制。原文的改善数字只作为案例结果，实际项目需要可复现的统计口径和监控证据。后续可根据业务变化引入进度推送减少轮询，依据历史流量提前准备容量，并完善失败事件自动核对。只有把性能收益、正确性和运维成本一起验证，架构优化才能持续产生价值。"}, "rubric": [{"title": "题意完整", "text": "只写所选一题；有摘要、背景职责、理论、三个实践段与总结。"}, {"title": "技术准确", "text": "高并发检查缓存边界、可靠发布、幂等与容量；可靠性检查接受测试、恢复边界与探针。"}, {"title": "决策具体", "text": "三个实践段各有候选方案、选择依据及实施细节，而不是组件罗列。"}, {"title": "结果可信", "text": "指标带场景和口径；示例清楚标明；包含修正过程和残余风险。"}, {"title": "整篇一致", "text": "角色、时间、架构和效果前后协调；人工检查写作完整度，不自动给论文评分。"}]}, {"day": 5, "title": "需求工程：听全、听对、改得稳", "subtitle": "从多方口径冲突，写到可测试与可追溯", "date": "10/19", "minutes": 60, "goal": "区分需求开发与需求管理，用一个真实可理解的例子串起获取、验证、基线、影响分析和变更闭环。", "reading": [{"title": "01｜需求工程不是收一份清单", "text": "材料说明：以下项目、规模、数字和效果均为用户提供原文中的项目示例或教学设定，只用于写作训练，不代表你的实际经历，也不是你的测评分数。正式写作须换成可解释、可核实的个人项目事实。\n\n原文项目整合多个部门，同一材料的定义不同，窗口人员的实际难点又很少出现在书面材料里；政策调整进一步带来持续变化。因此论文的问题不能只写“需求较多”，而应说清来源多、语义冲突、隐性流程与变更压力分别如何影响交付。角色也要具体：制定获取计划、主持跨部门讨论、组织评审、建立跟踪和变更机制，而不把架构师写成独自决定所有业务规则的人。\n\n需求工程可分为需求开发与需求管理。需求开发包含获取、分析、定义与验证：先了解各方目标，再识别冲突并建模，形成可理解的规格，最后验证其正确性、完整性、一致性和可测试性。需求管理围绕批准的基线开展变更、版本、跟踪与状态控制。教学补充：基线是受控的共同起点，不是禁止变化；需求评审也不是等系统开发完再看演示。把这些关系写准确，比背一长串工具名称更重要。", "source": "用户原文（需求工程） 第 1—5 段；基线与职责边界为教学补充"}, {"title": "02｜获取与分析：按干系人选方法", "text": "原文没有继续只依赖部门书面提交，而是对牵头部门采用面谈，对跨部门联办事项组织 JRP，对窗口人员现场观察，对群众和企业使用问卷。每种方法解决的问题不同：面谈深挖目标，联合会议处理冲突，观察发现实际操作与书面流程的差异，问卷扩大覆盖。把方法与对象及问题配对，才能说明“为什么用”，而不是把方法名并排摆出。\n\n获取后还要分析。用例模型澄清参与者及其目标，活动图描述跨部门流转，统一数据字典消除同词异义。原文 JRP 最初议题太多、难以决策，后来会前发清单，每次只确认一个联办事项，未决问题指定责任人和答复期限。教学补充：问卷数量大不等于样本能代表所有用户，应覆盖关键群体并说明局限；会议上的一致也不必然意味着需求完整，还需要异常流程、权限、性能和可靠性等非功能要求。", "source": "用户原文（需求工程） 第 6、9 段；样本覆盖与非功能需求为教学补充"}, {"title": "03｜验证与基线：同意一句话，不等于同意一个含义", "text": "原文业务人员阅读文档时表示认可，但看到原型后才发现“即办件”在不同部门含义不同，有的指当场办结，有的指一个工作日内。这个例子说明验证既要检查表达，也要检查业务理解。通过可交互原型，让业务人员走一遍申报与受理；通过可测试验收条件，把模糊词转化为明确的触发、规则、边界与结果。\n\n例如“受理当日 18 时前办结”可作训练条件，但正式需求还要确定受理时间口径、跨节假日规则、异常中止、责任部门和适用事项；不能把教学例句当作统一法规。测试人员参与评审，将验收条件映射到正常与异常用例，业务负责人确认后建立基线。原型逼真曾让部分部门误以为系统已可上线，因此原文标注演示版，并说明接口、数据和非功能验证尚未完成。教学补充：原型是减少理解偏差的工具，不是所有功能都已实现的交付证明。", "source": "用户原文（需求工程） 第 7 段；验收条件边界与原型说明为教学补充"}, {"title": "04｜变更控制：快也要知道改了哪里", "text": "原文在上线前遇到补贴政策调整，申报条件和材料发生变化。直接让开发人员改代码可能快，却会漏掉关联界面、接口、数据和测试。受控流程是提出申请、描述变化、分析影响和成本、由有权角色批准、实施与测试、更新版本和跟踪关系，再确认关闭。需求跟踪矩阵把需求与设计、接口、实现及测试关联；正向跟踪可寻找变更影响，反向跟踪可检查实现是否有需求依据、测试是否对应批准需求。\n\n原文通过跟踪矩阵定位受影响用例和接口，又因申报条件与材料清单提前配置化而减少改动量。流程初期紧急变化也要等周会，因此增加紧急通道，由授权成员快速会签，事后补齐记录。教学补充：快速通道是加速有权决策，不是“紧急就免审批、免测试”；配置变更同样需要验证、版本与回退。效果不能只写交付更快，还应看遗漏、返工、可追溯性和回归测试结果。原文跨项目缺陷占比下降只属示例，不能在口径不同的项目间直接归因于一种方法。", "source": "用户原文（需求工程） 第 8—9 段；紧急通道、配置变更及指标因果边界为教学补充"}], "flow": [{"title": "获取全", "text": "识别干系人，按问题组合面谈、JRP、观察与问卷。"}, {"title": "理解对", "text": "用例与流程建模，数据字典消除语义冲突。"}, {"title": "验证实", "text": "原型＋可测试验收标准，批准后形成基线。"}, {"title": "变更稳", "text": "跟踪矩阵支持影响分析，有权批准后实施及回归。"}, {"title": "证据闭环", "text": "更新需求、版本、测试与状态，写清仍存在的局限。"}], "cards": [{"q": "需求开发的四项活动？", "a": "获取、分析、定义、验证。可理解为听需求、解冲突、写清楚、确认对。"}, {"q": "需求基线是不是冻结需求直到交付？", "a": "不是。基线是批准后的受控版本，后续变化走明确的管理流程。"}, {"q": "JRP 特别适合解决什么？", "a": "多个干系人之间的规则、材料、流程和术语冲突，需要同场协商并形成结论。"}, {"q": "现场观察能补什么？", "a": "用户未写出或未意识到的实际操作、绕路、交接和异常流程。"}, {"q": "为什么“系统应快速响应”不好验收？", "a": "缺少环境、负载、响应对象、时延和错误率等可检验条件。"}, {"q": "正向和反向跟踪怎样用？", "a": "正向从需求追到设计、实现与测试，反向从实现或测试追到需求依据。"}, {"q": "紧急变更能否跳过所有控制？", "a": "不能。可以快速授权，但仍保留影响分析、必要测试、版本记录和回退安排。"}, {"q": "三段实践最省力的主线？", "a": "按对象组合获取；用原型与标准验证；用基线、跟踪和审批控制变更。"}], "steps": [{"minutes": 15, "title": "阅读并分组", "text": "把四节内容归到获取、验证、变更三条实践主线。"}, {"minutes": 8, "title": "闭卷说术语", "text": "口述需求开发与管理，解释基线和双向跟踪。"}, {"minutes": 7, "title": "概念自检", "text": "完成五题，回读基线与紧急变更的关键错题。"}, {"minutes": 22, "title": "写一个变更管理段", "text": "以已确认的需求基线为起点，围绕上线前政策调整写 350—500 字，补齐授权、影响分析、验证与追溯。"}, {"minutes": 8, "title": "人工复核", "text": "补一个异常验收条件和一次配置变更回退安排。"}], "quiz": [{"q": "需求规格经批准形成基线后，政策发生变化，应该怎样做？", "options": ["任何变化都必须拒绝", "开发人员自行修改即可", "按影响分析、授权审批、实施验证与版本更新流程受控变更", "只更新会议纪要，不改需求和测试"], "correct": 2, "explanation": "基线提供变更的共同起点；需求仍可变化，但变化必须受控且可追溯。", "critical": true}, {"q": "几个部门对“营业执照”字段和联办流程理解冲突，最合适的组合是？", "options": ["只让一个程序员决定", "组织相关方 JRP，并用流程模型和统一数据字典确认结论", "只扩大问卷数量，不讨论冲突", "等上线后用投诉决定"], "correct": 1, "explanation": "跨部门冲突需相关方共同协调，模型与字典帮助把共识写实。", "critical": false}, {"q": "“页面看起来与最终产品一样”说明什么？", "options": ["系统一定能上线", "接口、性能与安全已全部通过", "用户无需再参与验收", "原型可能帮助确认交互，但不能证明后端和非功能能力已经完成"], "correct": 3, "explanation": "原型的完成范围与生产交付范围不同，必须说明演示边界并继续验证。", "critical": true}, {"q": "从某个已实现接口回查其对应的批准需求，属于什么？", "options": ["反向跟踪", "正向跟踪", "仅仅做代码格式化", "无须记录的例外"], "correct": 0, "explanation": "反向跟踪检查实现或测试的需求依据；正向跟踪则从需求定位下游影响。", "critical": false}, {"q": "上线前的紧急政策变更，下列哪项流程最稳妥？", "options": ["标为紧急后永久免审批", "使用授权的快速审批，完成必要影响分析与测试，并更新记录和回退安排", "只要改的是配置就无需验证", "删除原版本避免混淆"], "correct": 1, "explanation": "紧急通道加速决策，不取消授权、验证、版本和追溯。配置也可能改变业务行为。", "critical": true}], "writing": {"title": "把一次需求变更写扎实", "prompt": "训练情境：原型评审已澄清“即办件”口径并形成基线；上线前三周，政策调整了申报条件和材料清单。请写 350—500 字变更管理实践段，比较“直接改”与“受控变更”，说明如何使用跟踪矩阵做影响分析，如何由有权角色批准、实施与测试、更新版本并确认关闭。写出审批瓶颈与紧急通道的修正；配置化可减少改动，但不能免除测试和回退准备。原型验证只用一两句作背景，无需另写一整段。", "minutes": 22, "target": "350—500 字，聚焦需求变更管理；原型验证作为背景", "hint": "先写一个“看似同意，实则理解不同”的具体例子；再用基线串到变更，不重新讲一遍项目背景。", "model": "示例练习稿（基于训练项目）：\n在需求验证阶段，业务人员对规格文档表示认可，但原型演示暴露了“即办件”的口径冲突：有的部门理解为现场办结，有的理解为一个工作日内完成。若直接进入开发，双方可能到验收时才发现分歧。我因此组织相关部门共同走查申报与受理原型，把模糊描述改写为适用事项、受理时点、截止条件和异常处理，并请测试人员补充正常、临界和节假日场景。训练中可用“受理当日指定时点前办结”演示可测试表达，但具体时限必须以业务确认的规则为准。评审通过后，由有权业务负责人确认需求版本，形成后续设计和验收的基线。原型外观较完整曾让部分人员误以为系统可以提前上线，我在演示中明确数据、接口和性能验证的完成范围，避免把确认交互误当成确认交付。\n基线建立后，政策仍可能改变。上线前的申报条件和材料调整，我没有要求开发人员直接修改，而是记录变更来源、目的和紧急程度，通过需求跟踪矩阵从需求正向定位用例、接口、配置及测试，再反向核对相关实现是否仍有批准需求依据。团队评估工作量和上线风险，经授权评审后实施；易变规则已配置化，因此减少了代码改动，但配置仍纳入版本和回归测试，并准备旧规则的回退方案。初期审批要等待固定例会，影响紧急政策落实，于是设立有权成员快速会签的通道，保留最低必要的影响分析和验证，事后及时补齐记录。变更结束后同步更新规格、跟踪关系、验收用例和状态，确保测试与业务方使用的是同一版本。效果以是否遗漏关联功能、是否出现返工及记录能否追溯来检验，不仅以完成速度判断成功。"}, "rubric": [{"title": "问题与方案比较", "text": "以已批准基线和政策变化为背景，比较直接修改与受控变更，说明选择理由；不要求另写完整原型段。"}, {"title": "影响分析与跟踪", "text": "由变更需求定位受影响用例、接口和测试；理解反向跟踪用于核查实现的需求依据。"}, {"title": "授权与实施闭环", "text": "有权角色批准后实施、验证，更新文档/版本与跟踪关系，再确认关闭，不只写“走流程”。"}, {"title": "异常与安全边界", "text": "紧急通道加速有权审批；配置化仍需测试、版本与回退，不以紧急为由跳过控制。"}, {"title": "效果和可信表达", "text": "验证遗漏、返工和可追溯性，不编造成绩；350—500字是建议，不机械按字数判通过。"}]}, {"day": 6, "title": "把相似题分开，把薄弱段补实", "subtitle": "差异辨析 · 从“都像会了”到“真能写出”", "date": "10/20", "minutes": 60, "goal": "今天不增加新范文。挑前五天最薄弱的一段，纠正一个混淆，再用六拍重写。只补影响得分的缺口，不重新背全部材料。", "reading": [{"title": "01 同一个项目，题目变了，论点也必须变", "source": "综合改写：高并发、可靠性与高可用篇的第二问及主体", "text": "高并发题关心流量集中时系统如何保持响应和承载能力。范文先用链路追踪定位长调用、N+1 查询与报表争用，再用两级缓存减少重复读，最后用异步、限流和扩容保护提交。可靠性题则沿着失效发生的过程组织：设计阶段用 FMEA 提前识别，运行中用容错和冗余容忍失效，故障后用检测与恢复缩短影响。两题都可能出现幂等、异步和监控，但前者要说明压力与瓶颈，后者要说明失效模式与恢复机制。\n\n高可用题更直接围绕业务连续性展开，范文按冗余与故障转移、数据保护、流量控制与降级分别回应 RTO、RPO 和服务可用性目标。同一场短信故障，在性能篇中用于说明解耦，在可靠性篇中用于说明失败补偿，不能只改标题就重复整篇。"}, {"title": "02 三组最容易写混的词，换成一个可判定的例子", "source": "综合改写：ATAM、可靠性、高可用篇；定义边界为教学澄清", "text": "敏感点是某个架构参数对质量属性有显著影响，例如超时阈值改变会明显影响请求失败率；权衡点强调一个决策影响多个质量属性，并需要取舍，例如缓存保留更久可以减少数据库访问，却可能让用户看到更旧的状态。风险点则是可能妨碍质量目标的架构决策或不足，例如部门调用缺少隔离，故障可能耗尽调用方线程。三者不是互斥标签，一个决策可以既敏感又产生权衡。\n\n恢复块也不等于“失败了换个接口”。主版本输出不满足接受测试时，按恢复策略进入备选版本；范文用外部证照核验与本地证照核验作例子，并检查有效期、身份匹配和补核状态。若是有状态操作，还需考虑恢复到一致状态，避免备选路径接着处理已污染的状态。RTO 问允许多久恢复，RPO 问最多允许丢失多旧的数据；做了备份不代表已经满足恢复时限，必须通过恢复演练验证。"}, {"title": "03 同样写“数据”和“模型”，边界不能混", "source": "综合改写：数据中台篇第 5—8 段，AIGC 融合篇第 6—8 段", "text": "数据仓库和数据湖侧重存储、组织和分析，数据中台强调统一标准、治理和可复用服务。写“用了 Doris，把数据集中起来”还不够。范文进一步写出接入契约、结构校验、主数据标识、权威来源、质量整改工单，以及按字段授权的数据 API。只有把“管”和“用”写清，才回应了数据中台题。\n\nAIGC 融合也不能只写“模型接上了向量库”。范文让业务通过模型网关访问模型，知识检索提供依据，输入和输出分层防护，关键事实取自可信原文，无法可靠回答时转搜索或人工。检索命中不等于答案正确，私有化也不意味着没有泄露与注入风险。推理扩容受 GPU 资源约束，因此还需要并发上限、队列、降级与评测。"}, {"title": "04 把一段空话改成能批改的段落", "source": "原文件“六拍”写法；下例为教学改写", "text": "薄弱写法：“为了提高性能，我们采用 Kafka，并配合 Redis、Kubernetes 和完善的监控，系统性能显著提升。”这段有组件，却缺现场、备选方案、业务约束、失败路径和验证口径，无法判断选型是否合理。\n\n更实的写法：“提交请求串行等待短信，短信网关变慢后出现重复申请。我比较了超时跳过与异步处理；由于监管数据不允许缺失，选择可靠记录后续任务并异步执行。提交侧识别同一次申请，消费侧按流水号防重；后台失败进入有限重试与死信流程，告警后由责任人核对补偿。依据压测调整限流与容量，并检查提交延迟、积压时长及故障恢复后的漏处理。此方案减少了主流程等待，但通知可能延迟。”这仍是训练示范，效果只有在实际验证后才能写成项目事实。"}], "flow": [{"title": "选一处真薄弱", "text": "看前几天的自评或007批注，不以熟悉感判断"}, {"title": "找题目缺口", "text": "漏维度？概念混淆？缺方案比较？缺失败闭环？"}, {"title": "补因果和证据", "text": "从业务约束推出技术选择，再写可验证的结果"}, {"title": "闭卷重写", "text": "六拍齐全，替换空话，不堆新名词"}, {"title": "逐句对照", "text": "标出改了哪一句；还有什么必须补证据"}], "cards": [{"q": "高并发与可靠性篇，论点主线差在哪？", "a": "高并发：定位瓶颈→缓存优化→异步削峰与容量。可靠性：事前FMEA→运行中容错冗余→故障检测恢复。技术可复用，论证目的不同。"}, {"q": "敏感点和权衡点能同时成立吗？", "a": "可以。敏感点关心参数对属性影响显著；权衡点关心同一决策影响多个属性并需要取舍。要写具体参数和受影响属性。"}, {"q": "有备份就能说明 RTO、RPO 达标吗？", "a": "不能。需要明确可接受恢复时间和数据损失窗口，并通过可恢复性与时长演练验证。"}, {"q": "数据进了仓库，为什么不等于建成中台？", "a": "还需要标准、主数据、质量治理、授权服务和可复用业务能力。存储集中不是完整的“管与用”。"}, {"q": "RAG 和私有化能保证正确安全吗？", "a": "都不能单独保证。仍需来源与权限控制、输入输出防护、关键事实校验、降级和持续评测。"}, {"q": "一个论点段，至少能回答哪六个问题？", "a": "现场出了什么问题；比过什么；为何选择；如何实现；失败怎么办；如何验证并付出什么代价。"}], "steps": [{"minutes": 8, "title": "只选一个主攻点", "text": "打开前几天导出的打卡，优先选 007 指出的关键错误；若还没收到批改，选自评最低且没有文本证据的一段。没有旧稿就用今天的薄弱示例。"}, {"minutes": 10, "title": "读差异并做口述辨析", "text": "读四段材料。口述“同一消息队列场景如何分别服务于高并发与可靠性两题”，再翻卡校对。"}, {"minutes": 7, "title": "用情境题查概念", "text": "完成五题并核对，至少 4/5 且关键题全对。把错题对应的概念写在旧稿旁。"}, {"minutes": 25, "title": "重写一段，不重写全书", "text": "闭卷写目标题的三个论点和一段 350—500 字重写稿，再附一句“这一版补了什么”。旧稿可以先贴入文末标注，重写时不看学习材料。"}, {"minutes": 10, "title": "自检并与旧稿比较", "text": "逐项对照 rubric，尤其确认新稿真的补了业务约束、异常路径与验证。把新旧差异和正文一起发给 007。"}], "quiz": [{"q": "把高并发范文标题改成“可靠性设计”，主体仍只写查慢 SQL、上缓存、扩容。主要问题是什么？", "options": ["技术名词不够多", "没有按可靠性技术解释事前预防、运行容错与故障恢复", "句子不够长", "必须换成完全不同的项目"], "correct": 1, "critical": true, "explanation": "同一项目可以复用，但论点应回应题目维度。可靠性需要围绕失效和应对机制，而非只列性能优化措施。"}, {"q": "延长缓存有效期降低了查询压力，却增加旧状态被读取的机会。这最直接体现什么？", "options": ["性能与一致性的权衡", "所有风险均消除", "只是数据备份问题", "说明缓存一定不可用"], "correct": 0, "critical": true, "explanation": "这里明确存在两个属性之间的取舍；具体参数也可能是敏感点，不能把两种概念当互斥标签。"}, {"q": "数据集中存入 Doris 后，还缺哪组内容才更完整回答数据中台题？", "options": ["再列两个数据库品牌", "更多服务器参数", "标准与质量治理、主数据、授权可复用服务", "把中台改名为数据湖"], "correct": 2, "critical": false, "explanation": "中台重点是数据“管与用”，不仅是集中存储和分析。"}, {"q": "哪一句可作为可靠性改写段的有效细节？", "options": ["采用先进容错技术，全面保障业务", "主核验失败后使用备选核验，结果仍须通过有效期和身份匹配检查，不通过不放行", "私有化后没有任何风险", "重试直到成功，不需超时"], "correct": 1, "critical": true, "explanation": "备选路径并非无条件放行，接受测试与业务安全边界是容错设计的关键。"}, {"q": "对尚未测过的方案，哪种结尾写法最稳妥？", "options": ["直接借用范文成功率作为本人指标", "写“效果显著”就不算编数字", "写成“零故障”，因为用了多副本", "说明验证计划、指标与代价，不冒充已实现效果"], "correct": 3, "critical": false, "explanation": "有依据再报告结果；没有依据时清楚写计划与预期，避免把训练素材当实际经历。"}], "writing": {"title": "闭卷任务：一处辨析，一段重写", "prompt": "请先写明你选的主题（高并发 / 可靠性 / ATAM / 数据中台 / AIGC融合 / 需求工程）和今天要改的缺口。然后列出该题的三个论点；选择最薄弱的一个，重写 350—500 字完整论点段。最后用 50—100 字说明新稿比旧稿增加了什么依据或失败路径。没有旧稿时，改写今天给出的“组件堆砌”示例。", "minutes": 25, "target": "建议总计 500—750 字；重写的质量比增加字数重要", "hint": "先核对题目原词，再按六拍检查：景有没有具体影响？比是不是真正备选？选是否服从约束？做是否可落地？坑是否闭环？证是否有口径和代价？别通过增加新组件名凑字数。", "model": "参考结构，不是唯一答案：\n主题：可靠性。缺口：旧稿只写“多副本保证稳定”，没有失效和恢复路径。\n三论点：FMEA 提前识别失效；容错与冗余容忍失效；检测与恢复缩短故障。\n示范段（练习素材改写）：证照核验接口失效时，提交请求可能被阻塞。我们比较了并行开发多个独立版本与主备核验路径，考虑到外部数据源并不独立、团队成本有限，采用恢复块思路：主路径访问外部接口，异常时进入备选核验路径，但输出仍须通过证照有效期与身份匹配检查。备选数据可能滞后，因此不把本地命中直接视为最终确认，需按业务批准的范围标记待复核，并在外部接口恢复后补核；不满足接受标准的请求不能放行。对重复消息以办件流水号去重，并把去重与受理更新可靠衔接。通过接口超时、重复投递和旧数据场景演练，检查主备切换、重复受理和补核闭环。方案降低了单一外部依赖的影响，但增加了数据同步和后续核对成本，具体效果仍应以真实运行记录为准。\n本次改动：补上选型约束、接受测试、数据滞后和补核路径，替换“全面保障稳定”的空话。"}, "rubric": [{"title": "对准题目", "text": "三论点服务于当前题目，不是套用上一题结构；点名维度没有漏。"}, {"title": "纠正混淆", "text": "所选概念有准确边界和具体例子，不把相关词当同义词。"}, {"title": "六拍和选择依据", "text": "新稿能指出问题、备选方案、选择依据、实现、异常和验证，关键因果不断。"}, {"title": "失败与验证", "text": "失败路径有终点和责任，不只写“完善监控”；效果和数据有证据或明确为计划。"}, {"title": "重写确有改进", "text": "明确指出比旧稿增加的有效信息，去掉空话，没有靠堆砌术语凑字数。"}]}, {"day": 7, "title": "合上材料，交一份可信的答卷", "subtitle": "闭卷验收 · 用输出决定下一步", "date": "10/21", "minutes": 60, "goal": "今天从六个主练方向中选择 Day 4 没写过的一题。先用 10 分钟回忆六题各自的三个论点，再集中写一个关键段。下方学习材料可留到交卷后复盘，不新增背诵负担。", "reading": [{"title": "01 交卷后复盘：九段不是九个空盒子", "source": "改写自原文件：九段法与总纲", "text": "一篇完整论文应同时回应题目三问。摘要用项目、职责、问题、措施和效果给出全篇缩影；背景说明业务为什么需要这项设计；本人工作说明你真正作了哪些判断和组织工作；第二问按题目要求解释概念，并为主体埋线。三个主体论点不能仅列标题，每个都应包含场景、比较、选择、实现、异常和验证。结尾再回到真实效果、体会与未解决的问题，改进要对应正文的不足。\n\n九段可以作为练习框架，不是所有试题都必须强塞成同样长度。第三问已经点名的维度必须全覆盖；如果题目给出设计过程和效果等过程词，就要在每个主体中让阅卷者看见“如何选择、如何落地、如何验证”。"}, {"title": "02 交卷后复盘：把原理落到一次故障", "source": "综合改写：高并发篇第 8 段、可靠性篇第 6—8 段", "text": "高并发的异步段可以从短信拖慢提交切入，但必须解释为何不能无补偿地跳过监管记录，主流程如何缩短、后续任务如何可靠衔接、提交和消费如何防重，以及积压时怎样限流与扩容。可靠性段可以从外部证照接口失效切入，但需要交代接受测试、备选数据时效、待复核和不满足条件时的拒绝路径。\n\n两种写法都能体现同一个核心能力：不只是说用了什么，而是说明某种失败为什么会发生、为何选择这个办法、办法自己带来什么新问题、如何验证它仍符合业务边界。监控不是结尾装饰，应能触发告警、处置和复核。"}, {"title": "03 交卷后复盘：检查两个“对得上”", "source": "综合改写：总纲、ATAM、需求工程及可靠性总结", "text": "第一是题目与正文对得上。ATAM 题需要场景、架构分析、风险/敏感/权衡以及改进验证；需求工程题需要获取分析、验证和变更管理，不能只讲沟通；数据中台题需要治理和统一服务，不能只讲存储。检查每个被点名的要求有没有落在具体段落里，尤其容易漏掉容量、应用效果或变更控制。\n\n第二是数据与事实对得上。若使用同一个练习项目，项目角色、时间、规模和事件先后应保持一致；若改为个人经历，不能保留没有证据的示例成绩。MTBF 与 MTTR 计算可用性前要统一单位，且明确统计口径。对于仍计划中的方案，用“拟验证”而非“已实现”。没有漂亮数字，也可以用真实的故障演练结果和业务现象写出可信结论。"}, {"title": "04 交卷后复盘：一次通过，只代表这次表现", "source": "教学验收说明，非考试官方评分标准", "text": "五道客观题能检查若干概念判断，但不能代替阅卷。自评分能帮助你指出薄弱处，也不能证明正文的技术逻辑一定正确。真正的作文验收要读完整文本，核对是否回应题目、是否有具体取舍、是否正确处理异常、是否真实报告证据。\n\n如果某题错了，或者正文需要看提示才能继续，不必整份重来。把缺口缩小成一个可修复动作，例如“重写缓存一致性代价两句”或“补上消息重试后的幂等处理”。把本页打卡和正文交给 007，依据具体批注决定下一轮，而不是用一个自评总分宣告全部掌握。"}], "flow": [{"title": "选一个未模拟方向", "text": "六个主题中，避开Day4已写的全文方向"}, {"title": "闭卷列六题论点", "text": "每题三个论点，共六行，用10分钟完成"}, {"title": "重点输出一题", "text": "第二问短答 + 一个完整主体段，聚焦薄弱处"}, {"title": "客观题核对", "text": "测概念边界，记录真实尝试与提示使用"}, {"title": "自检后交卷", "text": "分别报告机器结果、自评和待人工批改项"}], "cards": [{"q": "九段法的主要构成？", "a": "摘要两段；背景；组成与职责；第二问概念与引题；三个主体论点；总结。是组织工具，优先满足题目。"}, {"q": "读第三问时最先圈什么？", "a": "点名的维度、必须覆盖的对象，以及设计过程、实施效果、难点等过程要求。"}, {"q": "一段只有组件名，缺少什么？", "a": "业务问题、候选方案、选择依据、落地细节、失败路径与验证代价。"}, {"q": "没有真实效果数据，怎样写？", "a": "不冒充已有成绩。练习明确标示示例；真实项目只用有证据的数据或清楚写验证计划。"}, {"q": "客观题通过等于作文通过吗？", "a": "不等于。自动核对只针对选项；自检是个人判断；作文需要 007 阅读批改。"}, {"q": "验收后怎么复习最省力？", "a": "按批注修复具体缺口，重写关键句或薄弱段，不把所有范文从头再背。"}], "steps": [{"minutes": 5, "title": "选一个没模拟过的方向", "text": "从高并发、可靠性、ATAM、数据中台、AIGC融合、需求工程中选题，避开 Day 4 已完成的全文方向。读任务后开始闭卷。"}, {"minutes": 10, "title": "六题各列三论点", "text": "在正文区先写六行，每行一个主题加三个论点。先凭记忆列，想不起来可以留空，交卷后再补。"}, {"minutes": 25, "title": "选定方向重点输出", "text": "围绕选定题写第二问短答和一个 350—500 字主体段。只写一题，不重做六篇。"}, {"minutes": 8, "title": "五题跨主题核对", "text": "结束计时后完成情境题，至少 4/5 且关键题全对。答错则记录对应概念，不借熟悉感放过。"}, {"minutes": 7, "title": "按证据自检", "text": "检查六题论点是否混套；为重点段标出两个仍需核对或改写的位置。"}, {"minutes": 5, "title": "交卷等人工结论", "text": "导出或复制打卡给 007。客观题结果、自评和作文结论分开记录，作文等待 007 阅读批改。"}], "quiz": [{"q": "监管同步改成异步后，最完整的验收指标组合是哪一项？", "options": ["只看提交接口响应时间", "只看 Kafka 是否运行", "提交延迟和成功率、积压等待、故障恢复后的漏处理/重复处理及补偿结果", "只看服务器数量"], "correct": 2, "critical": true, "explanation": "异步缩短主流程等待，却把部分风险转到后台。需要同时验证主流程、最终完成和故障补偿。"}, {"q": "备选证照库未包含当天新发证照，主核验又不可用，应如何设计？", "options": ["有备选就无条件通过", "明确可接受范围与接受测试，不满足时不放行，支持补核或人工流程", "忽略数据时效，只要姓名相同即可", "循环重试直到用户放弃"], "correct": 1, "critical": true, "explanation": "容错不能突破业务正确性边界；备选数据不充分要有安全的受限处理，而非冒险批准。"}, {"q": "ATAM 中发现“缓存更久可以提速，但旧状态更多”，接下来最恰当的动作是什么？", "options": ["删去一致性指标，只保留性能", "因为是权衡所以无法改进", "宣告缓存方案错误，不做分析", "用相关场景和响应度量分析取舍，选择可接受参数并验证"], "correct": 3, "critical": false, "explanation": "权衡需要结合业务优先级和可度量场景作决策，并验证，而不是取消另一属性。"}, {"q": "政策变更已获批准，修改了申报材料清单。怎样降低遗漏？", "options": ["通过跟踪矩阵定位用例、接口和测试，更新基线/版本并回归验证", "让开发直接口头通知一下就结束", "只更新页面显示，不管接口和测试", "删除旧版文档，不保留来源"], "correct": 0, "critical": true, "explanation": "需求变更需要影响分析、批准实施、文档与跟踪更新及验证，可追溯到原需求和变更。"}, {"q": "哪一种 AIGC / 数据服务写法最可信？", "options": ["有向量库后全部回答都正确", "统一网关后无需字段权限", "描述授权与来源约束、错误/无命中时的退路，并用真实评测说明边界", "所有范文数据均可直接当个人成绩"], "correct": 2, "critical": false, "explanation": "网关、检索和中台只是架构能力的一部分，权限、来源、异常和效果证据必须单独说明。"}], "writing": {"title": "最终闭卷：六题列纲 + 一题重点论证", "prompt": "先完成【六题各列三论点】：高并发、可靠性、ATAM、数据中台、AIGC融合、需求工程，每题一行，列三个论点，共18个论点标题。该部分建议10分钟，记不起可留空。\n\n再从以下六题选择 Day 4 没写过的一题（请说明选哪题）：\nA 高并发：说明性能、稳定性和容量挑战；实践覆盖瓶颈定位、缓存优化、异步削峰与容量保障。\nB 可靠性：说明可靠性主要技术；实践覆盖事前失效分析、运行容错、故障检测恢复。\nC ATAM：说明评估方法与主要步骤；实践覆盖质量场景、敏感/权衡/风险点及改进验证。\nD 数据中台：说明中台与仓库、数据湖关系；实践覆盖统一管理、治理及统一服务。\nE AIGC融合：说明引入模型的主要问题；实践覆盖接入架构、安全合规及推理资源弹性。\nF 需求工程：说明主要活动；实践覆盖获取分析、需求验证和变更管理。\n\n对选定题写：①约150字第二问短答；②一个350—500字完整主体段，呈现问题、方案比较、选择依据、实现、异常、验证与代价；③标明项目与数字哪些为训练素材、哪些为个人已核实事实。不要求六篇全文。", "minutes": 35, "target": "六行论点 + 约150字短答 + 350—500字主体段；只重点写一题", "hint": "六题各列三论点：高并发按压力处置；可靠性按失效前中后；ATAM按评估过程；数据中台按数据管与用；AIGC按接入、治理、资源；需求按听全、听对、改稳。选定题的主体仍用六拍，不必为凑术语增加新组件。", "model": "六题论点参考（可采用同义表达，需回应题目）：\n高并发：瓶颈定位；缓存优化；异步削峰与容量保障。\n可靠性：FMEA前置识别；软件容错与冗余；故障检测与恢复。\nATAM：效用树与可度量场景；架构分析及三类点；改进排序与验证。\n数据中台：汇聚与标准；主数据及质量治理；受控统一服务。\nAIGC融合：模型接入与知识检索；安全合规；推理资源与弹性降级。\n需求工程：获取与分析；需求验证与基线；需求变更管理。\n\n重点题结构示范：选择F需求工程。第二问可说明需求开发包含获取、分析、定义与验证，需求管理围绕基线进行变更、版本、跟踪和状态管理。三条主线分别解决需求听得全、理解得对和变化受控。\n主体示范（训练素材改写）：上线前政策改变了申报条件和材料清单。我比较了让开发直接修改与受控变更两种做法；前者看似快，却可能遗漏接口与测试，因此选择先记录变更，再依据跟踪矩阵分析影响。团队从批准的需求定位受影响用例、接口与测试，评估工期和风险，经有权角色确认后实施。材料清单已配置化，减少了代码调整，但配置同样纳入版本和回归验证。初期紧急变更也要等周会，影响响应速度，我们因此建立授权快速审批通道，保留必要的影响分析、验证和事后记录。实施后同步更新需求与跟踪关系，核对正常、异常和回退路径，再由业务确认关闭。效果应依据实际处理时间、遗漏与回归结果报告，不能照搬范文成绩。该方案增加了记录与评审成本，但让变化的来源、影响和处理结果可追溯。\n\n这只是选题F的结构示范。你也可以选其他未模拟方向，007按题目覆盖与技术因果检查，不按答案字面相似度判断。"}, "rubric": [{"title": "六题论点与重点选题", "text": "六个主题各有三个合适论点，没有把相似题混套；重点题选择Day4未写过的方向。"}, {"title": "第二问准确", "text": "围绕选定题解释必要概念与关系，不因短而漏核心，不混淆相近术语。"}, {"title": "主体论证完整", "text": "问题、比较、选择、实现、异常、验证形成完整因果链，体现架构判断。"}, {"title": "事实与技术边界", "text": "不夸大组件保证，异常有处理终点；数字口径一致，练习素材与个人事实明确区分。"}, {"title": "独立输出与改进方向", "text": "能指出实际查看提示情况，以及至少两处仍需核对或改写的具体句子，等待人工结论。"}]}];
const APP_VERSION='1.0';
let D,state,key,timerHandle;
const $=id=>document.getElementById(id);

const fresh=()=>({version:APP_VERSION,read:false,answers:{},quiz:null,attempts:[],writing:'',rubric:{},evidence:{},cardViews:0,hintViews:0,modelViews:0,studyPeeks:0,session:null,closedAssists:0,updated:null});
let canSave=true;
function save(){state.updated=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify(state));canSave=true}catch(e){canSave=false}status();}
function status(){if(!$('storage'))return;$('storage').textContent=canSave?'仅保存在当前浏览器中，无云同步、无上传。浏览器清理数据、无痕模式或更换文件位置可能使记录无法恢复，请及时导出。':'当前浏览器不允许本地保存，刷新可能丢失记录。请先复制或导出打卡。';$('saved').textContent=state.updated&&canSave?'本地已保存 '+new Date(state.updated).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'建议每次结束后导出备份';const qc=state.quiz&&state.quiz.pass;const rc=D.rubric.every((_,i)=>state.rubric[i]!==undefined&&state.rubric[i]!=='');$('qstatus').textContent=qc?'本次客观题通过':state.quiz?'本次需订正':'尚未测验';$('rstatus').textContent=rc?'自检已完成（自评）':'自检尚未完成';$('wstatus').textContent=state.writing.trim()?'作文待 007 批改':'作文尚未提交';const p=[state.read,!!qc,!!state.writing.trim(),rc].filter(Boolean).length;$('progress').style.width=p*25+'%';$('progressText').textContent=`本页流程 ${p}/4：阅读 · 客观题 · 写作 · 自检（不是能力评分）`;$('charcount').textContent=`正文 ${Array.from(state.writing.replace(/\s/g,'')).length} 字符（不含空白）`;$('viewcount').textContent=`翻卡 ${state.cardViews} 次 · 写作提示 ${state.hintViews} 次 · 参考答案 ${state.modelViews} 次 · 闭卷中辅助查看 ${state.closedAssists} 次`;$('selfsum').textContent=rc?`自评分 ${D.rubric.reduce((s,_,i)=>s+Number(state.rubric[i]),0)}/10，仅记录你的判断；这不是机器批改，也不代表作文通过。`:'五个维度均选择后，显示“自检已完成”。评分由你自己判断，低分可以如实记录。';}
function switchDay(n){D=DAYS.find(x=>x.day===n)||DAYS[0];key='essay-training-2026-v1-day'+D.day;state=fresh();canSave=true;try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&typeof v==='object')state={...state,...v};}catch(e){canSave=false}document.title=`Day ${D.day} · ${D.title} | 论文练习室`;render();if(timerHandle)clearInterval(timerHandle);timerHandle=setInterval(tick,1000);tick();if(DAYS.length>1){location.hash='day'+D.day;try{localStorage.setItem('essay-training-active-day',String(D.day))}catch(e){}}}
function render(){const many=DAYS.length>1;$('chooser').innerHTML=many?`<label class="quiet">今天练什么 <select id="daySelect" class="topselect">${DAYS.map(x=>`<option value="${x.day}" ${x.day===D.day?'selected':''}>Day ${x.day} · ${esc(x.title)}</option>`).join('')}</select></label>`:'<small>离线练习 · 2026/10/15—10/21 · 007</small>';
$('app').innerHTML=`<section class="hero"><div class="eyebrow">DAY 0${D.day} / 07 · ${esc(D.date)}</div><h1>${esc(D.title)}</h1><div class="subtitle">${esc(D.subtitle)}</div><p class="goal">${esc(D.goal)}</p><div class="pills"><span class="pill">建议 ${D.minutes} 分钟</span><span class="pill">读懂 → 回忆 → 写出</span><span class="pill">作文由 007 批改</span></div></section>
<nav class="route" aria-label="本日导航"><a href="#learn">① 读材料</a><a href="#recall">② 记逻辑</a><a href="#quiz">③ 做判断</a><a href="#write">④ 闭卷写</a><a href="#review">⑤ 自检交卷</a></nav>
<div class="statusline"><div class="stat"><small>机器可核对的部分</small><strong id="qstatus"></strong></div><div class="stat"><small>由你如实评估</small><strong id="rstatus"></strong></div><div class="stat"><small>需要人工阅读判断</small><strong id="wstatus"></strong></div></div><div class="progress"><i id="progress"></i></div><p class="quiet" id="progressText"></p>
<div class="notice"><strong>练习边界：</strong>材料来自你提供的论文专题。范文项目、团队、时间和数字均为练习素材，未经核实为你的经历；“我”是示范写法。教学补充已标出。要记的是论证逻辑和关键术语，不要求全文死背。</div><p class="quiet" id="storage"></p>
<div id="study"><section class="section"><h2>今天到底要背什么？</h2><p><strong>必须掌握：</strong>用自己的话说清问题、方案比较、选择理由、具体实现、失败兜底和验证代价。关键术语要会用，不必把整段原封不动背下来。</p><p><strong>不用死背：</strong>范文的年月、人数、成绩数字和每一句措辞。${D.day===1?'Outbox 是进阶补充，先记住“Kafka 本身不保证业务与消息同时成功”，不用首日背完整实现。':'每个主题优先记自己的论证顺序，不用连同示例数字一起记。'}</p><div class="actions"><button id="jumpModel" class="primary">看今天要学会的完整示范段</button><a href="#recall">直接看必记关键词卡 →</a></div><div id="studyModel" class="revealbox" hidden>${esc(D.writing.model)}</div><p class="quiet">初学可以看完整段再写；闭卷开始会把本区一并隐藏。查看记录如实保留。</p></section><section id="learn" class="section"><div class="sectionhead"><h2>先把这件事读懂</h2><span class="num">01 / LEARN</span></div><p class="lead">初学时可以放心看正文。闭卷计时开始后，本区会收起。</p>${D.reading.map(x=>`<article class="readblock"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p><span class="source">来源：${esc(x.source)}</span></article>`).join('')}<label class="checkline"><input type="checkbox" id="readDone" ${state.read?'checked':''}><span>我已读完，并能用自己的话说出本日的核心矛盾。</span></label></section>
<section class="section"><div class="sectionhead"><h2>把文字变成一条路</h2><span class="num">MAP</span></div><p class="lead">按编号走一遍，再遮住图试着讲出来。</p><div class="flow" role="list" aria-label="学习流程图">${D.flow.map((x,i)=>`<div class="node" role="listitem"><small>STEP 0${i+1}</small><span class="arrow" aria-hidden="true">${i===D.flow.length-1?'↺':'→'}</span><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p></div>`).join('')}</div><p class="flowcaption">箭头表示论述或处理顺序；步骤中的核对、监控和验证会反馈到前面的设计。</p></section>
<section id="recall" class="section"><div class="sectionhead"><h2>先回忆，再翻开</h2><span class="num">02 / RECALL</span></div><p class="lead">先口述一个完整句子，再看答案。记住“为什么”和“怎么兜底”。</p><div class="cards">${D.cards.map((x,i)=>`<button class="flash" data-card="${i}" aria-expanded="false"><b>${esc(x.q)}</b><span id="card${i}" hidden>${esc(x.a)}</span><small>点击翻开 / 收起</small></button>`).join('')}</div></section>
<section class="section"><h2>今天怎么做</h2><div class="steps">${D.steps.map(x=>`<div class="step"><div><b>${esc(x.title)}</b><small>${x.minutes} 分钟</small><p>${esc(x.text)}</p></div></div>`).join('')}</div></section>
<section id="quiz" class="section"><div class="sectionhead"><h2>判断，比复述更重要</h2><span class="num">03 / CHECK</span></div><p class="lead">5 道单选情境题。通过线：至少 4/5，且标记“关键”的题全部正确。重测会保留历史；这只证明本次选择符合答案。</p><div id="questions">${D.quiz.map((q,i)=>`<fieldset class="question"><legend>${i+1}. ${esc(q.q)} ${q.critical?'<span class="critical">关键</span>':''}</legend>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${Number(state.answers[i])===j&&state.answers[i]!==undefined?'checked':''}><span>${'ABCD'[j]}. ${esc(o)}</span></label>`).join('')}<div id="ex${i}" hidden></div></fieldset>`).join('')}</div><div class="actions"><button id="grade" class="primary">核对本次答案</button><button id="retry">清空选择并重测</button></div><p id="quizResult" class="result" role="status"></p><p id="quizHistory" class="quiet"></p></section></div>
<section id="write" class="section"><div class="sectionhead"><h2>${esc(D.writing.title)}</h2><span class="num">04 / WRITE</span></div><p class="lead">${esc(D.writing.target)}</p><div class="prompt">${esc(D.writing.prompt)}</div><div class="timerbar"><div><small id="timerlabel">建议闭卷时间</small><span class="timer" id="timer">${D.writing.minutes}:00</span></div><div><small>浏览器内计时</small><b id="sessionStatus">尚未开始</b></div></div><div class="actions"><button id="start" class="primary">开始闭卷，收起材料</button><button id="stop">结束本次计时</button><button id="peek">临时查看学习材料</button></div><p class="quiet">开始后先前展开的提示会收起。计时跨刷新继续，离开页面的时间也计入；你可以随时查看资料，页面只记录操作，不能防作弊，也不保证掌握。</p><textarea id="writing" class="editor" aria-label="闭卷写作正文" placeholder="在这里写。先想清因果，再落笔；没有真实证据的数据不要编造。">${esc(state.writing)}</textarea><div class="counts"><span id="charcount"></span><span id="saved"></span></div><div class="actions"><button id="hintBtn" class="soft" aria-expanded="false">看写作提示</button><button id="modelBtn" aria-expanded="false">看参考答案 / 结构</button></div><div id="hint" class="revealbox" hidden>${esc(D.writing.hint)}</div><div id="model" class="revealbox" hidden>${esc(D.writing.model)}</div><p id="viewcount" class="quiet"></p><p class="sessionnote" id="closedNote"></p></section>
<section id="review" class="section"><div class="sectionhead"><h2>按证据自检，再交卷</h2><span class="num">05 / REVIEW</span></div><p class="lead">每项 0—2 分是你的自评。先对照自己写的句子，别因为看懂参考答案就给满分。</p>${D.rubric.map((r,i)=>`<div class="rubric"><strong>${i+1}. ${esc(r.title)}</strong><p>${esc(r.text)}</p><select data-rubric="${i}" aria-label="${esc(r.title)}自评"><option value="">请选择你的自评</option><option value="0" ${state.rubric[i]==='0'?'selected':''}>0 · 未写 / 明显错误</option><option value="1" ${state.rubric[i]==='1'?'selected':''}>1 · 写到了，但缺依据或细节</option><option value="2" ${state.rubric[i]==='2'?'selected':''}>2 · 我认为完整，有具体文本依据</option></select><input data-evidence="${i}" value="${esc(state.evidence[i]||'')}" aria-label="${esc(r.title)}文本证据或待改点" placeholder="写一句文本证据或待改点（建议填写）"></div>`).join('')}<p id="selfsum" class="quiet"></p><div class="notice"><strong>今日验收分三层：</strong>客观题由页面核对；自检由你标记；作文质量需由 007 阅读后批改。请把导出的打卡或复制的正文发回，再决定是否需要重写。</div><div class="actions"><button id="export" class="primary">导出打卡 TXT</button><button id="copy" class="soft">复制全文给 007</button><button id="reset" class="danger">重置本日记录</button></div><p id="actionMessage" class="quiet" role="status"></p><textarea id="manualCopy" class="manualcopy" readonly hidden aria-label="手动复制打卡全文"></textarea></section>
<footer class="footer">今天写清一个因果，明天就少背一段空话。<br>论文练习室 · 本地保存 · 不上传内容 · 2026</footer>`;
if(many)$('daySelect').onchange=e=>{switchDay(+e.target.value);window.scrollTo(0,0)};
$('jumpModel').onclick=()=>{const opening=$('studyModel').hidden;$('studyModel').hidden=!opening;if(opening){state.modelViews++;if(active())state.closedAssists++;save()}};
$('readDone').onchange=e=>{state.read=e.target.checked;save()};
document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const content=$('card'+b.dataset.card);const opening=content.hidden;content.hidden=!opening;b.setAttribute('aria-expanded',String(opening));if(opening){state.cardViews++;if(active())state.closedAssists++;save()}});
D.quiz.forEach((q,i)=>document.querySelectorAll(`[name=q${i}]`).forEach(el=>el.onchange=e=>{state.answers[i]=Number(e.target.value);state.quiz=null;clearQuiz();save()}));
$('grade').onclick=grade;$('retry').onclick=()=>{state.answers={};state.quiz=null;document.querySelectorAll('#questions input').forEach(el=>el.checked=false);clearQuiz();save();$('quizResult').textContent='已清空本次选择，历史尝试保留。'};
$('writing').oninput=e=>{state.writing=e.target.value;save()};
$('start').onclick=()=>{if(active())return;if(state.session&&!confirm('开始新一轮闭卷计时？正文和所有查看次数保留。'))return;state.session={start:Date.now(),end:null};state.closedAssists=0;$('hint').hidden=true;$('model').hidden=true;$('studyModel').hidden=true;$('hintBtn').setAttribute('aria-expanded','false');$('modelBtn').setAttribute('aria-expanded','false');$('study').classList.add('studyhidden');state.studyPeeks=0;save();tick();$('write').scrollIntoView({block:'start'})};
$('stop').onclick=()=>{if(!active())return;state.session.end=Date.now();$('study').classList.remove('studyhidden');save();tick()};
$('peek').onclick=()=>{if(!active()){ $('learn').scrollIntoView({block:'start'});return;}const opening=$('study').classList.contains('studyhidden');$('study').classList.toggle('studyhidden',!opening);if(opening){state.studyPeeks++;state.closedAssists++;save();$('learn').scrollIntoView({block:'start'})}tick()};
for(const [btn,id,field] of [['hintBtn','hint','hintViews'],['modelBtn','model','modelViews']])$(btn).onclick=()=>{const opening=$(id).hidden;$(id).hidden=!opening;$(btn).setAttribute('aria-expanded',String(opening));if(opening){state[field]++;if(active())state.closedAssists++;save()}tick()};
document.querySelectorAll('[data-rubric]').forEach(el=>el.onchange=e=>{state.rubric[el.dataset.rubric]=e.target.value;save()});document.querySelectorAll('[data-evidence]').forEach(el=>el.oninput=e=>{state.evidence[el.dataset.evidence]=e.target.value;save()});
$('export').onclick=()=>{const blob=new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=`Day${D.day}_论文打卡_${new Date().toISOString().slice(0,10)}.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);$('actionMessage').textContent='已发起 TXT 下载。请确认文件已保存；不会自动发给 007。'};
$('copy').onclick=async()=>{const txt=report();try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(txt);$('actionMessage').textContent='已复制完整打卡与正文，回到对话粘贴给 007。'}catch(e){$('manualCopy').hidden=false;$('manualCopy').value=txt;$('manualCopy').focus();$('manualCopy').select();$('actionMessage').textContent='当前浏览器不支持一键复制，已展开并选中文本；请使用系统复制。'}};
$('reset').onclick=()=>{if(!confirm('确定重置本日记录吗？本日正文、答题历史、自评与计时都将清除，无法在本页撤销。建议先导出 TXT。其他天记录不受影响。'))return;try{localStorage.removeItem(key)}catch(e){}state=fresh();render();tick()};
if(active())$('study').classList.add('studyhidden');showQuiz();status();}
function active(){return !!state.session&&!state.session.end}
function clearQuiz(){D.quiz.forEach((_,i)=>{$('ex'+i).hidden=true});$('quizResult').textContent='答案尚未核对。';$('quizHistory').textContent=`已完成 ${state.attempts.length} 次测验。修改选项后必须重新核对。`;}
function grade(){if(D.quiz.some((_,i)=>state.answers[i]===undefined)){ $('quizResult').textContent='请先完成全部 5 题，再核对。';return;}const correct=D.quiz.map((q,i)=>state.answers[i]===q.correct),score=correct.filter(Boolean).length,criticalOK=D.quiz.every((q,i)=>!q.critical||correct[i]);state.quiz={score,pass:score>=4&&criticalOK,correct,criticalOK,at:new Date().toISOString()};state.attempts.push({...state.quiz,answers:{...state.answers}});save();showQuiz();}
function showQuiz(){if(!state.quiz){clearQuiz();return;}const r=state.quiz;D.quiz.forEach((q,i)=>{const e=$('ex'+i);e.hidden=false;e.className='explain'+(r.correct[i]?'':' wrong');e.textContent=(r.correct[i]?'本题正确。':'本题需订正。')+`参考选择：${'ABCD'[q.correct]}。`+q.explanation;});$('quizResult').textContent=`${r.score}/5 · ${r.pass?'客观题通过':'未通过，先读解释再重测'}${!r.criticalOK?'（有关键题未答对）':''}`;$('quizHistory').textContent=`已完成 ${state.attempts.length} 次测验；首次 ${state.attempts[0]?.score??'-'}/5；当前状态只对应本次作答。`;}
function tick(){if(!$('timer'))return;const s=state.session;let elapsed=s?Math.floor(((s.end||Date.now())-s.start)/1000):0;elapsed=Math.max(0,elapsed);const remaining=Math.max(0,D.writing.minutes*60-elapsed);$('timer').textContent=s?`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`:`${D.writing.minutes}:00`;$('timerlabel').textContent=s?'本轮已用时间':'建议闭卷时间';$('sessionStatus').textContent=!s?'尚未开始':s.end?'本轮已结束':remaining===0?'建议时长已到':'正在写作';$('start').disabled=active();$('start').textContent=s&&!active()?'再写一轮（保留正文）':'开始闭卷，收起材料';$('stop').disabled=!active();$('peek').textContent=active()?($('study').classList.contains('studyhidden')?'临时查看学习材料':'重新收起学习材料'):'返回学习材料';$('closedNote').textContent=active()?`本轮闭卷中辅助查看 ${state.closedAssists} 次；材料重开 ${state.studyPeeks} 次。可以继续写，记下薄弱处即可。`:s?`本轮计时已结束，闭卷中辅助查看 ${state.closedAssists} 次。作文仍待 007 批改。`:'';}
function report(){const r=state.quiz,rc=D.rubric.every((_,i)=>state.rubric[i]!==undefined&&state.rubric[i]!=='');return [`Day ${D.day} | ${D.title}`,`计划日期：2026/${D.date}；导出：${new Date().toLocaleString('zh-CN')}`,`客观题：${r?r.score+'/5，'+(r.pass?'通过':'未通过'):'尚未核对'}；尝试 ${state.attempts.length} 次`,`历史：${state.attempts.map((x,i)=>`第${i+1}次 ${x.score}/5 ${x.pass?'通过':'未通过'}`).join('；')||'无'}`,`自检：${rc?'已完成（本人自评）':'未完成'}；作文状态：${state.writing.trim()?'待 007 批改':'未写'}`,`翻卡 ${state.cardViews} 次；写作提示 ${state.hintViews} 次；参考答案 ${state.modelViews} 次；本轮闭卷中辅助查看 ${state.closedAssists} 次`,state.session?`本轮计时：${Math.max(0,Math.floor(((state.session.end||Date.now())-state.session.start)/1000))} 秒；${active()?'仍在计时':'已结束'}`:'尚未开始闭卷计时','说明：本页只记录浏览器内操作，不防作弊；机器未判断作文质量。范文数据是练习素材，不是本人已验证经历。','\n【本日写作题】',D.writing.prompt,'\n【我的正文】',state.writing||'（未写）','\n【逐项自评 / 待改点】',...D.rubric.map((x,i)=>`${i+1}. ${x.title}：${state.rubric[i]??'未评'}/2。${state.evidence[i]||'未填文本证据或待改点'}`),'\n请 007 检查事实与业务约束、技术逻辑、题目覆盖、论证细节和表达，并指出必须重写的句子。'].join('\n');}
let lastDay=DAYS[0].day;if(DAYS.length>1){try{lastDay=Number(localStorage.getItem('essay-training-active-day'))||lastDay}catch(e){}}
switchDay(Number((location.hash.match(/^#day(\d+)$/)||[])[1])||lastDay);
</script></body></html>
