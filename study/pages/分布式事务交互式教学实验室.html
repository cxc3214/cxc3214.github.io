<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分布式事务交互式教学实验室</title>
<style>
:root{
  --bg:#edf0f3; --panel:#ffffff; --ink:#18212b; --muted:#55636f; --line:#d6dce3; --line2:#aeb8c3;
  --accent:#0b5f7a; --accent-bg:#e1f0f4; --accent-ink:#064458;
  --ok:#1b7443; --warn:#8f5500; --bad:#b3261e; --comp:#6a3da3; --info:#1b5ea8;
  --changed:#ffefae; --down-bg:#f1f1f1;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font)}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:50}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px;border-radius:3px}

.app{display:grid;grid-template-columns:204px minmax(0,1fr);min-height:100vh}
.nav{background:#16222d;color:#e6edf3;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;line-height:1.4;padding:4px 8px 12px;border-bottom:1px solid #2c3b49;margin-bottom:10px}
.brand small{display:block;font-weight:400;font-size:12px;color:#9db0c0;margin-top:2px}
.nav ol{list-style:none;margin:0;padding:0}
.nav button.chbtn{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;color:#d5dee6;padding:8px 8px;border-radius:5px;cursor:pointer;line-height:1.35;align-items:flex-start}
.nav button.chbtn .no{flex:0 0 22px;color:#8fb6c6;font-variant-numeric:tabular-nums}
.nav button.chbtn:hover{background:#223341}
.nav button.chbtn[aria-current="page"]{background:#0e6a86;color:#fff}
.legend{margin-top:16px;padding:10px 8px;border-top:1px solid #2c3b49;font-size:12px;color:#aebdca;line-height:1.7}
.legend b{color:#e6edf3;font-weight:600}
.legend .ln{display:flex;align-items:center;gap:8px}
.legend svg{flex:0 0 34px}
.kbd{font:12px var(--mono);background:#26384a;border-radius:3px;padding:0 5px;color:#e6edf3}

main{padding:20px 22px 40px;min-width:0}
.mhead h1{font-size:24px;line-height:1.3;margin:0 0 4px}
.mhead p.intro{margin:0 0 12px;color:var(--muted);max-width:78ch}
.sctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.sctabs button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;line-height:1.4;text-align:left}
.sctabs button:hover{border-color:var(--accent)}
.sctabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sctabs .kind{font-size:12px;opacity:.85;display:block}

.labgrid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
.cola,.colb{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h2{font-size:15px;margin:0 0 8px;line-height:1.4}
.stage{padding:8px;background:#fbfcfd}
#svg{display:block;width:100%;height:auto}
.capbar{padding:9px 12px 7px;border-bottom:1px solid var(--line);margin:-8px -8px 8px;background:#f1f7f9;border-radius:8px 8px 0 0}
.capmeta{font-size:12.5px;color:var(--muted)}
.captitle{font-weight:700;font-size:16.5px;line-height:1.4;margin-top:1px}
.captext{font-size:14px;line-height:1.55;color:#22303c}
.capprog{height:3px;background:#d9e5ea;margin-top:7px;border-radius:2px;overflow:hidden}
.capprog i{display:block;height:100%;width:0;background:var(--accent)}
.analogy{margin:0 0 12px;padding:8px 12px;border-left:4px solid #b0842f;background:#fff9ec;border-radius:0 6px 6px 0;font-size:14px;max-width:100ch}
.analogy .hint{display:block;margin-top:2px}
.flowlist{margin:2px 0 0;padding-left:0;list-style:none;display:grid;gap:3px}
.flowlist li{display:grid;grid-template-columns:auto auto 1fr;gap:6px;align-items:baseline;font-size:13.5px}
.flowlist .no{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#52606d;color:#fff;font-size:12px;font-weight:700}
.flowlist .fk{font-size:12px;border:1px solid;border-radius:4px;padding:0 6px;white-space:nowrap}
.fk.k-req{color:var(--info);border-color:#9bbbe0}.fk.k-ok{color:var(--ok);border-color:#98cfae}.fk.k-fail{color:var(--bad);border-color:#e6aaa6}.fk.k-comp{color:var(--comp);border-color:#c5b0e0}.fk.k-lost{color:var(--bad);border-color:#e6aaa6;border-style:dotted}
.stagecap{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);padding:6px 8px 2px}

.controls{display:grid;gap:10px}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent);background:var(--accent-bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:84px}
.btn.primary:hover{background:#094f66}
.btn:disabled{opacity:.45;cursor:not-allowed}
.crow label{display:flex;gap:6px;align-items:center;font-size:14px}
.crow select{border:1px solid var(--line2);border-radius:6px;padding:6px 8px;background:#fff;min-height:38px}
.slider{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.slider input[type=range]{width:100%;min-height:28px;accent-color:var(--accent)}
.stepno{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted)}

.explain h3{font-size:17px;margin:0 0 6px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tag{font-size:12px;border-radius:4px;padding:1px 7px;border:1px solid;line-height:1.6;white-space:nowrap}
.tag.std{color:var(--info);border-color:#9bbbe0;background:#eef5fc}
.tag.teach{color:var(--warn);border-color:#e0c08a;background:#fdf5e6}
.tag.eng{color:var(--ok);border-color:#98cfae;background:#edf8f1}
.explain dl{margin:0}
.explain dt{font-weight:700;margin-top:10px;font-size:14px}
.explain dd{margin:2px 0 0;font-size:14.5px}
.explain dd ul{margin:2px 0 0;padding-left:18px}
.explain .note{margin-top:10px;border-left:4px solid var(--accent);background:var(--accent-bg);padding:8px 10px;border-radius:0 6px 6px 0;font-size:14px}
.explain .note b{color:var(--accent-ink)}

.sgrp{margin:0 0 8px}
.sgrp h4{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:600}
.sgrp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:13.5px}
.sgrp dt{color:var(--muted)}
.sgrp dd{margin:0;text-align:right;overflow-wrap:anywhere}
.sgrp dd.chg{background:var(--changed);border-radius:3px;padding:0 4px;font-weight:700}
.sgrp dd .chip{font-size:11px;color:#6a5200;margin-right:6px;font-weight:600}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)} .v-comp{color:var(--comp)} .v-mute{color:var(--ink)}

.bound ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.bound li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:14px}
.tl ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tl button{display:grid;grid-template-columns:26px 1fr;gap:6px;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:13.5px;line-height:1.45}
.tl button:hover{background:#f0f4f7}
.tl .mark{font-size:13px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.tl li.done .mark{color:var(--ok)}
.tl li.cur button{background:var(--accent-bg);font-weight:700}
.tl li.cur .mark{color:var(--accent)}
.tl li.todo{color:#6b7782}

/* SVG theme */
#svg text{font-family:var(--font)}
.flow{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:4 12;animation:flow .9s linear infinite;opacity:.9;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-16}}
.ripple{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rip .9s ease-out forwards;pointer-events:none}
@keyframes rip{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
.val.pop{transform-box:fill-box;transform-origin:100% 50%;animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.delta{font-size:14px;font-weight:700;text-anchor:end;paint-order:stroke;stroke:#fff;stroke-width:3.5px;animation:flt 1.6s ease-out forwards;pointer-events:none}
@keyframes flt{0%{opacity:0;transform:translateY(5px)}15%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.delta.neg{fill:var(--bad)}.delta.pos{fill:var(--ok)}
.lockbody{fill:#fff3cf;stroke:var(--warn);stroke-width:1.4}
.lockshk{fill:none;stroke:var(--warn);stroke-width:1.7}
.badge text{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle}
.badge circle{stroke:#fff;stroke-width:1.5}
.zone{fill:#f4f7fa;stroke:#c3ced9;stroke-dasharray:6 4}
.zonel{font-size:12.5px;fill:#52606d;font-weight:600}
.edge{stroke:#c0c9d2;stroke-width:2;fill:none}
.edge.cut{stroke:var(--bad);stroke-dasharray:3 5;stroke-width:2.4}
.cutx{fill:var(--bad);font-size:20px;font-weight:700;text-anchor:middle}
.node .box{fill:#fff;stroke:#8795a3;stroke-width:1.4}
.node.k-db .box{fill:#f2f9fb;stroke:#4f8ba0}
.node.k-coord .box{fill:#f7f5fc;stroke:#7c62b0}
.node.k-mq .box{fill:#fff9ec;stroke:#b0842f}
.node.k-ext .box{stroke-dasharray:6 3;fill:#fafafa}
.node.hl .box{stroke:var(--accent);stroke-width:3}
.node.down .box{stroke:var(--bad);stroke-dasharray:5 4;fill:var(--down-bg)}
.node.down .ttl,.node.down .lab,.node.down .val{opacity:.55}
.ttl{font-size:14px;font-weight:700;fill:var(--ink)}
.sub{font-size:11.5px;fill:#55636f}
.lab{font-size:12px;fill:#55636f}
.val{font-size:12.5px;font-weight:600;text-anchor:end}
.val.v-ok{fill:var(--ok)}.val.v-warn{fill:var(--warn)}.val.v-bad{fill:var(--bad)}.val.v-comp{fill:var(--comp)}.val.v-mute{fill:var(--ink)}
.rowbg{fill:transparent}
.rowbg.chg{fill:var(--changed)}
.val.chg{text-decoration:underline}
.downtag rect{fill:var(--bad)}
.downtag text{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.icon{fill:none;stroke:#52606d;stroke-width:1.4}
.mline{fill:none;stroke-width:2.6;stroke-linecap:round}
.mlabel rect{fill:#fff;stroke-width:1.2}
.mlabel text{font-size:12px;fill:var(--ink);text-anchor:middle}
.xmark{font-size:19px;font-weight:700;text-anchor:middle;dominant-baseline:central}

/* summary view */
#chExtra{margin-top:16px}
.sumsec{margin:0 0 18px}
.sumsec h2{font-size:18px;margin:0 0 8px}
.tblwrap{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;line-height:1.55}
table.cmp thead th{background:#e9eff4;position:sticky;top:0}
table.cmp tbody th{background:#f4f7f9;white-space:nowrap}
.lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.lines li{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fbfcfd;font-size:14px}
.lines b{display:block;margin-bottom:2px}
.tline{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.tline dt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.tline dd{margin:0}
.mis{display:grid;gap:10px}
.mis .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mis .bad,.mis .good{padding:8px 10px;border-radius:6px;font-size:14px}
.mis .bad{background:#fdeceb;border:1px solid #efb9b5}
.mis .good{background:#eaf6ef;border:1px solid #a9d6bb}
.mis b{display:block;font-size:12.5px;margin-bottom:2px}
dl.gl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;margin:0}
dl.gl dt{font-weight:700}
dl.gl dd{margin:0}
.q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;background:#fff}
.q legend{font-weight:700;padding:0 4px}
.q label{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;cursor:pointer}
.q .res{margin-top:6px;padding:8px 10px;border-radius:6px;font-size:14px}
.q .res.ok{background:#eaf6ef;border:1px solid #a9d6bb}
.q .res.no{background:#fdeceb;border:1px solid #efb9b5}
.score{font-weight:700}

footer.refs{margin-top:24px;border-top:1px solid var(--line2);padding-top:14px;font-size:13.5px}
footer.refs h2{font-size:16px;margin:0 0 6px}
footer.refs ul{margin:0 0 10px;padding-left:20px}
footer.refs li{margin:2px 0;overflow-wrap:anywhere}

@media (max-width:1180px){
  .labgrid{display:flex;flex-direction:column;gap:14px;align-items:stretch}
  .cola,.colb{display:contents}
  #p-stage{order:1}#p-ctrl{order:2}#p-explain{order:3}#p-state{order:4}#p-bound{order:5}#p-tl{order:6}
}
@media (max-width:760px){
  body{font-size:15px}
  .app{display:block}
  .nav{position:sticky;top:0;height:auto;z-index:20;padding:8px 8px 6px;overflow:visible}
  .brand{border:0;margin:0;padding:0 4px 6px;font-size:14px}.brand small{display:none}
  .nav ol{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .nav li{flex:0 0 auto}
  .nav button.chbtn{width:auto;white-space:nowrap;padding:6px 10px;background:#223341;align-items:center}
  .legend{display:none}
  main{padding:12px 10px 32px}
  .mhead h1{font-size:20px}
  .panel{padding:12px}
  .sctabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .sctabs button{flex:0 0 auto;max-width:78vw;scroll-snap-align:start;font-size:14px;padding:5px 10px}
  .nav button.chbtn .no{display:none}
  .mis .row{grid-template-columns:1fr}
  .lines{grid-template-columns:1fr}
  dl.gl{grid-template-columns:1fr}
  .btn{padding:8px 12px}
  .slider{grid-template-columns:1fr}
  table.cmp thead{display:none}
  table.cmp,table.cmp tbody,table.cmp tr,table.cmp th,table.cmp td{display:block;width:100%}
  table.cmp tr{margin:0 0 10px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  table.cmp th,table.cmp td{border:0;border-bottom:1px solid var(--line)}
  table.cmp td::before{content:attr(data-l);display:block;font-weight:700;color:var(--muted);font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>
<div class="app">
  <aside class="nav" aria-label="章节导航">
    <div class="brand">分布式事务<br>教学实验室<small>动画 · 故障 · 选型</small></div>
    <nav><ol id="chapterList"></ol></nav>
    <div class="legend" aria-label="图例">
      <b>消息图例</b>
      <div class="ln"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="#1b5ea8" stroke-width="3"/></svg>请求(实线)</div>
      <div class="ln"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="#1b7443" stroke-width="3"/></svg>成功响应</div>
      <div class="ln"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="#b3261e" stroke-width="3"/></svg>失败响应</div>
      <div class="ln"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="#6a3da3" stroke-width="3" stroke-dasharray="6 3"/></svg>补偿/取消(虚线)</div>
      <div class="ln"><svg width="34" height="10"><line x1="1" y1="5" x2="26" y2="5" stroke="#b3261e" stroke-width="3" stroke-dasharray="2 4"/><text x="27" y="9" font-size="11" fill="#b3261e">✕</text></svg>丢失/超时(点线+✕)</div>
      <div style="margin-top:8px">圆圈编号 = 消息先后<br>白点流动 = 流向<br>挂锁图标 = 持有锁</div>
      <div style="margin-top:8px"><span class="kbd">空格</span> 播放/暂停<br><span class="kbd">←</span><span class="kbd">→</span> 上/下一步<br><span class="kbd">R</span> 重播</div>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <div class="mhead">
      <h1 id="chTitle"></h1>
      <p class="intro" id="chIntro"></p>
      <p class="analogy" id="chAnalogy" hidden></p>
      <div class="sctabs" id="scTabs" role="group" aria-label="场景选择"></div>
    </div>
    <div id="labView" class="labgrid">
      <div class="cola">
        <section class="panel stage" id="p-stage" aria-label="流程图">
          <div class="capbar" id="capbar" aria-hidden="true"></div>
          <svg id="svg" role="img" aria-labelledby="svgTitle"><title id="svgTitle">流程图</title></svg>
          <div class="stagecap" id="stageCap"></div>
        </section>
        <section class="panel controls" id="p-ctrl" aria-label="播放控制">
          <div class="crow">
            <button class="btn primary" id="bPlay" type="button">播放</button>
            <button class="btn" id="bPrev" type="button">上一步</button>
            <button class="btn" id="bNext" type="button">下一步</button>
            <button class="btn" id="bReplay" type="button">重播</button>
            <label>速度
              <select id="selSpeed" aria-label="播放速度">
                <option value="0.5">0.5×(慢)</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×(快)</option>
              </select>
            </label>
            <label><input type="checkbox" id="chkReduce"> 减少动态效果</label>
          </div>
          <div class="slider">
            <span class="stepno" id="stepNo">步骤 1/1</span>
            <input type="range" id="rngStep" min="0" max="0" value="0" step="1" aria-label="步骤拖动">
          </div>
          <div class="hint">拖动滑块或点击右侧时间线可跳转到任意步骤,状态由该步骤的快照重新生成,不会残留其他步骤或场景的数据。</div>
        </section>
        <section class="panel bound" id="p-bound" aria-label="关键机制与边界"><h2>关键机制与边界</h2><ul id="boundList"></ul></section>
      </div>
      <div class="colb">
        <section class="panel explain" id="p-explain" aria-live="polite" aria-label="当前步骤说明"></section>
        <section class="panel" id="p-state" aria-label="状态面板"><h2>当前状态<span class="hint" style="font-weight:400"> (黄底 = 本步变化)</span></h2><div id="statePanel"></div></section>
        <section class="panel tl" id="p-tl" aria-label="事务时间线"><h2>事务时间线</h2><ol id="timeline"></ol></section>
      </div>
    </div>
    <div id="chExtra" hidden></div>
    <div id="sumView" hidden></div>
    <footer class="refs" id="refs"></footer>
  </main>
</div>
<script>
(function(){
'use strict';
/* ========== 基础工具 ========== */
const NS='http://www.w3.org/2000/svg';
const $=(s,r)=>(r||document).querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}

/* ========== 数据定义助手 ========== */
const TOPO={}, CH=[], REFS=[];
const M=(f,t,l,k,w,lp)=>({f,t,l,k:k||'req',w:w||0,lp:lp==null?0.5:lp});
const St=(t,a,b,r,o)=>({t,a,b,r,o:o||{}});
const Sc=(id,title,topo,init,steps,kind)=>({id,title,topo,init:init||{},steps,kind:kind||'正常路径'});

/* ========== 状态格式与着色 ========== */
function fmt(v){if(typeof v==='number')return v.toLocaleString('zh-CN');return v==null?'—':String(v);}
function vcls(v){const s=String(v);
  if(/失败|FAIL|拒绝|宕机|不可达|死信|DEAD|超限|丢失|悬挂|中断|分歧|不一致|重复提交|多扣|错误/.test(s))return 'bad';
  if(/ING|待|PENDING|UNKNOWN|未知|PROCESSING|PREPARED|PRECOMMIT|TRIED|WAIT|READY|重试|等待|阻塞|持有|人工|占用|冻结|ACTIVE|IDLE|TRYING|未提交|未生效|中间态|RECOVER|未确认|未报送|缺/.test(s))return 'warn';
  if(/补偿|冲正|CANCEL|COMPENSAT|作废|ROLL|回滚|ABORT|已取消|空回滚|追回|追款/.test(s))return 'comp';
  if(/成功|SUCCESS|COMMIT|CONFIRM|已生效|已完成|已入账|DONE|SENT|已投递|已报送|已受理|已对平|已关闭|已确认|ACK|已处理|COMPLETED|已闭环|已释放|已留痕|已记录|已修复/.test(s))return 'ok';
  return 'mute';}
const MCOL={req:'#1b5ea8',ok:'#1b7443',fail:'#b3261e',comp:'#6a3da3',lost:'#b3261e'};

/* ========== 全局状态 ========== */
const reduceMQ=window.matchMedia('(prefers-reduced-motion: reduce)');
const narrowMQ=window.matchMedia('(max-width: 760px)');
const S={once:false,ch:0,sc:0,step:0,p:1,playing:false,speed:1,reduce:reduceMQ.matches,mode:narrowMQ.matches?'tall':'wide',last:0,applied:''};
const G={nodes:{},boxes:{},msgs:[],edges:{},topo:null,sc:null};
const DUR=4200;

function curCh(){return CH[S.ch];}
function curSc(){const c=curCh();return c.scenarios?c.scenarios[S.sc]:null;}

function compile(sc){
  if(sc._c)return;
  const T=TOPO[sc.topo];
  let cur=Object.assign({down:[],cut:[]},clone(T.init||{}),clone(sc.init||{}));
  sc.snaps=[clone(cur)];
  sc.steps.forEach(st=>{cur=Object.assign({},cur,clone(st.o.s||{}));sc.snaps.push(clone(cur));});
  const lm={};T.nodes.forEach(n=>n.rows.forEach(([k,l])=>{lm[k]={n:n.title,l};}));
  const tt={};T.nodes.forEach(n=>tt[n.id]=n.title);
  sc.lm=lm;sc.tt=tt;sc._c=true;
}
function diffList(sc,i){
  const a=sc.snaps[i],b=sc.snaps[i+1],out=[];
  Object.keys(sc.lm).forEach(k=>{
    if(JSON.stringify(a[k])!==JSON.stringify(b[k])){out.push(`${sc.lm[k].n} · ${sc.lm[k].l}:${fmt(a[k])} → ${fmt(b[k])}`);}
  });
  (b.down||[]).filter(x=>!(a.down||[]).includes(x)).forEach(x=>out.push(`${sc.tt[x]}:宕机/不可达`));
  (a.down||[]).filter(x=>!(b.down||[]).includes(x)).forEach(x=>out.push(`${sc.tt[x]}:恢复可用`));
  const nm=c=>{const [p,q]=c.split('|');return `${sc.tt[p]}–${sc.tt[q]}`;};
  (b.cut||[]).filter(x=>!(a.cut||[]).includes(x)).forEach(x=>out.push(`链路 ${nm(x)}:网络分区(中断)`));
  (a.cut||[]).filter(x=>!(b.cut||[]).includes(x)).forEach(x=>out.push(`链路 ${nm(x)}:恢复连通`));
  return out;
}

/* ========== 版面与 SVG ========== */
function layout(T){
  const wide=S.mode==='wide';
  const W=wide?860:420,H=wide?Math.round((T.h||520)*0.94):(T.th||780),boxes={};
  T.nodes.forEach(n=>{
    const wd=n.wd?n.wd[wide?0:1]:(wide?188:186);
    const nr=n.rows.length,hh=(n.sub?46:34)+nr*21+(nr?6:0);
    const p=wide?n.w:n.t;
    let x=p[0]*W/100-wd/2,y=p[1]*H/100-hh/2;
    x=clamp(x,4,W-4-wd);y=clamp(y,4,H-4-hh);
    boxes[n.id]={x,y,w:wd,h:hh,cx:x+wd/2,cy:y+hh/2,n};
  });
  return {W,H,boxes};
}
function anchor(b,tx,ty,gap){
  const dx=tx-b.cx,dy=ty-b.cy;if(!dx&&!dy)return {x:b.cx,y:b.cy};
  const sx=(b.w/2+gap)/Math.max(Math.abs(dx),1e-9),sy=(b.h/2+gap)/Math.max(Math.abs(dy),1e-9);
  const t=Math.min(sx,sy);return {x:b.cx+dx*t,y:b.cy+dy*t};
}
function fit(el,maxW,base,min){
  let fs=base;el.style.fontSize=fs+'px';el.setAttribute('data-fs',fs);
  if(!el.getComputedTextLength)return;
  let guard=0;
  while(el.getComputedTextLength()>maxW&&fs>(min||9.5)&&guard++<30){fs-=0.5;el.style.fontSize=fs+'px';}
  el.setAttribute('data-fs',fs);
}
function icon(kind,x,y,g){
  if(kind==='db'){mk('ellipse',{class:'icon',cx:x+7,cy:y+3,rx:7,ry:3},g);mk('path',{class:'icon',d:`M${x} ${y+3}v9c0 1.8 3.1 3 7 3s7-1.2 7-3v-9M${x} ${y+7.5}c0 1.8 3.1 3 7 3s7-1.2 7-3`},g);}
  else if(kind==='mq'){[0,5.5,11].forEach(o=>mk('rect',{class:'icon',x:x+o,y:y,width:4,height:14,rx:1},g));}
  else if(kind==='coord'){mk('circle',{class:'icon',cx:x+7,cy:y+7,r:6.5},g);mk('path',{class:'icon',d:`M${x+7} ${y+2}v5l3 2`},g);}
  else if(kind==='ext'){mk('rect',{class:'icon',x:x,y:y+1,width:12,height:12,rx:2,'stroke-dasharray':'3 2'},g);mk('path',{class:'icon',d:`M${x+6} ${y+8}l7-7m-4 0h4v4`},g);}
  else{mk('rect',{class:'icon',x:x,y:y+1,width:14,height:12,rx:2},g);mk('path',{class:'icon',d:`M${x+3} ${y+5}h8M${x+3} ${y+9}h5`},g);}
}

function buildTopology(){
  const sc=curSc(),T=TOPO[sc.topo],svg=$('#svg');
  G.topo=T;G.sc=sc;
  const L=layout(T);G.L=L;G.boxes=L.boxes;
  svg.setAttribute('viewBox',`0 0 ${L.W} ${L.H}`);
  while(svg.childNodes.length>1)svg.removeChild(svg.lastChild);
  const gz=mk('g',{},svg),ge=mk('g',{},svg),gt=mk('g',{},svg),gn=mk('g',{},svg),gm=mk('g',{},svg);
  G.gm=gm;G.gt=gt;G.gfx=mk('g',{},svg);
  (T.zones||[]).forEach(z=>{const p=S.mode==='wide'?z.w:z.t;const x=p[0]*L.W/100,y=p[1]*L.H/100,w=p[2]*L.W/100,hh=p[3]*L.H/100;
    mk('rect',{class:'zone',x,y,width:w,height:hh,rx:10},gz);mk('text',{class:'zonel',x:x+10,y:y+17},gz,z.l);});
  G.edges={};
  T.edges.forEach(([a,b])=>{
    const A=L.boxes[a],B=L.boxes[b];
    const pa=anchor(A,B.cx,B.cy,2),pb=anchor(B,A.cx,A.cy,2);
    const g=mk('g',{},ge);
    const ln=mk('line',{class:'edge',x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y},g);
    const xm=mk('text',{class:'cutx',x:(pa.x+pb.x)/2,y:(pa.y+pb.y)/2+7},g,'✕');xm.style.display='none';
    G.edges[a+'|'+b]={ln,xm};G.edges[b+'|'+a]=G.edges[a+'|'+b];
  });
  G.nodes={};
  T.nodes.forEach(n=>{
    const b=L.boxes[n.id];
    const g=mk('g',{class:'node k-'+n.kind,'data-id':n.id},gn);
    mk('rect',{class:'box',x:b.x,y:b.y,width:b.w,height:b.h,rx:n.kind==='db'?10:6},g);
    const hasIcon=!n.noIcon;
    if(hasIcon)icon(n.kind,b.x+10,b.y+9,g);
    const ttl=mk('text',{class:'ttl',x:b.x+(hasIcon?32:12),y:b.y+22},g,n.title);
    fit(ttl,b.w-(hasIcon?44:24)-22,14,10.5);
    if(n.sub){mk('text',{class:'sub',x:b.x+(hasIcon?32:12),y:b.y+38},g,n.sub);}
    const y0=b.y+(n.sub?46:34),rows={};
    n.rows.forEach(([k,l],i)=>{
      const ry=y0+i*21;
      const bg=mk('rect',{class:'rowbg',x:b.x+4,y:ry,width:b.w-8,height:19,rx:3},g);
      const lab=mk('text',{class:'lab',x:b.x+10,y:ry+14},g,l);
      const val=mk('text',{class:'val',x:b.x+b.w-10,y:ry+14},g,'');
      let lw=0;try{lw=lab.getComputedTextLength();}catch(e){}
      rows[k]={bg,lab,val,maxW:b.w-20-lw-8,ax:b.x+b.w-10,ay:ry+14};
    });
    const tag=mk('g',{class:'downtag'},g);tag.style.display='none';
    mk('rect',{x:b.x+b.w-58,y:b.y-9,width:56,height:18,rx:9},tag);mk('text',{x:b.x+b.w-30,y:b.y+4},tag,'不可达');
    const lock=mk('g',{class:'lockb'},g);lock.style.display='none';
    mk('rect',{class:'lockbody',x:b.x+b.w-25,y:b.y+15,width:12,height:9,rx:2},lock);
    mk('path',{class:'lockshk',d:`M${b.x+b.w-22} ${b.y+15}v-3a3 3 0 0 1 6 0v3`},lock);
    G.nodes[n.id]={g,rows,tag,lock};
  });
  G.applied='';
}

function applyState(snap,prev,showChange,fx){
  const T=G.topo;
  T.nodes.forEach(n=>{
    const e=G.nodes[n.id];
    n.rows.forEach(([k,,cls])=>{
      const r=e.rows[k],v=fmt(snap[k]);
      const ch=showChange&&JSON.stringify(snap[k])!==JSON.stringify(prev[k]);
      r.val.textContent=v;
      r.val.setAttribute('class','val v-'+(cls||vcls(v))+(ch?' chg':'')+(ch&&fx?' pop':''));
      fit(r.val,r.maxW,12.5,9.5);
      r.bg.setAttribute('class','rowbg'+(ch?' chg':''));
      if(ch&&fx&&typeof snap[k]==='number'&&typeof prev[k]==='number'){
        const d=snap[k]-prev[k];let w=0;try{w=r.val.getComputedTextLength();}catch(_){}
        const t=mk('text',{class:'delta '+(d<0?'neg':'pos'),x:r.ax-w-8,y:r.ay},G.gfx,(d<0?'−':'+')+Math.abs(d).toLocaleString('zh-CN'));
        setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t);},1700);
      }
    });
    const down=(snap.down||[]).includes(n.id);
    e.g.classList.toggle('down',down);e.tag.style.display=down?'':'none';
    e.lock.style.display=n.rows.some(([k])=>/^持有/.test(String(snap[k])))?'':'none';
  });
  const cutset={};(snap.cut||[]).forEach(c=>{cutset[c]=1;const [a,b]=c.split('|');cutset[b+'|'+a]=1;});
  Object.keys(G.edges).forEach(k=>{const e=G.edges[k],cut=!!cutset[k];e.ln.classList.toggle('cut',cut);e.xm.style.display=cut?'':'none';});
  renderStatePanel(snap,prev,showChange);
}
function renderStatePanel(snap,prev,showChange){
  const T=G.topo,box=$('#statePanel');let html='';
  T.nodes.forEach(n=>{
    if(!n.rows.length&&!(snap.down||[]).includes(n.id))return;
    html+=`<div class="sgrp"><h4>${esc(n.title)}${(snap.down||[]).includes(n.id)?'(不可达)':''}</h4><dl>`;
    n.rows.forEach(([k,l,cls])=>{
      const v=fmt(snap[k]),ch=showChange&&JSON.stringify(snap[k])!==JSON.stringify(prev[k]);
      html+=`<dt>${esc(l)}</dt><dd class="v-${cls||vcls(v)}${ch?' chg':''}">${ch?'<span class="chip">变化</span>':''}${esc(v)}</dd>`;
    });
    html+='</dl></div>';
  });
  box.innerHTML=html;
}

/* ========== 消息粒子 ========== */
function rectOverlap(a,b,pad){
  const w=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)+pad,h=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)+pad;
  return (w>0&&h>0)?w*h:0;
}
function buildMsgs(st){
  const gm=G.gm;while(gm.firstChild)gm.removeChild(gm.firstChild);G.msgs=[];
  const LANE=11,W=G.L.W,H=G.L.H;
  const list=(st.o.m||[]).filter(m=>G.boxes[m.f]&&G.boxes[m.t]);
  const WV=list.length?Math.max.apply(null,list.map(m=>m.w+1)):1;
  const grp={};list.forEach(m=>{const k=m.f+'>'+m.t;(grp[k]=grp[k]||[]).push(m);});
  const obst=Object.keys(G.boxes).map(id=>{const b=G.boxes[id];return {x:b.x,y:b.y,w:b.w,h:b.h};});
  const placed=[];
  list.forEach(m=>{
    const g0=grp[m.f+'>'+m.t];
    let lp0=m.lp;
    if(g0.length>1&&m.lp===0.5){lp0=0.3+0.4*g0.indexOf(m)/(g0.length-1);}
    const ca=m.f<m.t?m.f:m.t,cb=m.f<m.t?m.t:m.f;
    const CA=G.boxes[ca],CB=G.boxes[cb];
    const P=anchor(CA,CB.cx,CB.cy,3),Q=anchor(CB,CA.cx,CA.cy,3);
    const dx=Q.x-P.x,dy=Q.y-P.y,len0=Math.hypot(dx,dy)||1;
    const nx=-dy/len0,ny=dx/len0,sgn=(m.f===ca?1:-1);
    const s=m.f===ca?P:Q,e=m.f===ca?Q:P;
    const sx=s.x+nx*sgn*LANE,sy=s.y+ny*sgn*LANE,ex=e.x+nx*sgn*LANE,ey=e.y+ny*sgn*LANE;
    const L=Math.hypot(ex-sx,ey-sy),ux=(ex-sx)/L,uy=(ey-sy)/L;
    const col=MCOL[m.k]||MCOL.req;
    const g=mk('g',{},gm);
    const dash=m.k==='comp'?'8 4':(m.k==='lost'?'2 6':'none');
    const line=mk('line',{class:'mline',stroke:col,'stroke-dasharray':dash,x1:sx,y1:sy,x2:sx,y2:sy},g);
    const flow=mk('line',{class:'flow',x1:sx,y1:sy,x2:sx,y2:sy},g);flow.style.display='none';
    const t2=mk('circle',{r:3,fill:col,opacity:.28},g),t1=mk('circle',{r:4.2,fill:col,opacity:.5},g);
    t1.style.display=t2.style.display='none';
    const dot=mk('circle',{r:5.5,fill:col,stroke:'#fff','stroke-width':2},g);
    const tri=mk('path',{d:'M9 0L-3 -6L-3 6Z',fill:col},g);
    const xm=mk('text',{class:'xmark',fill:col},g,'✕');xm.style.display='none';
    const numbered=WV>1,NW=numbered?21:0;
    const lg=mk('g',{class:'mlabel'},g);
    const rect=mk('rect',{height:20,rx:5,stroke:col},lg);
    const tx=mk('text',{},lg,m.l);
    let tw=60;try{tw=tx.getComputedTextLength();}catch(_){}
    const pw=tw+14+NW;rect.setAttribute('width',pw);
    const ext=Math.abs(nx)*pw/2+Math.abs(ny)*10,side=sgn*(ext+4);
    const lps=[0],offs=[0,side];
    for(let k=1;k<=8;k++){lps.push(0.07*k,-0.07*k);}
    let best=null;
    for(const dlp of lps){
      const lp=clamp(lp0+dlp,0.1,0.9);
      for(const off of offs){
        const cx=sx+(ex-sx)*lp+nx*off,cy=sy+(ey-sy)*lp+ny*off;
        const r={x:cx-pw/2,y:cy-10,w:pw,h:20};
        let cost=Math.abs(dlp)*12+Math.abs(off)*0.15;
        obst.forEach(o=>{cost+=rectOverlap(r,o,1)>0?2000+rectOverlap(r,o,1):0;});
        placed.forEach(o=>{cost+=rectOverlap(r,o,3)>0?2000+rectOverlap(r,o,3):0;});
        if(r.x<2||r.y<2||r.x+r.w>W-2||r.y+r.h>H-2)cost+=1500;
        if(!best||cost<best.cost)best={cost,r};
      }
      if(best&&best.cost<20)break;
    }
    const r=best.r;
    const px=clamp(r.x,3,W-3-pw),py=clamp(r.y,3,H-23);
    rect.setAttribute('x',px);rect.setAttribute('y',py);tx.setAttribute('x',px+NW+(pw-NW)/2);tx.setAttribute('y',py+14.5);
    let badge=null;
    if(numbered){badge=mk('g',{class:'badge'},lg);mk('circle',{cx:px+12,cy:py+10,r:8,fill:col},badge);mk('text',{x:px+12,y:py+13.9},badge,String(m.w+1));}
    placed.push({x:px,y:py,w:pw,h:20});
    G.msgs.push({m,g,line,flow,t1,t2,dot,tri,xm,lg,badge,sx,sy,ex,ey,L,ux,uy,col,arrived:false});
  });
}
function drawTrail(){
  const gt=G.gt;if(!gt)return;while(gt.firstChild)gt.removeChild(gt.firstChild);
  const sc=G.sc;if(!sc.trail)return;
  for(let j=0;j<S.step;j++){
    (sc.steps[j].o.m||[]).forEach(m=>{
      const A=G.boxes[m.f],B=G.boxes[m.t];if(!A||!B)return;
      const P=anchor(A,B.cx,B.cy,3),Q=anchor(B,A.cx,A.cy,3);
      const col=MCOL[m.k]||MCOL.req,L=Math.hypot(Q.x-P.x,Q.y-P.y)||1,ux=(Q.x-P.x)/L,uy=(Q.y-P.y)/L;
      mk('line',{x1:P.x,y1:P.y,x2:Q.x-ux*6,y2:Q.y-uy*6,stroke:col,'stroke-width':3,opacity:.5,'stroke-dasharray':m.k==='fail'?'6 5':'none','stroke-linecap':'round'},gt);
      mk('path',{d:'M9 0L-3 -6L-3 6Z',fill:col,opacity:.6,transform:`translate(${Q.x-ux*2} ${Q.y-uy*2}) rotate(${Math.atan2(uy,ux)*180/Math.PI})`},gt);
    });
  }
}
function ripple(id,col){
  const b=G.boxes[id];if(!b||!G.gfx)return;
  const r=mk('rect',{class:'ripple',x:b.x-4,y:b.y-4,width:b.w+8,height:b.h+8,rx:12,stroke:col},G.gfx);
  setTimeout(()=>{if(r.parentNode)r.parentNode.removeChild(r);},950);
}
function paintMsgs(p){
  const ms=G.msgs;if(!ms.length)return;
  const W=Math.max.apply(null,ms.map(o=>o.m.w+1)),MS=0.72;
  ms.forEach(o=>{
    const a=MS*o.m.w/W,b=MS*(o.m.w+1)/W;
    const q=(p>=1||S.reduce)?1:clamp((p-a)/(b-a),0,1);
    if(q<=0){o.g.style.display='none';return;}
    o.g.style.display='';
    const lost=o.m.k==='lost',f=q*(lost?0.55:1);
    const TIP=9,dist=lost?f*o.L:f*Math.max(0,o.L-TIP);
    const cx=o.sx+o.ux*dist,cy=o.sy+o.uy*dist;
    o.line.setAttribute('x2',cx);o.line.setAttribute('y2',cy);
    o.dot.setAttribute('cx',cx);o.dot.setAttribute('cy',cy);
    const ang=Math.atan2(o.uy,o.ux)*180/Math.PI;
    o.tri.setAttribute('transform',`translate(${cx+o.ux*5} ${cy+o.uy*5}) rotate(${ang})`);
    if(lost){o.tri.style.display=q>=1?'none':'';o.dot.style.display=q>=1?'none':'';o.xm.style.display=q>=1?'':'none';o.xm.setAttribute('x',cx);o.xm.setAttribute('y',cy);}
    else{o.xm.style.display='none';o.dot.style.display=q>=1?'none':'';}
    const tr=q<1&&!S.reduce;
    o.t1.style.display=o.t2.style.display=tr?'':'none';
    if(tr){const d1=Math.max(0,dist-13),d2=Math.max(0,dist-26);
      o.t1.setAttribute('cx',o.sx+o.ux*d1);o.t1.setAttribute('cy',o.sy+o.uy*d1);
      o.t2.setAttribute('cx',o.sx+o.ux*d2);o.t2.setAttribute('cy',o.sy+o.uy*d2);}
    const fl=!lost&&q>=0.12&&!S.reduce;
    o.flow.style.display=fl?'':'none';o.flow.setAttribute('x2',cx);o.flow.setAttribute('y2',cy);
    o.lg.style.display=q>0.2?'':'none';
    if(q>=1&&!o.arrived){o.arrived=true;if(!lost&&!S.reduce&&S.p<1)ripple(o.m.t,o.col);}
  });
}

/* ========== 步骤渲染 ========== */

function plain(x){return String(x).replace(/<[^>]+>/g,'');}
function firstSent(x){const t=plain(x),m=t.match(/^[^。]+。?/);return m?m[0]:t;}
function renderCaption(){
  const sc=G.sc,i=S.step,st=sc.steps[i],nx=sc.steps[i+1];
  $('#capbar').innerHTML=`<div class="capmeta">步骤 ${i+1}/${sc.steps.length} · ${nx?'下一步:'+esc(nx.t):'这是最后一步'}</div><div class="captitle">${esc(st.t)}</div><div class="captext">${esc(firstSent(st.a))}</div><div class="capprog"><i id="capprog"></i></div>`;
}
function renderExplain(){
  const sc=G.sc,i=S.step,st=sc.steps[i],box=$('#p-explain');
  const tg=(st.o.tg||['teach']).map(t=>`<span class="tag ${t}">${TAGN[t]}</span>`).join('');
  const df=diffList(sc,i);
  const lb=Object.assign({a:'发生了什么',flow:'消息流向(图中编号对应)',b:'为什么这样做',c:'改变了哪些状态',r:'存在什么风险 / 下一步',noflow:'本步没有消息流动,发生的是内部处理、判断或状态变化。',nochg:'本步没有改变持久状态(只有消息、判断或决策)。'},sc.lb||{});
  const chg=df.length?`<ul>${df.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:lb.nochg;
  const ms=st.o.m||[],WV=ms.length?Math.max.apply(null,ms.map(m=>m.w+1)):1;
  const flow=ms.length?'<ol class="flowlist">'+ms.map(m=>`<li><span class="no" title="${WV>1?'第 '+(m.w+1)+' 批':'同时发出'}">${WV>1?m.w+1:'·'}</span><span class="fk k-${m.k}">${KN[m.k]}</span><span>${esc(sc.tt[m.f])} → ${esc(sc.tt[m.t])}:${esc(m.l)}</span></li>`).join('')+'</ol>':lb.noflow;
  box.innerHTML=`<h3>步骤 ${i+1}/${sc.steps.length}:${esc(st.t)}</h3><div class="tags">${tg}</div><dl>
    <dt>${lb.a}</dt><dd>${st.a}</dd>
    <dt>${lb.flow}</dt><dd>${flow}</dd>
    <dt>${lb.b}</dt><dd>${st.b}</dd>
    <dt>${lb.c}</dt><dd>${chg}</dd>
    <dt>${lb.r}</dt><dd>${st.r}</dd></dl>${st.o.n?`<div class="note"><b>边界辨析:</b>${st.o.n}</div>`:''}`;
}
function renderTimeline(){
  const sc=G.sc,ol=$('#timeline');
  if(ol.dataset.sc!==sc.id){
    ol.dataset.sc=sc.id;ol.innerHTML='';
    sc.steps.forEach((st,i)=>{const li=h('li',{'data-i':i});const b=h('button',{type:'button'},`<span class="mark"></span><span>${esc(st.t)}</span>`);b.addEventListener('click',()=>{pause();go(i,true);});li.appendChild(b);ol.appendChild(li);});
  }
  [].forEach.call(ol.children,(li,i)=>{
    li.className=i<S.step?'done':(i===S.step?'cur':'todo');
    li.querySelector('.mark').textContent=i<S.step?'✓':(i===S.step?'●':(i+1));
    const b=li.querySelector('button');if(i===S.step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
  });
}
function renderControls(){
  if(!G.sc)return;
  const sc=G.sc,n=sc.steps.length,r=$('#rngStep');
  r.max=n-1;r.value=S.step;
  r.setAttribute('aria-valuetext',`第 ${S.step+1} 步:${sc.steps[S.step].t}`);
  $('#stepNo').textContent=`步骤 ${S.step+1}/${n}`;
  $('#bPlay').textContent=S.playing?'暂停':(S.step>=n-1&&S.p>=1?'重新播放':'播放');
  $('#bPrev').disabled=S.step<=0&&S.p>=1;
  $('#bNext').disabled=S.step>=n-1;
}
function showStep(){
  const sc=G.sc,st=sc.steps[S.step];
  if(G.gfx)while(G.gfx.firstChild)G.gfx.removeChild(G.gfx.firstChild);
  drawTrail();buildMsgs(st);renderExplain();renderCaption();renderTimeline();renderControls();
  const hl={};(st.o.m||[]).forEach(m=>{hl[m.f]=1;hl[m.t]=1;});(st.o.hl||[]).forEach(x=>hl[x]=1);
  Object.keys(G.nodes).forEach(id=>G.nodes[id].g.classList.toggle('hl',!!hl[id]));
  const sn=sc.snaps[S.step+1];
  $('#svgTitle').textContent=`${sc.title} — 步骤 ${S.step+1}:${st.t}`;
  G.applied='';paint();
}
function paint(){
  const sc=G.sc,i=S.step,dp=S.reduce?1:S.p;
  const useAfter=dp>=0.72;
  const key=sc.id+'|'+i+'|'+useAfter+'|'+S.mode;
  if(key!==G.applied){G.applied=key;applyState(useAfter?sc.snaps[i+1]:sc.snaps[i],sc.snaps[i],useAfter,useAfter&&S.p<1&&!S.reduce);}
  paintMsgs(dp);
  const cp=$('#capprog');if(cp)cp.style.width=(dp>=1?100:dp*100)+'%';
}

/* ========== 播放循环 ========== */
let raf=0;
function tick(ts){
  if(!S.playing&&!S.once){raf=0;return;}
  const dt=Math.min(100,ts-S.last);S.last=ts;
  const d=(S.reduce?3200:DUR)/S.speed;
  S.p+=dt/d;
  if(S.p>=1){
    if(S.once){S.once=false;S.p=1;paint();renderControls();raf=0;return;}
    if(S.step<G.sc.steps.length-1){S.step++;S.p=0;showStep();}
    else{S.p=1;S.playing=false;paint();renderControls();raf=0;return;}
  }else paint();
  raf=requestAnimationFrame(tick);
}
function play(){
  const n=G.sc.steps.length;
  if(S.step>=n-1&&S.p>=1){S.step=0;S.p=0;showStep();}
  else if(S.p>=1&&S.step<n-1){S.step++;S.p=0;showStep();}

}
function stepOnce(i){

function syncHash(){try{history.replaceState(null,'',`#c=${S.ch}&s=${S.sc}&i=${S.step}`);}catch(e){}}
function renderNav(){

function renderHead(){

function renderTabs(){

}
function selectChapter(i,sc,step){
  pause();S.ch=i;S.sc=sc||0;S.step=0;

  $('#labView').hidden=false;$('#sumView').hidden=true;

}

/* ========== 事件 ========== */
function wire(){

  $('#bReplay').addEventListener('click',replay);

  const chk=$('#chkReduce');chk.checked=S.reduce;

    if(tag==='INPUT'&&t.type==='range')return;
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;

}

})();

<script>

])]});

CH.push({nav:'技术分层',title:'技术分层:协议、接口规范与业务方案',
intro:'把“分布式事务”拆成四层来看:谁定义规则、谁定义接口、谁在业务里落地、谁真正保存数据。这样才能解释“XA 不等于 2PC”。',
bounds:[
['std','XA 是 X/Open DTP 模型里事务管理器(TM)与资源管理器(RM)之间的接口规范;2PC 是原子提交协议。XA 的 prepare/commit 接口支持 2PC,并允许单资源一阶段提交优化,但它们不是同一个东西。'],
['std','数据库自身的准备态能力(如 PostgreSQL 的 PREPARE TRANSACTION)是给外部事务管理器使用的原语,不建议应用代码直接使用。'],
['eng','TCC、Saga、Outbox 属于业务方案层:它们依赖各库的本地事务,但并不使用 XA 接口,也不依赖数据库级 prepare。']],
scenarios:[
Sc('2a','一次 XA 全局事务穿过四层','layers',{},[
 St('四层总览','自上而下:业务方案层(要解决什么业务问题)→ 接口规范与框架层(TM 与 RM 如何对话)→ 协议层(怎样投票和决策)→ 资源层(数据库真正保存数据)。','分层的目的是把“规则”“接口”“落地”区分开,否则容易把 XA、2PC、TCC 当成同一类东西。','混层理解的后果:以为“用了 XA 就一定占锁”或“用了 TCC 就能完全避免锁”,这两种说法都不准确。',{hl:['l4','l3','l2','l1']}),
 St('业务方案层提出需求','放款业务要求“扣减账户”和“创建借据”一起成败,于是选择用 XA 全局事务。','业务方案层决定“要不要跨库原子”以及“选哪种方案承担”。','选了强一致方案,就要接受它的锁占用与协调者依赖。',{m:[],s:{r4:'声明需要跨库原子的业务',e4:'放款=扣款+借据'},hl:['l4']}),
 St('框架层:调用 XA 接口','框架(如 JTA 事务管理器、Seata XA 模式)创建全局事务号,并通过 XA 接口 xa_start / xa_end / xa_prepare / xa_commit / xa_recover 与各数据库对话。','XA 把“TM 怎样驱动 RM”标准化,不同厂商的数据库与事务管理器才能互通。','XA 只规定接口,不替你实现决策日志、恢复和监控。',{m:[M('l4','l3','全局事务请求')],s:{r3:'约定 TM 与 RM 如何交互',e3:'XA 接口 + JTA / Seata XA'},tg:['std'],hl:['l3']}),
 St('协议层:两阶段提交','XA 接口背后通常运行 2PC:所有参与者先投票(prepare),协调者持久化全局决策后,再通知提交或回滚。','协议规定了“什么条件下才能提交”“崩溃后怎样恢复”。','协议正确不代表实现正确;决策日志是否持久、超时规则是否合理,仍取决于实现。',{m:[M('l3','l2','prepare / commit')],s:{r2:'规定投票、决策与恢复规则',e2:'两阶段提交 2PC'},tg:['std'],hl:['l2']}),
 St('资源层:数据库保存准备态','数据库把分支修改和“已准备”状态持久化,并保留锁。PostgreSQL 的 PREPARE TRANSACTION / COMMIT PREPARED 就是这一层对外的原语。','只有资源层真正持有数据和锁;上层的接口与协议最终都要落到这里。','准备态事务持有锁,必须由外部事务管理器及时收尾,否则会长期占用资源。',{m:[M('l2','l1','PREPARE / COMMIT PREPARED')],s:{r1:'本地事务、日志、锁与准备态',e1:'MySQL / Oracle / PostgreSQL'},tg:['std'],hl:['l1']}),
 St('结果逐层返回','数据库返回“已准备/已提交”,协议层汇总投票,框架层返回全局结果,业务层得到“放款成功”。','结果沿原路返回,每层只关心自己负责的那一段。','任何一层的超时都不能被上层误解释成“失败并可自行回滚”。',{m:[M('l1','l2','已提交','ok'),M('l2','l3','全局提交','ok',1),M('l3','l4','业务成功','ok',2)],s:{e4:'放款完成'}}),
 St('辨析:XA ≠ 2PC','XA 是接口规范(TM–RM 之间的函数/命令),2PC 是协议(投票与决策规则)。XA 还允许单个 RM 时走一阶段优化;反过来,2PC 也可由数据库内部或自研组件实现而不经 XA。','把两者混同,会误以为“关闭 XA 就没有 2PC”或“用了 2PC 就等于 XA”。','选型时应分别问:接口是否标准(能否与现有数据库互通)?协议是否满足可用性和延迟要求?',{n:'错误说法:“XA 就是两阶段提交。”准确说法:XA 是支持两阶段提交的接口规范,2PC 是被它调用的协议之一。',tg:['std']})
]),
Sc('2b','TCC、Saga、Outbox 在哪一层','layers',{},[
 St('它们都属于业务方案层','TCC、Saga、Outbox 都由业务代码或业务框架定义“怎样恢复一致”:Try/Confirm/Cancel、补偿动作、待发消息表。','这些方案不要求数据库支持 prepare,因此对数据库类型更宽容。','代价是恢复逻辑要由业务实现并测试,出错面更大。',{s:{r4:'由业务定义怎样恢复一致',e4:'TCC / Saga / Outbox'},hl:['l4']}),

 St('协议层:由业务状态机承担','这些方案没有数据库级的“准备态等待”,而是用业务状态(TRYING、已冻结、已补偿、待发送)加重试来驱动一致。','业务状态可以随本地事务立即提交,避免长时间持锁。','没有 2PC 的原子保证,中间态会被其他事务看到(见 TCC、Saga 章节)。',{m:[M('l3','l2','状态推进 + 重试')],s:{r2:'业务状态 + 重试 + 日志',e2:'(无数据库 prepare)'},hl:['l2']}),
 St('资源层仍依赖本地事务','每个业务动作最终仍落在某个库的本地事务里:冻结、创建借据、写 outbox 都是普通本地事务,提交后立即释放行锁。','所有这些方案的基石依然是“单库内的 ACID”。','本地事务以外的部分(跨服务、跨库)才是它们要额外设计的。',{m:[M('l2','l1','本地事务提交')],s:{r1:'各库本地事务',e1:'各自独立的数据库'},hl:['l1']}),
 St('代价上移到业务','相比 XA,锁占用更短、吞吐更高,但隔离性、幂等、悬挂、补偿失败和对账都需要业务自己负责。','没有免费的午餐:XA 把复杂度放在基础设施里,业务方案把复杂度放在业务里。','在资金类场景里,业务实现错误的后果可能比慢更严重。',{n:'不要把“业务方案层”理解成“自动一致”。它们只是提供了可以恢复一致的结构。'})
],'分层辨析')]});

bounds:[
['std','XA 是 TM 与 RM 之间的接口规范(xa_start/end/prepare/commit/rollback/recover/forget);2PC 是它所支持的协议。XA 不等于 2PC。'],
['std','PREPARED 的事务继续持有锁,应由外部事务管理器尽快提交或回滚(PostgreSQL 文档)。2PC 的锁占用时间包括整个两阶段与故障恢复时间。'],
['std','准备态不能仅凭超时自行回滚:RM 投 YES 后已经承诺,恢复要依据 TM 持久化的全局决策与 xa_recover 的结果。RM 的“启发式”提交/回滚可能与全局决策冲突,需要 xa_forget 和对账善后。'],
['eng','一旦已持久化 COMMIT 决策,恢复只能继续重试提交,不能为了处理超时改成回滚。'],
['eng','2PC 保证的前提:TM 决策日志与各 RM 的 prepared 记录都是持久的;这两项失效,原子性就无从谈起。']],
scenarios:[
Sc('3a','正常提交','xa',{},head().concat([
 St('第一阶段:Prepare 与投票','TM 向两个 RM 发 xa_prepare。每个 RM 把分支修改和“已准备”状态持久化(写日志),保留行锁,回复 YES。','投 YES 的含义是承诺:之后只要 TM 说提交,我一定能提交成功。为兑现承诺,RM 必须先持久化并保住锁。','投出 YES 后,RM 失去单方面回滚的权利,进入“不确定期”,必须等 TM 的最终决定。',{m:[M('tm','rm1','xa_prepare'),M('tm','rm2','xa_prepare'),M('rm1','tm','YES','ok',1),M('rm2','tm','YES','ok',1)],s:{b1:'PREPARED',b2:'PREPARED',gtx:'已收齐 YES'},n:'PostgreSQL 文档:已准备事务继续持有锁,应由外部事务管理器尽快提交或回滚。',tg:['std']}),
 St('TM 先持久化全局决策','两个 RM 全部 YES,TM 决定“提交”,并先把这个决策写入自己的持久化日志,然后才通知 RM。','决策日志是恢复的依据:TM 崩溃重启后,读到 COMMIT 就知道要继续提交。','若先通知再写日志,崩溃后 TM 不知道自己已经决定过什么。',{s:{dlog:'COMMIT 已持久化',gtx:'COMMITTING'},tg:['std','eng']}),
 St('第二阶段:Commit 并释放锁','TM 向两个 RM 发 xa_commit。RM 把已准备的修改变为已提交,释放行锁,回复 ACK。','提交是确定性动作:已 PREPARED 的分支,只要收到 commit 就应能完成。','提交消息可能丢失或重复,RM 的 commit 必须可以重复执行并返回结果(幂等)。',{m:[M('tm','rm1','xa_commit'),M('tm','rm2','xa_commit'),M('rm1','tm','ACK','ok',1),M('rm2','tm','ACK','ok',1)],s:COMMITTED,tg:['std']}),
 St('全局事务结束','收齐 ACK 后,TM 把全局事务标记为 COMMITTED 并通知应用;决策日志在确认全部 ACK 后可清理。','收齐 ACK 才能确认没有分支遗落在不确定状态。','2PC 的代价:至少两轮往返、全程持锁、TM 成为关键依赖,吞吐与可用性受限。',{m:[M('tm','app','提交成功','ok')],s:{gtx:'COMMITTED',app:'放款完成',dlog:'COMMIT 已完成'}})
])),
Sc('3b','准备失败:借据库投 NO','xa',{},head().concat([
 St('准备阶段:借据库投 NO','账户库准备成功并投 YES;借据库因约束冲突(例如借据号重复)无法准备,投 NO。投 NO 的 RM 会回滚自己的分支并释放锁。','prepare 之前 RM 仍保有单方面中止的权利;一旦投 NO,这个分支就不可能再提交,可以立即清理。','账户库此时已是 PREPARED,锁还在,必须等 TM 通知回滚,不能因为“听说有人失败”就自行放弃。',{m:[M('tm','rm1','xa_prepare'),M('tm','rm2','xa_prepare'),M('rm1','tm','YES','ok',1),M('rm2','tm','NO:约束冲突','fail',1)],s:{b1:'PREPARED',b2:'已回滚',pd2:'无',lk2:'已释放',loan:'无',gtx:'收到 NO 票'},tg:['std']}),
 St('TM 持久化 ABORT 决策','只要有一票 NO,全局决策就是回滚。TM 先把 ABORT 决策写入日志。','与提交一样,回滚决策也要先落盘再通知,才能在崩溃后恢复。','账户库仍持锁等待;TM 要尽快发出 rollback,缩短阻塞窗口。',{s:{dlog:'ABORT 已持久化',gtx:'ROLLING BACK'},tg:['std','eng']}),
 St('第二阶段:Rollback','TM 向已准备的账户库发 xa_rollback。账户库丢弃未提交的扣减,余额保持 1,000,释放行锁,回复 ACK。','只有已 PREPARED 的分支才需要 TM 通知;借据库已自行清理。','rollback 消息同样可能丢失或重复,RM 必须幂等。',{m:[M('tm','rm1','xa_rollback','comp'),M('rm1','tm','ACK','ok',1)],s:{b1:'已回滚',pd1:'无',lk1:'已释放',bal:1000},tg:['std']}),
 St('全局回滚完成','TM 把全局事务标记为 ROLLED BACK,通知应用放款失败。两个库都回到初始状态,数据一致。','失败也要有确定的终态,不能留在中间。','应用要把这次失败映射为明确的业务结果(例如“放款申请失败,可重试”)。',{m:[M('tm','app','放款失败','fail')],s:{gtx:'ROLLED BACK',app:'放款失败,数据一致'},n:'2PC 的回滚是数据库级的:分支内未提交的修改被丢弃。这与 Saga 的“业务补偿”有本质区别。'})
])),
Sc('3c','协调者失联:决策已持久化,Commit 未送达','xa',{},[
 St('初始状态','账户库余额 1,000 元,借据库为空。全局事务 G-1001 将要提交(开启、分支执行、END 的过程与“正常提交”相同)。','为了聚焦故障,本场景从两个分支即将准备开始。','故障总是出现在最不方便的时刻:决策已定、通知未到。',{s:{app:'空闲'}}),
 St('两库均已 PREPARED','两个分支已执行并准备完成,均回复 YES,各自持有行锁。','这就是 2PC 的“不确定期”起点。','从此刻起,两个 RM 都不能单方面决定结果。',{m:[M('tm','rm1','xa_prepare'),M('tm','rm2','xa_prepare'),M('rm1','tm','YES','ok',1),M('rm2','tm','YES','ok',1)],s:PREP}),
 St('TM 持久化 COMMIT 决策','TM 收齐 YES,决定提交,并把 COMMIT 决策写入持久化日志。','先落盘,才能在崩溃后恢复。','全局结果其实已经确定:提交。',{s:{dlog:'COMMIT 已持久化',gtx:'COMMITTING'},tg:['std','eng']}),
 St('TM 宕机,Commit 未送达','TM 在发出 Commit 的瞬间崩溃(或网络中断),两个 RM 都没有收到。应用只看到超时。','故障在最坏的时点:事实上已决定提交,但 RM 还不知道。','应用侧不能把超时当作失败重试放款,否则可能产生重复业务。',{m:[M('tm','rm1','xa_commit','lost'),M('tm','rm2','xa_commit','lost')],s:{down:['tm'],app:'等待超时'}}),
 St('准备态阻塞:RM 不能自作主张','RM 处于 PREPARED。它已承诺 YES:既不能自行回滚(TM 可能已决定提交),也不能自行提交(也许另有分支投了 NO)。行锁继续占用,别的事务访问这些行会排队。','这就是 2PC 的“阻塞”:唯一安全的出路是拿到全局决策。','锁占用时间不可控,会放大成热点账户排队、连接池耗尽。XA 允许 RM 做“启发式”提交/回滚,但可能与全局决策不一致,要靠 xa_forget 和人工对账善后,只能作为最后手段。',{s:{lk1:'持有·有人等待',lk2:'持有·有人等待'},n:'错误说法:“准备态超时后可以自行回滚。”准确说法:准备态超时只应告警、继续查询,并依据持久化的全局决策恢复。',tg:['std','eng']}),
 St('TM 重启并读取决策日志','TM 重启,从持久化日志读到 G-1001 的决策是 COMMIT,状态为“提交中”。','决策日志让“提交”这个决定不依赖内存。','日志本身必须可靠(多副本或强刷盘),它是整个方案的单点。',{s:{down:[],gtx:'RECOVERING'},tg:['std','eng']}),
 St('xa_recover:找回待决分支','TM 向各 RM 调用 xa_recover,拿到仍处于 PREPARED 的分支清单(包含 G-1001),与日志对照。','XA 的恢复接口就是为这种崩溃场景设计的。','若某个 RM 的 prepared 记录没有持久化,它就无法兑现承诺,属于严重故障。',{m:[M('tm','rm1','xa_recover'),M('tm','rm2','xa_recover'),M('rm1','tm','G-1001 PREPARED','ok',1),M('rm2','tm','G-1001 PREPARED','ok',1)],tg:['std']}),
 St('重发 Commit,恢复完成','TM 按日志重发 xa_commit,RM 提交并释放锁,回复 ACK。全局事务最终 COMMITTED,放款完成(延迟)。','恢复的方向由已持久化的决策决定:继续提交。','已持久化 COMMIT 之后,不能因为恢复慢就改成回滚,否则会与已提交的分支冲突。',{m:[M('tm','rm1','xa_commit'),M('tm','rm2','xa_commit'),M('rm1','tm','ACK','ok',1),M('rm2','tm','ACK','ok',1)],s:Object.assign({},COMMITTED,{gtx:'COMMITTED',app:'放款完成(延迟)',dlog:'COMMIT 已完成'}),n:'错误说法:“提交遇到超时就可以改成取消。”准确说法:提交决策一旦形成,只能继续重试直到完成。'})
],'故障路径'),
Sc('3d','协调者失联:决策尚未落盘','xa',{},[
 St('初始状态','账户库余额 1,000 元,借据库为空。全局事务 G-1001 将要提交。','与 3c 对照:这次宕机发生在写决策日志之前。','不同的宕机时点,恢复方向可能相反。',{s:{app:'空闲'}}),
 St('两库均已 PREPARED','两个分支都已准备并回复 YES,持有行锁。','与 3c 相同的起点。','RM 同样进入不确定期。',{m:[M('tm','rm1','xa_prepare'),M('tm','rm2','xa_prepare'),M('rm1','tm','YES','ok',1),M('rm2','tm','YES','ok',1)],s:PREP}),
 St('TM 在写决策日志前宕机','TM 刚收齐 YES,还没来得及持久化任何决策就宕机。日志里没有 COMMIT。','这是与 3c 的关键差别:没有已形成的提交决策。','RM 仍然阻塞,锁继续占用。',{s:{down:['tm'],app:'等待超时'}}),
 St('TM 重启:日志里没有 COMMIT','TM 重启后查日志,G-1001 没有提交记录。按所用协议的恢复规则(例如 presumed abort:没有提交记录就视为中止),TM 决定回滚。','这个“回滚”是 TM 依据持久化日志和协议规则作出的全局决策,再通知 RM 执行;不是 RM 因为等不到消息而自行超时回滚。','不同 TM 实现的默认规则不同,必须按所用产品的文档确认并做故障演练。',{s:{down:[],gtx:'RECOVERING',dlog:'ABORT 已持久化'},n:'区分:RM 超时后自行回滚(危险,可能与全局决策冲突) 与 TM 按日志规则作出决策后通知回滚(安全)。',tg:['std','eng']}),
 St('第二阶段:Rollback 并释放锁','TM 向两个 RM 发 xa_rollback,两个分支丢弃未提交修改,释放锁,回复 ACK。余额保持 1,000,借据不存在。','全局决策为回滚,所有分支必须一致回滚。','应用要得到明确的失败结果,并允许用同一业务号安全重试。',{m:[M('tm','rm1','xa_rollback','comp'),M('tm','rm2','xa_rollback','comp'),M('rm1','tm','ACK','ok',1),M('rm2','tm','ACK','ok',1)],s:Object.assign({},ROLLED,{gtx:'ROLLED BACK',app:'放款失败,数据一致'})})
],'故障路径')
]});
})();
</script>
<script>
(function(){
const {CH,M,St,Sc}=window.DT;

/* ---------- 第 4 章:3PC ---------- */
const W3={ph:'CanCommit',sa:'WAIT',sb:'WAIT',sc:'WAIT'};
const P3={ph:'PreCommit',dec:'COMMIT(已决定)',sa:'PRECOMMIT',sb:'PRECOMMIT',sc:'PRECOMMIT'};
const D3={ph:'DoCommit',dec:'COMMIT 已完成',sa:'COMMITTED',sb:'COMMITTED',sc:'COMMITTED',bal:900,loan:'已生效 100',risk:'已记录'};
const can=()=>St('第一阶段:CanCommit','协调者向 A、B、C 询问“能否提交”。参与者只做检查(额度、约束、资源是否可用),并回答 Yes;此时通常不做不可回退的动作。','把“询问能否”与“真正准备”拆开,是 3PC 比 2PC 多出的第一步:避免参与者过早进入准备并占用资源。','Yes 只是“目前看起来可以”,不是承诺。检查与后续真正执行之间,条件可能变化。',{m:[M('co','pa','CanCommit?'),M('co','pb','CanCommit?'),M('co','pc','CanCommit?'),M('pa','co','Yes','ok',1),M('pb','co','Yes','ok',1),M('pc','co','Yes','ok',1)],s:W3,tg:['std']});
CH.push({nav:'3PC',title:'3PC:CanCommit、PreCommit、DoCommit',
intro:'3PC 在 2PC 的“投票”和“提交”之间插入 PreCommit,让存活参与者在协调者失效后有机会通过状态推断全局决策。它的改进是有前提的。',
bounds:[
['std','3PC 由 Skeen 提出,目标是在特定故障模型下避免 2PC 的阻塞。它假设网络延迟有界、故障可被可靠检测;一旦出现网络分区或不可靠超时,两侧可能做出相反决定。'],
['std','Skeen 同期的“基于法定人数”的提交协议用于处理分区,说明 3PC 本身并不是分区下的答案。'],
['eng','非阻塞不等于更安全:3PC 多一轮消息、更多延迟,而生产系统的真实网络恰好常违反其前提,所以单独使用 3PC 并不常见。'],
['teach','本章用 A(账户库)、B(借据库)、C(风控记录)三个参与者演示;重点是状态差异而不是数据细节。']],
scenarios:[
Sc('4a','正常三阶段','p3',{},[
 St('初始状态','账户库 A 余额 1,000 元,借据库 B 无借据,风控库 C 无记录。协调者要在三处完成放款相关写入。','先固定起点。','三个参与者独立,仍需统一决定。',{s:{ph:'—'}}),
 can(),
 St('第二阶段:PreCommit','全部 Yes,协调者形成“提交”的决定,向所有参与者发 PreCommit。参与者进入 PRECOMMIT 状态(通常此时预留资源并写日志),并回复 ACK。','PreCommit 的意义:让每个存活参与者都知道“全局决定是提交”。看到 PRECOMMIT 的节点知道决定已定;看到 WAIT 的节点知道决定可能还没定。','PreCommit 消息若只到达一部分参与者,不同节点就处于不同阶段,这是后面分区场景的起点。',{m:[M('co','pa','PreCommit'),M('co','pb','PreCommit'),M('co','pc','PreCommit'),M('pa','co','ACK','ok',1),M('pb','co','ACK','ok',1),M('pc','co','ACK','ok',1)],s:P3,tg:['std']}),
 St('第三阶段:DoCommit','收齐 ACK 后,协调者发 DoCommit。三个参与者提交各自的数据:账户余额变 900、借据生效、风控记录写入。','最终提交动作放在最后,提交前所有参与者都已处于“可提交”状态。','DoCommit 消息可能丢失;参与者需要依据“已 PRECOMMIT”的状态在超时后自行提交(见后续场景)。',{m:[M('co','pa','DoCommit'),M('co','pb','DoCommit'),M('co','pc','DoCommit'),M('pa','co','ACK','ok',1),M('pb','co','ACK','ok',1),M('pc','co','ACK','ok',1)],s:D3,tg:['std']}),
 St('相对 2PC 的改进与代价','改进:在前提成立时,协调者宕机后,存活参与者可以通过互相交换状态推断出结果,不必无限阻塞。代价:多一轮往返,延迟更高;协议更复杂。','把“已决定提交”和“真正提交”分成两个可观察的状态。','非阻塞结论依赖同步模型(延迟有界、故障检测可靠)。在丢包、延迟抖动、分区的真实网络里,这些前提不一定成立。',{n:'错误说法:“3PC 彻底解决了 2PC 的阻塞问题。”准确说法:在延迟有界且无分区等前提下可避免阻塞;前提被破坏时可能出现不一致。',tg:['std']})
]),
Sc('4b','网络分区:各节点处于不同阶段','p3',{},[
 St('初始状态','账户库 A、借据库 B、风控库 C 的初始状态与 4a 相同。','与 4a 同起点,便于对照。','故障会让三者看到不同的消息序列。',{s:{ph:'—'}}),
 can(),
 St('PreCommit 只送达账户库 A','协调者形成“提交”决定,发出 PreCommit。A 收到并进入 PRECOMMIT;发往 B、C 的消息在网络中丢失,它们仍停在 WAIT。','网络并不保证对所有节点同时可达。','此时三个参与者处于不同阶段:A=PRECOMMIT,B=WAIT,C=WAIT。',{m:[M('co','pa','PreCommit'),M('pa','co','ACK','ok',1),M('co','pb','PreCommit','lost'),M('co','pc','PreCommit','lost')],s:{ph:'PreCommit',dec:'COMMIT(已决定)',sa:'PRECOMMIT'}}),
 St('网络分区形成','网络分裂为两部分:一侧是协调者和 A,另一侧是 B 和 C。两侧之间的链路全部中断。','分区是真实网络里的正常故障形态,不是极端假设。','两侧都无法确认对方是“宕机”还是“只是联系不上”。',{s:{cut:['co|pb','co|pc','pa|pb','pa|pc'],ph:'分区中'}}),
 St('两侧各按超时规则行动','A 在 PRECOMMIT 状态超时:规则是“决定已是提交”,于是自行提交,余额变 900。B、C 在 WAIT 状态超时且联系不上协调者:规则是“尚未决定,可安全中止”,于是自行中止。','这两条规则在“无分区、故障可准确检测”的前提下是安全的。','分区破坏了前提:A 看到的是“已决定”,B、C 却无从知道这一点。',{s:{sa:'COMMITTED',bal:900,sb:'ABORTED',sc:'ABORTED'},tg:['std']}),
 St('结果:原子性被破坏','账户已扣 100 元,借据与风控记录都没有生成。分区恢复后,没有任何一方知道谁“对”,协议本身没有办法自动合并。','这就是 3PC 在分区下的核心风险:为了避免阻塞,换来了可能的不一致。','只能依赖日志、对账或人工修复(补建借据、冲正扣款);资金场景代价很高。',{s:{dec:'结果分歧'},n:'错误说法:“3PC 在任意网络分区下都不会阻塞也不会出错。”准确说法:非阻塞是有前提的,前提被破坏时可能出现提交/中止分歧。',tg:['std']}),
 St('边界与替代思路','Skeen 的基于法定人数的提交协议、Paxos Commit 等通过多数派避免分裂决策;工程上更常见的是 2PC + 可靠决策日志,或放弃强一致改用 TCC / Saga / Outbox。','把“协调者是否可靠”交给复制与共识,而不是靠超时猜测。','这些方案各自有复杂度和性能代价;选型要结合业务对一致性和可用性的真实要求。',{tg:['std','eng']})
],'故障路径'),
Sc('4c','协调者宕机:前提成立时的非阻塞恢复','p3',{},[

]});

 St('2PC / XA:让多个库同成同败','要让两个以上的库对“提交还是回滚”达成一致。两阶段提交(2PC)在 20 世纪 70 年代末已有系统描述;X/Open 的 XA 规范(90 年代初)把事务管理器与资源管理器之间的接口标准化,让异构数据库也能配合。',
  '先让所有参与者“准备并承诺”(Prepare),协调者把全局决策持久化后,再通知提交或回滚;XA 接口统一了 start / end / prepare / commit / rollback / recover 等调用。',
  '① 准备态持有锁,锁占用 = 整个两阶段 + 故障恢复时间;② 协调者在决策后失联,参与者只能阻塞等待恢复;③ 多轮同步往返,吞吐与延迟受限;④ 要求参与者支持 XA,第三方接口、非数据库资源很难纳入。→ 有人想“去掉阻塞”,有人想“去掉长锁”,于是分成两条路。',
  {m:[M('loc','xa','跨库原子')],s:{s1:FIN.s1,n1:FIN.n1},tg:['std'],hl:['xa']}),
 St('路线一:3PC 想去掉阻塞','保持强一致,但不想在协调者宕机时让参与者无限等待。Skeen 在 1981 年前后提出三阶段提交(3PC):在 Prepare 之后增加 PreCommit。',
  'PreCommit 让存活的参与者能通过互相交换状态来推断全局决定,协调者失效时不必无限阻塞。',
  '非阻塞依赖“延迟有界、故障可准确检测、无网络分区”。真实网络里这些前提常不成立,分区下两侧可能做出相反决定(见第 4 章);还多一轮往返,更慢。→ 靠超时去猜的路走不通。另一条同步路线是用共识复制协调者(Gray 与 Lamport 的 Paxos Commit),本页不展开。',
  {m:[M('xa','p3','怕阻塞')],s:{s2:FIN.s2,n2:FIN.n2},tg:['std'],hl:['p3'],n:'3PC 不是“2PC 的完全升级版”:它用更强的网络假设换取非阻塞,假设被破坏时可能出现不一致。'}),
 St('路线二:TCC 把“准备”挪到业务层','放弃“数据库层的跨库同步原子提交”,改在业务层做预留。Pat Helland 2007 年的论文总结了大规模系统“拒绝分布式事务”后常用的做法;“暂定操作 + 确认/取消”的思路与 TCC 一脉相承,Seata 等框架提供了工程化实现。',
  'Try 用一个会立即提交的本地事务“预留”资源(冻结 100 元),Confirm 消耗预留,Cancel 释放预留;数据库行锁很快释放,还能纳入非数据库资源。',
  '① 业务侵入:每个服务都要写 Try / Confirm / Cancel;② 幂等、空回滚、防悬挂必须自己保证;③ 预留的中间态对外可见,没有全局隔离;④ Confirm / Cancel 必须最终成功,只能向前重试。→ 参与者多、流程长、第三方不可能都为你写“预留”接口时,TCC 就推不动了。',
  {m:[M('xa','tcc','嫌锁太长'),M('p3','tcc','前提难满足','fail')],s:{s3:FIN.s3,n3:FIN.n3},tg:['std','eng'],hl:['tcc']}),
 St('Saga:流程长、参与者多','流程很长,或部分参与者只能提供“做”和“撤”,无法提供“预留”。Garcia-Molina 与 Salem 在 1987 年提出 Saga:把长事务拆成一串本地事务。',
  '每一步立即提交、立即释放资源;任何一步失败,按相反顺序执行各步的补偿动作。参与者只需提供“正向 + 补偿”两个接口。',
  '① 放弃隔离:已提交但最终会被补偿的数据,其他人能读到;② 补偿不是回滚,可能失败、也可能不可逆(出款、短信);③ 补偿同样要幂等、防悬挂;④ 需要持久化的流程状态与人工通道。→ 无论 TCC 还是 Saga,每个服务内部都要“写库 + 通知下一步”,这两件事本身就可能只成功一半。',
  {m:[M('tcc','saga','要长流程')],s:{s4:FIN.s4,n4:FIN.n4},tg:['std'],hl:['saga']}),
 St('Outbox + MQ:解决“写库 + 发消息”的双写','服务“写本库”与“发消息给别人”是两个动作:写成功但消息没发出去,下游永远不知道;先发消息再写库失败,下游会收到“幻影”消息。',
  '把业务变更和“待发送消息”放进同一个本地事务;独立的投递器稍后读取并发送到 MQ,收到 Broker 确认后再标记已发送。',
  '① 只保证“本库业务 + 发送意图”原子,外部系统仍不是原子的;② 至少一次投递 → 消息会重复,消费者必须幂等并区分处理状态;③ 外部结果可能未知,需要稳定幂等键与查询确认;④ 重试必须有上限,超限进入死信,靠对账和人工收尾。→ 机制越多,越需要治理来兜底。',
  {m:[M('saga','ob','双写问题')],s:{s5:FIN.s5,n5:FIN.n5},tg:['std','eng'],hl:['ob']}),
 St('组合与治理:机制总会有失效的时候','日志可能丢,重试可能耗尽,对账可能发现差异。银行信贷这类场景需要“分域选型 + 持续治理”。',
  '核心资金域用 TCC 之类强约束方案;异步报送用 Outbox + MQ;再用全局事务号、分支日志、状态机、监控告警、恢复任务、T+0 / T+1 对账、人工处置与审计兜底。',
  '系统与运维复杂度上升;多种方案并存,要求团队理解各自的成立前提;对账周期决定发现延迟;任何前提不再成立(幂等被破坏、告警没人看),保证就会失效。',
  {m:[M('ob','gov','会失效')],s:{s6:FIN.s6,n6:FIN.n6},tg:['eng'],hl:['gov']}),
 St('回看全图:不是替代,是取舍','这条线是“按问题推进的逻辑演化”,不是严格的历史先后,更不是新方案淘汰旧方案。',
  '它们在一致性强度、锁占用、业务侵入、隔离性、恢复复杂度之间交换代价:越往后,越不阻塞、可用性越高,但让出的隔离性越多,恢复与治理的负担越转移到业务和运维。',
  '2PC / XA 在“参与者少、同构数据库、必须强一致”的场景仍然合理;TCC、Saga、Outbox 常常在同一个系统里同时出现。选型看业务能容忍什么,而不是哪个更新。',
  {hl:ALL,tg:['eng'],n:'错误说法:“Saga/TCC 取代了 2PC”。准确说法:它们是在不同约束下换了一种代价,各有成立前提。'})
]);

   ['2PC / XA','多个库要同成同败','准备 + 持久化决策 + 提交/回滚;XA 统一 TM–RM 接口','持锁时间长;协调者失联时阻塞;吞吐低;要求参与者支持 XA','去阻塞 → 3PC;去长锁 → TCC'],
   ['3PC','协调者宕机时不要无限阻塞','增加 PreCommit,存活者可推断结果','前提苛刻(有界延迟、可靠故障检测、无分区),分区可能分歧;更慢','放弃“超时猜测”,转向业务层最终一致(或用共识复制协调者)'],

   ['组合 + 治理','机制失效后如何发现、恢复、收尾','全局号、日志、监控、恢复、对账、人工处置','复杂度与运维成本;前提需要长期维护','—']];

   +'<li><b>锁与可用性</b>持锁直到全局结束 → 预留后立即释放短锁 → 没有跨服务的锁。可用性和吞吐随之提高。</li>'

}
